{id:"bkk-cooking",s:"bkk",c:"fun",t:"Thai-Kochkurs mit Marktbesuch",q:"Thai cooking class Bangkok",d:"Halbtags-Kochkurs: erst Markt mit Kräutern und Gewürzen, dann kocht ihr vier bis fünf Gerichte selbst, zum Beispiel Tom Yum, Curry, Pad Thai und ein Dessert. Das Essen esst ihr danach. Eine der beliebtesten Aktivitäten bei Reisenden.",h:"Meist Vormittag oder Nachmittag, 3–4 Std.",p:"ca. 1.200–1.800 THB pro Person. GetYourGuide (17.11.2026): ca. 25–38 € pro Person, 4,9 bis 5,0 von 5 bei 1.200 bis 1.800 Bewertungen",z:"3–4 Std.",w:"Abholung vom Hotel oder Treffpunkt an einer Skytrain-Station",tips:["Schulen mit kleinen Gruppen und guten aktuellen Bewertungen wählen.","Vegetarische Variante vorher ankündigen.","Am Anfang der Reise machen, dann kocht ihr zu Hause nach."]},
{id:"bkk-muaythaiclass",s:"bkk",c:"fun",t:"Muay-Thai-Probetraining",q:"Muay Thai gym trial class Bangkok",d:"Ein bis zwei Stunden Pratzen, Tritte und Kondition im Gym, geführt von einem Trainer. Anfänger sind willkommen, es wird nicht gekämpft. Gut, um das Nationalsport-Erlebnis selbst zu spüren und nicht nur zuzuschauen.",h:"Meist Vormittags und am späten Nachmittag",p:"ca. 500–1.000 THB für eine Stunde Probetraining",z:"1,5–2 Std.",w:"Gyms liegen in vielen Stadtvierteln, meist mit Grab oder Skytrain erreichbar",tips:["Bequeme Sportkleidung mitnehmen, Handtuch und Wasser gibt es oft vor Ort.","Vorher klären, ob Gebühr für Handschuhe und Bandagen anfällt.","Nicht am selben Tag wie lange Fahrten legen, ihr werdet müde sein."]},
{id:"cnx-climbing",s:"cnx",c:"fun",t:"Klettern am Crazy Horse Buttress",q:"Crazy Horse Buttress climbing Chiang Mai",d:"Klettern am Fels in der Nähe von Chiang Mai, geeignet für Anfänger mit Guide und Fortgeschrittene. Die Saison ist von November bis April am besten, also genau in eurem Zeitraum. Halbtags-Touren mit Material und Transport.",h:"Meist Vormittag, Abholung in der Stadt",p:"ca. 1.800–2.500 THB für eine Halbtagestour",z:"4–6 Std. inklusive Anfahrt",w:"Ca. 45–60 Min. von Chiang Mai, mit dem Anbieter-Bus",tips:["Anbieter mit zertifizierten Guides und Sicherungsmaterial prüfen.","Sonnenschutz, Wasser und feste Schuhe mitnehmen.","Wer Klettern in Railay plant, kann hier schon üben."]},
{id:"pai-walking",s:"pai",c:"night",t:"Pai Walking Street",q:"Pai Walking Street",d:"Jeden Abend füllt sich die Hauptstraße von Pai mit Streetfood, Kunsthandwerk und Livemusik. Entspannter und kleiner als die Märkte in Bangkok oder Chiang Mai, typisch für die Backpacker-Stimmung der Stadt.",h:"Täglich ab ca. 17–18 Uhr bis spät",p:"Eintritt frei, Gerichte ab ca. 30–80 THB",z:"1,5–2 Std.",w:"Zu Fuß vom Zentrum",tips:["Bargeld in kleinen Scheinen mitnehmen.","Nach Sonnenuntergang wird es kühl, eine Jacke einpacken.","Die vielen Stände mit gegrilltem Essen und Süßem lohnen den Umweg über die Seitengassen."]},
{id:"pai-canyon",s:"pai",c:"nature",t:"Pai Canyon zum Sonnenuntergang",q:"Pai Canyon",d:"Schmale Grate zwischen tiefen Schluchten aus rotem Lehm, mit Blick über das Tal. Zum Sonnenuntergang ein beliebter Spot. Die Wege sind schmal und ohne Geländer.",h:"Ganztägig zugänglich, am schönsten am späten Nachmittag",p:"Eintritt frei oder kleine Spende",z:"1–1,5 Std.",w:"Ca. 8 km südlich von Pai, mit Roller, Taxi oder Songthaew",tips:["Feste Schuhe und nicht bei Regen gehen.","Auf den schmalen Graten Abstand halten und nicht drängeln.","Vor Sonnenuntergang kommen, es wird sonst voll."]},
{id:"pai-waterfall",s:"pai",c:"nature",t:"Mo-Paeng-Wasserfall",q:"Mo Paeng Waterfall Pai",d:"Wasserfall mit natürlichen Rutschen in der Nähe von Pai. Im März führt er weniger Wasser als in der Regenzeit, zum Baden reicht es meist trotzdem.",h:"Tagsüber",p:"Eintritt frei, ggf. kleine Gebühr für Parken",z:"1–2 Std.",w:"Ca. 8 km von Pai, mit Roller oder Taxi",tips:["Badesachen und Wassersandalen mitnehmen.","Bei wenig Wasser ist das Rutschen weniger spaßig, vorher fragen.","Mit Pai Canyon an einem Tag kombinieren."]},
{id:"pai-hotsprings",s:"pai",c:"nature",t:"Heiße Quellen bei Pai",q:"Tha Pai Hot Springs",d:"Natürliche heiße Quellen in einem Park, in denen ihr in kleinen Becken baden könnt. Gut am Morgen, wenn die Luft noch frisch ist, oder nach einem Tag auf dem Roller.",h:"Meist 7–18 Uhr",p:"Eintritt ca. 100–300 THB (vor Ort prüfen)",z:"1–2 Std.",w:"Ca. 7 km von Pai, mit Roller, Taxi oder Songthaew",tips:["Nicht zu heiß einsteigen, die Becken haben unterschiedliche Temperatur.","Handtuch und Badesachen mitnehmen.","Wertsachen im Hotel lassen."]},
{id:"pai-bamboo",s:"pai",c:"sight",t:"Bambusbrücke Boon Ko Ku So",q:"Boon Ko Ku So bamboo bridge Pai",d:"Eine lange Fußgängerbrücke aus Bambus über Reisfelder, im Sonnenaufgang oder bei Dämmerung ein beliebter Fotospot. Im März sind die Felder oft braun.",h:"Tagsüber",p:"Eintritt ca. 20–50 THB",z:"30–60 Min.",w:"Ca. 5–8 km von Pai, mit Roller oder Taxi",tips:["Früh am Morgen kommen, dann ist es leer.","Im März sind die Felder eher trocken, ein anderes Bild als in der Regenzeit.","Nach Regen kann der Weg rutschig sein."]},
{id:"krb-dws",s:"krb",c:"fun",t:"Deep-Water-Solo (Klettern über dem Meer)",q:"Deep water solo Railay Krabi",d:"Klettern am Kalkfelsen ohne Seil, über dem Wasser: Fallt ihr, landet ihr im Meer. Mit Guide, Booten und Einweisung auch für Anfänger. Ein Highlight für alle, die in Railay klettern.",h:"Halbtags oder ganztags, meist Vormittag",p:"ca. 1.800–2.500 THB für einen halben Tag",z:"4–6 Std.",w:"Abholung am Strand von Ao Nang oder Railay mit dem Boot",tips:["Nur mit seriösen Anbietern, die Einweisung und Rettungsmaterial haben.","Badesachen und eine Bandage für die Hände sind hilfreich.","Wer Höhenangst hat, kann niedrigere Routen wählen."]},
{id:"lan-dive",s:"lan",c:"fun",t:"Tauchtag Koh Lanta (Hin Daeng und Hin Muang)",q:"diving Koh Lanta Hin Daeng Hin Muang",d:"Koh Lanta ist Ausgangspunkt für Tauchplätze wie Hin Daeng und Hin Muang. Mit einem Tauchtag oder Schnuppertauchen erlebt ihr Riffe mit Fischschwärmen. Mit Tauchschein möglich, sonst ein Schnupper-Dive mit Guide.",h:"Ganztags, Abfahrt früh am Morgen",p:"Fun-Dive mit zwei Tauchgängen ab ca. 3.500–4.500 THB, Schnuppertauchen ähnlich",z:"Ganzer Tag",w:"Abholung vom Hotel, Boot ab Saladan",tips:["Tauchschein-Anfänger nehmen das Schnuppertauchen, nicht den Hin-Daeng-Tag.","Nach dem Tauchen 18–24 Stunden nicht fliegen, deshalb nicht am Abreisetag.","Versicherung mit Tauchschutz prüfen."]},
/* ---------- PHUKET ---------- */
{id:"phu-oldtown",s:"phu",c:"sight",t:"Phuket Old Town (Thalang Road und Soi Romanee)",wp:"Phuket Town",q:"Phuket Old Town Thalang Road",d:"Bunte Sino-Portugiesische Kaufmannshäuser, Street Art, Cafés und kleine Museen. Zu Fuß gut in 2–3 Stunden zu erkunden. Die schönste Seite von Phuket abseits der Strände.",h:"Den ganzen Tag, am schönsten vormittags und am späten Nachmittag",p:"Eintritt frei, Kaffee und Essen ca. 100–300 THB",z:"2–3 Std.",w:"Von Kata ca. 45–60 Min. mit Taxi oder Grab, Songthaew ca. 40–60 Min. (Tuk-Tuk Kata–Altstadt nur nach Preisverhandlung)",tips:["Kombiniert sich mit dem Sunday Walking Street Market, wenn ihr am Sonntag dort seid.","Soi Romanee ist die fotogenste Gasse, früh am Tag, bevor es voll wird.","Feste Schuhe nicht nötig, aber Hut und Wasser, es ist heiß."]},
{id:"phu-sunday",s:"phu",c:"market",t:"Sunday Walking Street (Lard Yai) in der Altstadt",wp:"Phuket Town",q:"Lard Yai Sunday Walking Street Phuket",d:"Jeden Sonntag wird die Thalang Road zur Fußgängerzone mit Streetfood, Kunsthandwerk und Livemusik. Einer der besten Märkte der Insel, weniger touristisch als die Strandmärkte.",h:"Sonntag ca. 16:00–22:00",p:"Eintritt frei, Essen ca. 300–600 THB",z:"2–3 Std.",w:"Von Kata ca. 45–60 Min. mit Grab/Taxi, am Abend Rückfahrt vorher klären",tips:["Nur sonntags. Der 14.2.2027 ist ein Sonntag, passt also genau.","Früh kommen (ca. 16:30), dann ist weniger los und alles ist frisch.","Mit der Old-Town-Runde am Nachmittag kombinieren."]},
{id:"phu-chalong",s:"phu",c:"sight",t:"Wat Chalong",wp:"Wat Chalong",q:"Wat Chalong Phuket",d:"Der bedeutendste Tempel der Insel mit reich verzierter Pagode und Mönchsunterricht. Ruhig, kostenlos und gut kombinierbar mit Big Buddha.",h:"Täglich ca. 7:00–17:00",p:"Eintritt frei",z:"45–60 Min.",w:"Von Kata ca. 20 Min. mit Taxi oder Grab",tips:["Angemessen kleiden (Schultern und Knie bedeckt).","Mit Big Buddha in einem Halbtag verbinden."]},
{id:"phu-promthep",s:"phu",c:"nature",t:"Promthep Cape: Sonnenuntergang am Südzipfel",wp:"Promthep Cape",q:"Promthep Cape Phuket",d:"Der klassische Sonnenuntergangsort der Insel auf einer Klippe am südlichen Ende von Phuket. Weiter Blick über das Meer, Leuchtturm und kleine Stände.",h:"Täglich, kommt bis Sonnenuntergang (ca. 18:15 im Februar)",p:"Eintritt frei",z:"1–1,5 Std.",w:"Von Kata ca. 20 Min. mit Taxi oder Grab",tips:["30 Minuten vor Sonnenuntergang kommen, dann bekommt ihr einen guten Platz.","Rückfahrt im Dunkeln vorher klären, Grab ist nach Sonnenuntergang oft knapp."]},
{id:"phu-viewpoint",s:"phu",c:"nature",t:"Karon Viewpoint (Drei-Buchten-Blick)",wp:"Karon Beach",q:"Karon Viewpoint Phuket",d:"Aussichtspunkt oberhalb von Kata Noi, Kata und Karon mit dem berühmten Blick auf drei Strände. Perfekt für ein Foto, dauert nur 15–20 Minuten.",h:"Den ganzen Tag, am besten Vormittag oder Sonnenuntergang",p:"Eintritt frei",z:"30 Min.",w:"Von Kata ca. 10 Min. mit Roller, Taxi oder Grab",tips:["Mit Promthep Cape zum Sonnenuntergang verbinden.","Wenig Platz, deshalb nicht zur Hauptzeit kommen."]},
{id:"phu-phangnga",s:"phu",c:"trip",t:"Phang-Nga-Bucht und James Bond Island",wp:"Phang Nga Bay",q:"Phang Nga Bay James Bond Island tour Phuket",d:"Ganztagestour in die Bucht mit steilen Kalkfelsen, Mangroven, Höhlen und dem berühmten James-Bond-Felsen. Meist per Speedboat oder Longtail, oft mit Kanu und Mittagessen.",h:"Ganztags, Abholung ca. 7:30–8:30",p:"Gruppentour ca. 1.400–3.000 THB pro Person. GetYourGuide (17.11.2026): ca. 40–90 € pro Person, zum Beispiel Großboot 41 € (4,7 von 5 bei über 4.200 Bewertungen) oder Longtail-Kleingruppe 61 € (4,7 von 5 bei über 1.800 Bewertungen)",z:"8–10 Std.",w:"Abholung vom Hotel, Fahrt zum Pier ca. 1–1,5 Std.",tips:["Kleine Gruppen oder Privatboot wählen, die großen Boote sind überfüllt.","Der Februar ist Hochsaison, bucht ein paar Tage vorher.","Sonnenschutz und Badesachen mitnehmen."]},
{id:"phu-racha",s:"phu",c:"trip",t:"Schnorcheln an den Racha-Inseln",wp:"Ko Racha Yai",q:"Racha Island snorkeling Phuket",d:"Klares Wasser, Korallen und Fischschwärme rund um Racha Yai und Racha Noi, ca. 45 Minuten mit dem Speedboat von Phuket. Gut als Tagesausflug, wenn ihr schnorcheln wollt.",h:"Ganztags oder halber Tag",p:"Ganztägig ca. 1.800–2.800 THB, Halbtags ca. 1.300–1.800 THB",z:"6–8 Std.",w:"Abfahrt vom Chalong Pier, Abholung vom Hotel möglich",tips:["Februar ist beste Sicht im Wasser.","Bei Bedarf Schnorchelausrüstung vor Ort leihen.","Alternative zu Phi Phi, wenn ihr die Insel schon hattet."]},
{id:"phu-cooking",s:"phu",c:"fun",t:"Thai-Kochkurs in Kata",q:"Thai cooking class Kata Phuket",d:"Halbtagskurs mit Marktbesuch und vier bis fünf Gerichten, die ihr danach esst. Gut für einen Tag, an dem ihr nicht an den Strand wollt.",h:"Vormittags oder nachmittags, 3–4 Std.",p:"ca. 1.200–1.800 THB pro Person. GetYourGuide (25.11.2026): Halbtageskurse auf Phuket ca. 35–67 € pro Person, die meistbewertete 4,9 von 5 bei 831 Bewertungen",z:"3–4 Std.",w:"Abholung vom Hotel meist inklusive",tips:["Falls ihr in Bangkok schon gekocht habt, hier auslassen.","Vegetarische Variante vorher ansagen."]},
{id:"phu-muaythai",s:"phu",c:"fun",t:"Muay Thai in Phuket (Probetraining oder Kampf ansehen)",q:"Muay Thai gym Chalong Phuket trial class",d:"Phuket ist ein Zentrum für Muay Thai mit vielen Gyms. Probetraining als Anfänger oder abends ein Kampf im Stadion ansehen.",h:"Training meist morgens und spät nachmittags, Kämpfe abends",p:"Probetraining ca. 500–1.000 THB, Kampf-Tickets ca. 1.000–1.800 THB",z:"1,5–2 Std.",w:"Gyms vor allem rund um Chalong, mit Taxi/Grab ca. 25 Min. von Kata",tips:["Probetraining nicht am Tag vor einer Fahrt, ihr werdet müde sein.","Kampf-Tickets im Voraus buchen, an den Kassen kostet es oft mehr."]},

/* ---------- JAPAN ---------- */
{id:"tyo-sushi",s:"tyo",c:"fun",t:"Sushi selber machen (Kochkurs)",q:"sushi making class Tokyo",d:"Ihr lernt Reis, Nigiri und Rollen herzustellen und esst die Ergebnisse danach. Kurse dauern etwa zwei Stunden, oft mit Fischkunde und Tipps zum Messer. Ein Highlight für alle, die Sushi lieben.",h:"Meist Vormittag oder Nachmittag, 2–2,5 Std.",p:"ca. 6.000–10.000 JPY pro Person",z:"2–2,5 Std.",w:"Meist in Asakusa, Shinjuku oder Tsukiji, über Anbieter-Seiten buchbar",tips:["Wenige Wochen vorher buchen, beliebte Zeitfenster sind schnell weg.","Allergien und vegetarische Wünsche vorher melden.","Im Kurs oft mit auf Englisch, die Gruppe ist klein."]},
{id:"tyo-ramenclass",s:"tyo",c:"fun",t:"Ramen selber machen (Kochkurs)",q:"ramen making class Tokyo Asakusa",d:"Nudeln, Brühe und Toppings selbst zubereiten. Danach isst du deine eigene Schüssel Ramen. Eine lockere Alternative zum Sushi-Kurs.",h:"Meist Nachmittag, ca. 2 Std.",p:"ca. 5.000–8.000 JPY pro Person",z:"2 Std.",w:"Meist in Asakusa oder Shinjuku",tips:["Vorher buchen.","Vegetarische Brühe gibt es bei manchen Anbietern.","Passt gut als Alternative zum Sushi-Kurs."]},
{id:"tyo-bouldering",s:"tyo",c:"fun",t:"Bouldern in einer Kletterhalle",q:"bouldering gym Tokyo",d:"Tokyo hat viele Boulderhallen, die Preise sind fair und das Niveau hoch. Gut für einen Regentag oder den Abend. Kletterschuhe lassen sich leihen.",h:"Meist 10–22 Uhr",p:"Tageskarte ca. 1.500–2.500 JPY, Schuhmiete ca. 300–500 JPY",z:"1,5–3 Std.",w:"Viele Hallen nahe der U-Bahn, z. B. in Shinjuku, Shibuya oder Akihabara",tips:["Eine Halle mit englischer Beschreibung und Anfängerrouten wählen.","Magnesium ist meist erlaubt, Handtuch mitnehmen.","Mit eigenen Schuhen aus Railay vergleichen, ihr könnt sonst leihen."]},
{id:"tyo-surf",s:"tyo",c:"fun",t:"Surfstunde in Shonan (Kamakura)",q:"surf lesson Kamakura Shonan",d:"Die Küste von Shonan ist Tokyos Surfspot, etwa eine Stunde mit dem Zug. Im März hat das Wasser nur 14–15 °C, mit dickem Neoprenanzug sind Anfängerstunden trotzdem möglich. Wellen sind klein bis mittel, es kann windig sein.",h:"Meist Vormittag, 2–3 Std.",p:"ca. 6.000–9.000 JPY mit Brett und Neoprenanzug",z:"Halber Tag mit Anreise",w:"Zug von Tokyo nach Kamakura oder Zushi, ca. 1–1,5 Std.",tips:["Anbieter mit englischsprachigem Lehrer und Anfängerkursen vorab buchen.","Dicken Neoprenanzug (5/4 mm) und Haube nehmen, das Wasser ist kalt.","Mit einem Besuch in Kamakura (Großer Buddha) und Enoshima verbinden."]},
{id:"tyo-fuji",s:"tyo",c:"trip",t:"Mount Fuji und Kawaguchiko (Idee)",q:"Chureito Pagoda Kawaguchiko Mount Fuji",d:"Tagesausflug zum Fünf-Seen-Gebiet mit Blick auf den Fuji, etwa zwei Stunden Busfahrt von Tokyo. Wer klare Sicht erwischt, hat eines der berühmtesten Motive Japans. Im März liegt noch Schnee auf dem Berg.",h:"Ganzer Tag, Bus ab Shinjuku",p:"Bus ca. 2.000–4.000 JPY pro Strecke",z:"Ganzer Tag",w:"Direktbus ab Shinjuku nach Kawaguchiko, ca. 2 Std.",tips:["Bei schlechter Sicht verschieben, die Wetter-App prüfen.","Alternative zu Hakone, nicht beides am selben Tag.","Früh aufbrechen, die Rückfahrt kann voll sein."]},
{id:"tyo-karaoke",s:"tyo",c:"night",t:"Karaoke mit Freunden",q:"karaoke Shibuya",d:"Japanisches Karaoke gibt es in privaten Räumen, ihr singt unter euch. Mit Getränkeflatrate ein günstiger und lustiger Abend. Viele Ketten haben englische Songlisten.",h:"Meist bis spät in die Nacht",p:"ca. 500–1.500 JPY pro Person und Stunde, Getränke extra oder inklusive",z:"1–2 Std.",w:"Überall in Shibuya, Shinjuku und Ikebukuro",tips:["Free-Time-Tarif mit Getränken ist meist günstiger.","Nach 22 Uhr steigen die Preise.","Am Wochenende vorher reservieren."]},
{id:"kyo-cooking",s:"kyo",c:"fun",t:"Kochkurs mit Marktbesuch in Kyoto",q:"cooking class Kyoto Nishiki market",d:"Kyoto-Küche kennenlernen: Marktführung über den Nishiki-Markt und danach ein Kochkurs, zum Beispiel für Sushi, Miso-Suppe oder Hausmannskost. Kleine Gruppen, oft in einer Altbau-Küche.",h:"Meist Vormittag, 3–4 Std.",p:"ca. 8.000–12.000 JPY pro Person",z:"3–4 Std.",w:"Treffpunkt nahe Nishiki-Markt oder Gion",tips:["Früh buchen, vor allem zur Kirschblüte.","Vegetarische Optionen vorher klären.","Nach dem Kurs lohnt sich ein Spaziergang am Kamo-Fluss."]},
{id:"kyo-tea",s:"kyo",c:"fun",t:"Teezeremonie",q:"tea ceremony Kyoto Gion",d:"In einem Teehaus oder Tempel lernt ihr Matcha nach der klassischen Zeremonie zuzubereiten und zu trinken. Ruhig und kurz, gut für Einsteiger. Oft mit Süßigkeiten und Erklärungen auf Englisch.",h:"Mehrfach täglich, 45–60 Min.",p:"ca. 3.000–6.000 JPY pro Person",z:"45–60 Min.",w:"Vor allem in Higashiyama und Gion",tips:["Vorher reservieren, besonders am Wochenende.","Knie und Füße sind für das Sitzen auf dem Boden gefragt, es gibt oft Sitzvarianten.","Kimono-Verleih lässt sich gut mit der Teezeremonie kombinieren."]},
{id:"kyo-kimono",s:"kyo",c:"fun",t:"Kimono tragen (Verleih)",q:"kimono rental Kyoto Gion",d:"Ihr leiht einen Kimono mit Frisur und macht damit einen Spaziergang durch Gion oder Higashiyama. Ein Klassiker und gut für Fotos. Oft mit Zeitfenstern und Rückgabe am Abend.",h:"Meist 9–18 Uhr",p:"ca. 3.500–6.000 JPY pro Person inklusive Frisur",z:"Halber Tag",w:"Läden in Gion und nahe Kiyomizu-dera",tips:["Bei Regen kann ein Termin verschoben werden, vorher fragen.","Bequeme Schuhe, die ihr zum Kimono ausziehen könnt.","Zur Blüte sind die Läden voll, früh buchen."]},
{id:"kyo-sake",s:"kyo",c:"food",t:"Sake-Viertel Fushimi",q:"Fushimi sake district Gekkeikan Okura Museum Kyoto",d:"Fushimi ist seit Jahrhunderten für Sake bekannt. Ihr besucht Brauerei-Museen und probiert verschiedene Sorten. Passt gut zum Tag am Fushimi Inari, das Viertel liegt in der Nähe.",h:"Meist 9:30–16:30, montags geschlossen (vor Ort prüfen)",p:"Museum ca. 400–600 JPY, Verkostungen ca. 500–1.500 JPY",z:"1,5–2 Std.",w:"Keihan-Linie bis Chushojima, ca. 15 Min. ab Fushimi Inari",tips:["Mit einem Schluck anfangen, es kommen mehrere Sorten.","Nach dem Probieren nicht mehr Fahrrad oder Roller fahren.","Gut verbindbar mit einem Mittagessen im Viertel."]},
{id:"osa-cupnoodles",s:"osa",c:"fun",t:"Cup-Noodles-Museum (eigene Cup Noodles)",q:"Cupnoodles Museum Osaka Ikeda",d:"Im Museum in Ikeda bei Osaka gestaltet ihr euren eigenen Becher und füllt ihn mit Nudeln und Zutaten. Das Museum erzählt die Geschichte der Instant-Nudeln. Ein lustiger Ausflug für Gruppen.",h:"Meist 9:30–16:30, dienstags geschlossen (vor Ort prüfen)",p:"Eintritt ca. 500 JPY, Becher selbst gestalten ca. 500 JPY",z:"1,5–2 Std.",w:"Hankyu-Linie ab Umeda bis Ikeda, ca. 25 Min.",tips:["Zeitfenster für die eigene Becher-Gestaltung früh buchen.","Dienstags geschlossen.","Lohnt sich vor allem mit Freunden, kein Pflichtprogramm."]},
{id:"osa-bouldering",s:"osa",c:"fun",t:"Bouldern in einer Kletterhalle",q:"bouldering gym Osaka",d:"Auch Osaka hat viele Boulderhallen mit fairen Preisen. Gut für einen Regentag oder den Abend nach dem Sightseeing. Schuhe lassen sich leihen.",h:"Meist 10–22 Uhr",p:"Tageskarte ca. 1.500–2.500 JPY, Schuhmiete ca. 300–500 JPY",z:"1,5–3 Std.",w:"Hallen nahe Namba, Umeda und Shinsaibashi",tips:["Eine Halle mit englischer Beschreibung und Anfängerrouten wählen.","Handtuch mitnehmen.","Wer in Tokyo schon geklettert ist, kennt die Preise."]},
{id:"osa-koyasan",s:"osa",c:"trip",t:"Koyasan: Tempelübernachtung und Friedhof (Idee)",q:"Koyasan Okunoin Wakayama",d:"Der heilige Berg Koyasan mit Tempeln, einem bewaldeten Friedhof und der Möglichkeit, in einem Tempel zu übernachten (Shukubo) mit vegetarischem Essen. Tagesausflug oder Übernachtung, etwa zwei Stunden ab Osaka.",h:"Tempel meist 8:30–17 Uhr",p:"Zugticket ca. 2.000–3.000 JPY hin und zurück, Tempelübernachtung ab ca. 12.000 JPY pro Person",z:"Ganzer Tag",w:"Nankai-Linie ab Namba bis Gokurakubashi, dann Seilbahn und Bus",tips:["Eine Übernachtung im Tempel früh reservieren.","Feste Schuhe und warme Kleidung, auf dem Berg ist es kühler.","Als Alternative zu Hiroshima, wenn ihr es ruhiger wollt."]},
/* ---------- VIETNAM UND SÜDKOREA (Reise B) ---------- */
{id:"hoi-surf",s:"hoi",c:"fun",t:"Surfstunde bei Da Nang (My Khe Beach)",q:"surf lesson Da Nang My Khe Beach",d:"Der Strand My Khe bei Da Nang ist etwa 30 Minuten von Hoi An entfernt. Im März sind die Wellen klein, was für Anfänger gut ist. Die Hauptsaison zum Surfen ist im Herbst und Winter.",h:"Meist Vormittag",p:"ca. 600.000–900.000 VND für eine Stunde mit Brett",z:"2–3 Std. mit Anfahrt",w:"Ca. 30 Min. mit dem Taxi von Hoi An",tips:["Anfänger-Kurse mit kleinen Gruppen wählen.","Sonnenschutz nicht vergessen, das Wasser ist warm.","Wer richtig Wellen will, fährt im Herbst."]},
{id:"han-cooking",s:"han",c:"fun",t:"Kochkurs in Hanoi (Bun Cha, Frühlingsrollen)",q:"cooking class Hanoi old quarter",d:"Halbtags-Kochkurs mit Marktbesuch: Frühlingsrollen, Bun Cha und Pho-Brühe selbst machen. Ein guter Einstieg in die vietnamesische Küche, bevor ihr in Hoi An noch einen zweiten Kurs macht.",h:"Vormittag oder Nachmittag, 3–4 Std.",p:"ca. 600.000–1.000.000 VND pro Person. GetYourGuide (25.11.2026): Kurse mit Marktbesuch ca. 21–43 € pro Person, mehrere mit 4,9–5,0 von 5 bei 300 bis 1.050 Bewertungen",z:"3–4 Std.",w:"Meist Treffpunkt in der Altstadt",tips:["Auf Bewertungen mit kleinen Gruppen achten.","Vegetarische Variante vorher ankündigen.","Wer in Hoi An kocht, kann hier einen anderen Schwerpunkt nehmen."]},
{id:"sel-cooking",s:"sel",c:"fun",t:"Koreanischer Kochkurs (Kimchi, Bibimbap)",q:"Korean cooking class Seoul kimchi bibimbap",d:"Kimchi einlegen, Bibimbap und Pfannkuchen zubereiten. Mit Marktbesuch oder in einer Kochschule, oft mit Verkostung von Reiswein.",h:"Meist Vormittag, 3 Std.",p:"ca. 50.000–90.000 KRW pro Person",z:"3 Std.",w:"Meist Treffpunkt in Insadong, Myeongdong oder Hongdae",tips:["Wenige Plätze, vorher buchen.","Vegetarische Optionen vorher klären.","Gut an einem Regentag."]},
{id:"sel-climbing",s:"sel",c:"fun",t:"Bouldern in einer Kletterhalle",q:"bouldering gym Seoul",d:"Seoul hat viele Boulderhallen, die Preise sind moderat. Gut für einen Abend nach einem langen Sightseeing-Tag. Schuhe lassen sich leihen.",h:"Meist 10–23 Uhr",p:"Tageskarte ca. 20.000–30.000 KRW, Schuhmiete ca. 3.000–5.000 KRW",z:"1,5–3 Std.",w:"Viele Hallen in Hongdae, Gangnam und Seongsu",tips:["Eine Halle mit englischer Beschreibung wählen.","Handtuch mitnehmen.","Am Wochenende ist es voller."]},
/* ---------- FRÜHE BLÜTE (Februar und März) ---------- */
{id:"kaw-sakura",s:"kaw",c:"nature",t:"Kawazu-Kirschblüte am Kawazu-Fluss",q:"Kawazu Cherry Blossom Festival Kawazu River",d:"Kawazu-zakura blühen drei bis vier Wochen vor den Kirschen in Tokyo, im Februar und Anfang März, in kräftigem Rosa. Entlang des Flusses stehen tausende Bäume, dazu gibt es ein Fest mit Ständen und abends Beleuchtung. Der Höhepunkt liegt meist Ende Februar. Die Termine für 2027 stehen noch nicht fest.",h:"Fest meist Anfang Februar bis Anfang März (2026: 7.2.–8.3.), Fluss ganztags zugänglich",p:"Spazieren frei, Stände und Essen ab ca. 500 JPY",z:"2–4 Std.",w:"Von Tokyo mit dem Odoriko (Direktzug) ca. 2,5 Std. bis Kawazu, oder Shinkansen bis Atami und weiter mit der Izukyu-Linie",tips:["Blütenstand und Festtermine kurz vorher auf der Seite des Festes prüfen und bei Abweichung einen Tag verschieben.","Am frühen Morgen sind die Wege leer, abends ist es beleuchtet.","Eine Übernachtung in Kawazu mit Onsen lohnt sich, sonst bleibt nur ein langer Tagesausflug."]},
{id:"kaw-falls",s:"kaw",c:"nature",t:"Kawazu Nanadaru (Sieben Wasserfälle)",q:"Kawazu Nanadaru Waterfalls Loop Bridge",d:"Ein Wanderweg an sieben Wasserfällen im Wald oberhalb von Kawazu, mit der berühmten Spiralbrücke „Loop Bridge“. Ein ruhiger Gegenpol zum Blütenfest, etwa 30 Minuten mit dem Bus vom Bahnhof.",h:"Ganztags, Bus nach Fahrplan",p:"Wanderweg frei, Bus ca. 400–800 JPY",z:"1,5–3 Std.",w:"Linienbus ab Bahnhof Kawazu (Fahrplan vorher prüfen), alternativ Taxi",tips:["Feste Schuhe, der Weg kann nass und rutschig sein.","Den letzten Bus zurück zum Bahnhof vorher prüfen.","Gut mit dem Spaziergang am Fluss verbindbar."]},
{id:"kaw-atami",s:"kaw",c:"nature",t:"Atami: Pflaumengarten Atami Baien",q:"Atami Baien plum garden Atami Shizuoka",d:"Auf dem Weg zurück Richtung Tokyo oder Kyoto liegt Atami mit seinem Pflaumengarten. Das Pflaumenfest läuft von Januar bis März, im Garten blühen mehrere hundert Bäume. Atami ist auch ein Onsen-Ort mit Blick aufs Meer, der Shinkansen hält direkt dort.",h:"Garten tagsüber, Eintritt während des Pflaumenfests",p:"Eintritt ca. 300–500 JPY (vor Ort prüfen)",z:"1,5–2 Std.",w:"Ca. 15 Min. zu Fuß oder Bus ab Bahnhof Atami, von dort Shinkansen nach Tokyo (50 Min.) oder Kyoto (ca. 2 Std.)",tips:["Als Zwischenstopp auf dem Rückweg von Kawazu einplanen.","Bei Regen ist der Garten rutschig.","Gepäck im Bahnhof-Schließfach lassen."]},
{id:"tyo-plum",s:"tyo",c:"nature",t:"Pflaumenblüte im Yushima Tenjin und Hanegi-Park",q:"Yushima Tenjin plum festival Tokyo",d:"In Tokyo blühen die Pflaumen (Ume) von Mitte Februar bis Mitte März, vor den Kirschen. Am Schrein Yushima Tenjin gibt es ein Pflaumenfest mit mehreren hundert Bäumen, im Hanegi-Park in Setagaya noch mehr. Ruhiger als die Kirschblüte und gut für einen Vormittag.",h:"Fest meist Anfang Februar bis Anfang März (vor Ort prüfen)",p:"Eintritt zum Schrein frei, Fest ca. 100–500 JPY",z:"1,5–2 Std.",w:"Yushima Tenjin: Metro Yushima. Hanegi-Park: Odakyu-Linie bis Umegaoka",tips:["Pflaumen und Kirschen unterscheiden: Pflaumenblüten haben rundere, kürzere Blütenblätter.","Mit Ueno-Park oder Gōtoku-ji (im Westen) kombinierbar.","Je nach Winterverlauf blühen sie früher oder später, kurz vorher prüfen."]},
{id:"kyo-kitano",s:"kyo",c:"nature",t:"Kitano Tenmangu: Pflaumengarten",q:"Kitano Tenmangu plum garden Kyoto",d:"Der Schrein gilt als der beste Ort für Pflaumenblüte in Kyoto, mit rund 1.500 Bäumen. Im Garten sitzt man bei Tee und Süßem unter den Blüten. Der Höhepunkt ist meist Ende Februar bis Anfang März.",h:"Garten meist ab Anfang Februar bis Ende März, tagsüber (vor Ort prüfen)",p:"Garten ca. 1.000–1.200 JPY inklusive Tee und Süßigkeit (vor Ort prüfen)",z:"1–1,5 Std.",w:"Bus ab Kyoto-Bahnhof, ca. 25–40 Min., oder zu Fuß ab Kinkaku-ji ca. 25 Min.",tips:["Am Vormittag kommen, mittags wird es voll.","Zum Kinkaku-ji lässt es sich als Halbtagestour verbinden.","Am 25. jeden Monats ist Markttag am Schrein."]}
];

{id:"hak-openair",s:"hak",c:"sight",t:"Hakone Open-Air Museum",wp:"Hakone Open-Air Museum",q:"Hakone Open-Air Museum",d:"Skulpturenpark mitten in den Bergen, mit großen Kunstwerken im Freien, einem Picasso-Haus und einem warmen Fußbad zum Ausruhen. Auch bei kaltem Wetter schön.",h:"Täglich 9–17 Uhr, letzter Einlass 16:30",p:"2.000 ¥ an der Kasse, 1.800 ¥ online",z:"2 Std.",w:"Hakone-Tozan-Bahn bis Chokoku-no-mori, 2 Min. zu Fuß",tips:["Das Fußbad mitnehmen, kleines Handtuch gibt es dort zu kaufen.","Mit dem Hakone Freepass gibt es meist Rabatt, an der Kasse zeigen."]},
{id:"hak-ashi",s:"hak",c:"fun",t:"Ashi-See mit dem Piratenschiff",wp:"Lake Ashi",q:"Hakone Sightseeing Cruise Togendai",d:"Mit einem bunten Schiff im Piratenstil quer über den Kratersee. Bei klarer Sicht sieht man den Fuji hinter dem Wasser.",h:"Tagsüber, im Winter kürzer",p:"Einfache Fahrt ca. 1.700 ¥, im Hakone Freepass enthalten",z:"ca. 40 Min. Fahrt",w:"Häfen Togendai, Hakone-machi und Moto-Hakone",tips:["Morgens ist die Chance auf Fuji-Blick am größten.","Im Februar 2027 ist die Seilbahn zwischen Togendai und Owakudani bis 26.2. gesperrt. Ersatzbusse fahren, mehr Zeit einplanen."]},

{id:"cth-ninhkieu",s:"cth",c:"sight",t:"Ninh-Kieu-Ufer und Nachtmarkt",q:"Ninh Kieu Wharf, Can Tho",d:"Die Uferpromenade am Hau-Fluss ist das Zentrum von Can Tho. Abends spazieren hier die Leute, daneben liegt der Nachtmarkt mit Essen aus dem Mekongdelta. Hier legen auch die Boote zum schwimmenden Markt ab.",h:"Promenade immer, Nachtmarkt abends",p:"Frei, Essen ca. 30.000–70.000 VND",z:"1–2 Std.",w:"Zentrum Can Tho, zu Fuß",tips:["Am Abend vorher das Boot für den Markt am nächsten Morgen ausmachen.","Die Fußgängerbrücke ist abends beleuchtet."]},
{id:"cth-cairang",s:"cth",c:"market",t:"Schwimmender Markt Cai Rang",q:"Cai Rang Floating Market, Can Tho",d:"Der größte schwimmende Markt im Mekongdelta. Händler verkaufen Obst und Gemüse von großen Booten, an einer Stange hängt, was sie anbieten. Danach fahren die Boote oft durch kleine Kanäle zu Obstgärten oder einer Reisnudel-Werkstatt.",h:"Am besten ca. 6:00–7:30, ab ca. 8:30 ist der Markt fast vorbei",p:"Boot ca. 300.000–400.000 VND für 2–3 Personen, Platz im Sammelboot ca. 50.000–100.000 VND. GetYourGuide (25.11.2026): Touren ab ca. 26 € pro Person",z:"3–4 Std. mit Kanälen",w:"Boot ab Ninh-Kieu-Ufer, ca. 30–40 Min. Fahrt, Abfahrt ca. 5 Uhr",tips:["Am Ufer direkt handeln ist meist günstiger als über das Hotel.","Am selben Tag geht es weiter nach Chau Doc, also früh zurück sein."]},
/* ---------- CHAU DOC ---------- */
{id:"cdc-trasu",s:"cdc",c:"nature",t:"Mangrovenwald Trà Sư",q:"Tra Su Cajuput Forest, An Giang",d:"Ein überfluteter Kajeputwald mit grünem Wasserlinsen-Teppich. Erst mit dem Motorboot, dann leise im Ruderboot durch die Kanäle, dazu viele Vögel. Eine der schönsten Landschaften im Süden.",h:"Täglich ca. 6:30–18:00",p:"Eintritt ca. 120.000 VND, Motorboot ca. 80.000 VND, Ruderboot ca. 70.000 VND",z:"2–3 Std.",w:"ca. 20–30 km von Chau Doc, ca. 30–40 Min. mit Taxi oder Grab",tips:["Am schönsten ca. 7–9 Uhr oder 15–17 Uhr, mittags ist es heiß.","Mückenschutz mitnehmen."]},
{id:"cdc-sam",s:"cdc",c:"nature",t:"Sam-Berg: Blick über die Reisfelder",q:"Sam Mountain, Chau Doc",d:"Der einzige Berg weit und breit. Oben gibt es Pagoden und einen weiten Blick über Reisfelder und Kanäle bis zur Grenze nach Kambodscha. Am Fuß liegt der viel besuchte Tempel der Bà Chúa Xứ.",h:"Am schönsten zum Sonnenuntergang",p:"Frei, Mototaxi nach oben gegen kleine Gebühr",z:"2 Std.",w:"ca. 5 km von Chau Doc",tips:["Zu Fuß ist der Weg steil, früh oder spät am Tag gehen.","Den Tempel am Fuß nur angemessen gekleidet besuchen."]},
/* ---------- HA TIEN ---------- */
{id:"htn-honchong",s:"htn",c:"nature",t:"Felsenküste Hon Chong",q:"Hon Phu Tu, Binh An, Kien Luong, Kien Giang",d:"Kalkfelsen am Meer bei Ha Tien, mit dem Felsen Hon Phu Tu im Wasser und der Höhlenpagode Chua Hang. Ein Stück Karstlandschaft, wie man sie sonst eher aus dem Norden kennt.",h:"Tagsüber",p:"Kleine Eintritte vor Ort",z:"2–3 Std.",w:"ca. 30 km von Ha Tien, auf dem Weg von Chau Doc",tips:["Lässt sich als Halt in die Fahrt mit dem Privatwagen einbauen, beim Buchen fragen.","Badesachen mitnehmen."]},
/* ---------- PHU QUOC ---------- */
{id:"pqc-onglang",s:"pqc",c:"nature",t:"Ong Lang Beach und Sonnenuntergang",q:"Ong Lang Beach, Phu Quoc",d:"Ruhiger Strand an der Westküste zwischen Felsen und Palmen. Die Westküste ist bekannt für Sonnenuntergänge über dem Meer.",h:"Sonnenuntergang ca. 18 Uhr",p:"Frei",z:"Halber Tag",w:"ca. 15 Min. vom Duong Dong",tips:["Ankunftstag nach der Fähre: hier einfach ankommen.","Ein Roller oder Grab ist auf der Insel am praktischsten."]},
{id:"pqc-islands",s:"pqc",c:"trip",t:"Bootstour zu den An-Thoi-Inseln",q:"An Thoi Islands, Phu Quoc",d:"Tagesausflug mit dem Boot zu den kleinen Inseln im Süden von Phu Quoc, mit Schnorcheln, Strandpause und Mittagessen an Bord.",h:"Meist ca. 8:00–16:00",p:"GetYourGuide (25.11.2026): ab ca. 33 € pro Person",z:"Ganzer Tag",w:"Abholung im Hotel, Abfahrt im Süden bei An Thoi",tips:["Bei Wind und Wellen fällt die Tour aus, nicht den letzten Tag nehmen.","Mit der Seilbahn nach Hon Thom kombinieren, wenn die Tour das nicht schon enthält."]},
{id:"pqc-honthom",s:"pqc",c:"fun",t:"Seilbahn nach Hon Thom",q:"Hon Thom Cable Car, Phu Quoc",d:"Eine der längsten Seilbahnen der Welt mit 7.899 m, über das Meer und die Fischerboote der An-Thoi-Inseln bis zur Insel Hon Thom.",h:"ca. 9:00–17:00",p:"ca. 650.000 VND pro Person (hin und zurück)",z:"Halber Tag",w:"Station im Süden der Insel",tips:["Fahrt ca. 15–20 Min. pro Richtung.","Am Nachmittag ist die Sicht oft klarer, Wartezeiten vorher einplanen."]},
{id:"pqc-sao",s:"pqc",c:"nature",t:"Sao Beach",q:"Sao Beach, Phu Quoc",d:"Weißer, feiner Sand und flaches, türkises Wasser an der Südostküste. Einer der schönsten Strände der Insel.",h:"Tagsüber, vormittags ruhiger",p:"Frei, Liegen in den Strandbars gegen Konsum",z:"Halber Tag",w:"ca. 30 Min. von Duong Dong",tips:["Mittags kommen die Tourboote, früh ist es leerer."]},
{id:"pqc-park",s:"pqc",c:"nature",t:"Nationalpark im Norden von Phu Quoc",q:"Phu Quoc National Park",d:"Ein großer Teil der Insel ist Wald. Im Norden gibt es Wege, Bäche und ruhige Strände abseits der Hotels.",h:"Tagsüber",p:"GetYourGuide (25.11.2026): Tour durch den Norden ab ca. 66 € pro Person",z:"Halber bis ganzer Tag",w:"Norden der Insel, mit Tour oder Roller",tips:["Alternative zu Sao Beach am letzten Tag.","Wasser und Mückenschutz mitnehmen."]}

const GLOBE=(()=>{

const BOARD=(()=>{
  const plane='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M22 12c0-.8-.7-1.4-1.6-1.4H15L10 2.5H8l2.4 8.1H5.2L3.4 8.2H2l1.2 3.8L2 15.8h1.4l1.8-2.4h5.2L8 21.5h2l5-8.1h5.4c.9 0 1.6-.6 1.6-1.4z"/></svg>';
  function card(i,rl){
    const L=TRIP.board||[];if(!L.length)return '';
    const f=rl<0?L.find(x=>x.a>=i)||L[0]:L.find(x=>x.a===i||x.a===i+1);
    if(!f)return '';
    const date=addDays(START,f.a),days=Math.round((date-mid(new Date()))/864e5);
    const cd=days>1?[days,f.a===0?'Tage bis zum Abflug':'Tage bis dahin']:days===1?[1,f.a===0?'Tag bis zum Abflug':'Tag bis dahin']:days===0?['Heute','']:['–',''];
    return `<button type="button" class="bp" data-bp aria-pressed="false" aria-label="Bordkarte ${esc(f.fn)} nach ${esc(f.tn)}, ${fmtL(date)} ${f.dep} Uhr. Antippen für Hinweise.">
      <span class="bpin">
        <span class="bpf"><span class="bphd"><span>Nächster Flug</span><span>${fmtL(date)}</span></span>
          <span class="bproute"><span class="bpc"><b>${f.from}</b><span>${esc(f.fn)}</span></span><span class="bpline">${plane}</span><span class="bpc r"><b>${f.to}</b><span>${esc(f.tn)}</span></span></span>
          <span class="bptimes"><span>ab ${f.dep}</span><span>an ${f.arr}</span></span>
          <span class="bpcut"></span>
          <span class="bpft"><span><b>${esc(f.no)}</b><span>${esc(f.via)} · ${esc(f.pr)} pro Person (Suche vom 25.11.)</span></span><span class="bpcd">${typeof flapHtml==='function'?flapHtml(cd[0]):'<b>'+cd[0]+'</b>'}<span>${cd[1]}</span></span></span></span>
        <span class="bpf back"><span class="bphd"><span>Vor diesem Flug</span><span>${f.from} → ${f.to}</span></span><ul>${f.tip.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><span class="bphint">Noch einmal antippen zum Zurückdrehen.</span></span>
      </span></button>`;
  }
  document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-bp]');if(b)b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')});
  return {card};
})();

const B_RECO=['Dieser Plan ist für euren Urlaub vom 1.2. bis 16.3. gebaut: Südostasien zuerst, Japan zuletzt, weil die frühe Blüte (Kawazu, Pflaumen) Ende Februar und Anfang März am schönsten ist und Japan dann etwas milder ist.','Die Route geht von Bangkok nach Süden, nicht nach Norden: Bangkok, Krabi, Koh Lanta, Koh Phi Phi, Phuket. Kurze Strecken, wenig Fliegen, Meer und Inseln im Februar, wenn die Trockenzeit ruhiges Wasser bringt.','Einen Flug-Dienstag-Trick gibt es nicht mehr sicher: Aktuelle Auswertungen sehen mal Mittwoch, mal Donnerstag oder Freitag vorn. Dienstag ist vor allem leerer. Vergleicht die Preise ±3 Tage mit dem Google-Flights-Kalender.','Flüge nur dort, wo der Landweg über sechs Stunden dauert: Bangkok–Krabi, Phuket–Hanoi und Hanoi–Tokyo (27.2. am Tag mit Umstieg in Hongkong). Dazwischen Fähre, Bus und Shinkansen.','Aus eurer Liste (49 verschiedene Orte) sind die meisten im Tagesplan. Einige stehen mit Begründung unter „Ideen und Aktivitäten“, aber nicht im Plan: Ko Tao, Sa Pa, Bạch Long Glass Bridge, Wat Samphran, Rainbow Line Fukui, Gulliver-Garten Shiga und Okuyama Ameyama Nature Park. Chiang Mai, Khao Sok, Angkor, Hoi An und Ninh Binh sind mit dem neuen Plan rausgefallen.','Seoul ist aus dem Plan genommen, die Kirschblüte dort ist erst im April. Dafür gibt es Kawazu, die früheste Kirschblüte Japans, mit zwei Nächten und Onsen.','Chinesisches Neujahr (6.2.) fällt in euren Bangkok-Teil: mehr Gäste, höhere Preise. Dafür ist Yaowarat in Bangkok ein Fest.','Vietnam statt Hoi An: Lan-Ha-Bucht mit einer Nacht auf dem Schiff ist das klassische Highlight im Norden, und von Hanoi kommt man gut nach Tokyo. Nach dem Loop gibt es einen Ruhetag in Hanoi.','Der Ha-Giang-Loop dauert jetzt vier Tage und ist die größte Abenteuer-Station der Reise. Wer nicht selbst Motorrad fährt, fährt als Beifahrer mit einem Easy Rider. Vorher klären, ob die Versicherung das abdeckt.','Fushimi Inari und Nishiki-Markt vor 9 Uhr besuchen, danach wird es sehr voll.','Golden-Gai /* Jeder Eintrag bekommt einen Schlüssel. Firebase erlaubt in Schlüsseln keine . $ # [ ] / */
const syncKey=k=>String(k).replace(/[.$#\[\]\/]/g,'_');
function syncFlat(st){
  const o={},put=(p,v)=>{o[p]=JSON.stringify(v)};
  Object.keys(st.done).forEach(k=>put('d:'+syncKey(k),st.done[k]));
  Object.keys(st.vis).forEach(k=>put('v:'+syncKey(k),st.vis[k]));
  Object.keys(st.pl||{}).forEach(k=>put('p:'+syncKey(k),st.pl[k]));
  Object.keys(st.bk).forEach(k=>put('b:'+syncKey(k),st.bk[k]));
  st.cbk.forEach(x=>put('c:'+syncKey(x.id),x));
  st.exp.forEach(x=>put('x:'+syncKey(x.id),x));
  ['book','pack'].forEach(l=>(st.custom[l]||[]).forEach(x=>put('l'+l[0]+':'+syncKey(x.id),x)));
  put('s:n1',st.set.n1);put('s:n2',st.set.n2);put('s:ra',st.set.ratesAt||'');
  Object.keys(st.set.buckets).forEach(k=>put('sb:'+syncKey(k),st.set.buckets[k]));
  Object.keys(st.set.rates).forEach(k=>put('sr:'+syncKey(k),st.set.rates[k]));
  return o;
}
function syncApply(flat,old){
  const s=DEF(),exp=[],cbk=[],lb=[],lp=[];
  for(const p in flat){
    let v;try{v=JSON.parse(flat[p])}catch(e){continue}
    const i=p.indexOf(':'),t=p.slice(0,i),k=p.slice(i+1);
    if(t==='d')s.done[k]=v;else if(t==='v')s.vis[k]=v;else if(t==='p')s.pl[k]=v;else if(t==='b')s.bk[k]=v;
    else if(t==='c')cbk.push(v);else if(t==='x')exp.push(v);else if(t==='lb')lb.push(v);else if(t==='lp')lp.push(v);
    else if(t==='s'){if(k==='n1'&&v!=='Person 1')s.set.n1=v;else if(k==='n2'&&v!=='Person 2')s.set.n2=v;else if(k==='ra')s.set.ratesAt=v}
    else if(t==='sb')s.set.buckets[k]=v;else if(t==='sr')s.set.rates[k]=v;
  }
  /* Reihenfolge wie bisher, Neues hinten */
  const ord=(arr,prev)=>{const pos={};(prev||[]).forEach((x,i)=>pos[x.id]=i);return arr.sort((a,b)=>((pos[a.id]!==undefined?pos[a.id]:1e9)-(pos[b.id]!==undefined?pos[b.id]:1e9))||String(a.id).localeCompare(String(b.id),undefined,{numeric:true}))};
  s.exp=ord(exp,old.exp);s.cbk=ord(cbk,old.cbk);s.custom.book=ord(lb,(old.custom||{}).book);s.custom.pack=ord(lp,(old.custom||{}).pack);

}
/* Eigene Änderungen mit Zeitstempel versehen. Beim ersten Mal bekommt alles den Zeitwert 1, damit nichts Fremdes überschrieben wird. */
function syncTouch(){
  if(!SYNC.url)return;
  const cur=syncFlat(store),m=SYNC.meta,now=Date.now(),first=!Object.keys(m.snap).length&&!Object.keys(m.ts).length,def=first?syncFlat(DEF()):null;
  for(const p in cur){if(m.snap[p]!==cur[p]){m.ts[p]=first?(def[p]===cur[p]?0:1):now;m.snap[p]=cur[p]}}
  for(const p in m.snap){if(!(p in cur)){m.ts[p]=now;delete m.snap[p]}}
  metaSave();
}
/* Zusammenführen: pro Eintrag gewinnt der neuere Zeitstempel. Bei Gleichstand entscheidet der größere Wert, so dass beide Geräte gleich wählen. */
function syncMerge(doc,meta){
  const rv=(doc&&doc.v)||{},rt=(doc&&doc.t)||{},lt=meta.ts,lv=meta.snap,nv={},nt={};
  let toLocal=false,toRemote=false;
  new Set(Object.keys(rt).concat(Object.keys(lt))).forEach(p=>{
    const a=lt[p]||0,b=rt[p]||0;let useR;
    if(b>a)useR=true;else if(a>b)useR=false;else{const x=lv[p],y=rv[p];useR=y!==undefined&&(x===undefined||y>x)}
    const val=useR?rv[p]:lv[p],ts=useR?b:a;
    if(val!==undefined)nv[p]=val;
    nt[p]=ts;
    if(useR){if(lv[p]!==rv[p])toLocal=true}
    else if(rv[p]!==lv[p]||b!==ts)toRemote=true;
  });
  return {nv,nt,toLocal,toRemote};
}
const syncUrl=()=>SYNC.url.replace(/\s+/g,'').replace(/\/+$/,'').replace(/\.json$/,'')+'/'+TRIP.key+'.json';
function syncUi(){const e=document.getElementById('syncmsg');if(e)e.textContent=SYNC.msg}
async function syncNow(manual){
  if(!SYNC.url||SYNC.busy)return;
  if(typeof navigator!=='undefined'&&navigator.onLine===false){SYNC.msg='Offline. Der Abgleich läuft, sobald wieder Netz da ist.';syncUi();return}
  SYNC.busy=true;SYNC.msg='Gleiche ab …';syncUi();
  try{
    syncTouch();
    const url=syncUrl(),r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw new Error('Lesen fehlgeschlagen ('+r.status+')');
    const doc=await r.json(),m=syncMerge(doc,SYNC.meta);
    if(m.toLocal){
      store=syncApply(m.nv,store);persist();
      SYNC.meta.snap=syncFlat(store);
      for(const p in SYNC.meta.snap)if(!(p in m.nt))m.nt[p]=1;
      SYNC.meta.ts=m.nt;metaSave();
      if(!sheetEl)keep();
    }else{SYNC.meta.ts=m.nt;SYNC.meta.snap=m.nv;metaSave()}
    if(m.toRemote||!doc||!doc.v){
      const w=await fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({v:m.nv,t:m.nt,u:Date.now()})});
      if(!w.ok)throw new Error('Speichern fehlgeschlagen ('+w.status+')');
    }
    SYNC.at=Date.now();SYNC.msg='Abgeglichen um '+new Date(SYNC.at).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'})+' Uhr.';
  }catch(err){const t=String(err&&err.message||err);SYNC.msg='Abgleich nicht möglich: '+t+(/\(40[13]\)/.test(t)?'. Die Datenbank lässt den Zugriff nicht zu: Regeln in Firebase prüfen und ob die Adresse mit dem geheimen Teil endet.':/\(404\)/.test(t)?'. Die Adresse stimmt nicht, bitte nochmals kopieren.':'')}
  SYNC.busy=false;syncUi();
}
function syncSoon(){
  if(!SYNC.url)return;

  clearTimeout(SYNC.timer);SYNC.timer=setTimeout(()=>syncNow(),3500);
}

}

function arc(a,b,fl){

function locateMe(){

    say(best?(best.k<3?'Du bist in '+STOPS[best.id].n+'.':'Nächster Ort der Reise: '+STOPS[best.id].n+', ca. '+Math.round(best.k)+' km entfernt.'):'Standort gefunden.');

/* Beim Eingreifen (Antippen, Ziehen, Zoomen, anderer Ort) wird nur pausiert. Die Position bleibt erhalten. */
function stopTour(){
  if(!LM.busy)return;
  LM.tid++;cancelAnimationFrame(LM.raf);LM.busy=false;
  if(LM.map){try{renderStops();legIcons()}catch(e){}}

function tourPhases(map){
  const N=ROUTE.length,P=[{t:'stop',k:0,dur:1500}];
  for(let k=1;k<N;k++){
    const a=STOPS[ROUTE[k-1]],b=STOPS[ROUTE[k]],len=Math.hypot(a.ll[0]-b.ll[0],a.ll[1]-b.ll[1]),ty=ROUTE_META[k][0];
    const z=Math.max(2,Math.min(10,map.getBoundsZoom(L.latLngBounds(LM.seg[k]),false,L.point(90,90))));
    P.push({t:'move',k,ty,z,dur:ty==='flug'?Math.max(3500,Math.min(8000,3200+len*70)):Math.max(2600,Math.min(4500,2200+len*250))});
    P.push({t:'stop',k,dur:k===N-1?2400:1800});
  }
  return P;
}
/* Start dort, wo man gerade ist: Tagesansicht, gewählter Ort oder gewählter Tag. Sonst am Anfang. */
function tourStartIdx(){
  let k=0;
  if(state.kd!=null){for(let j=1;j<ROUTE.length;j++)if(ROUTE_DAY[j]<=state.kd)k=j}
  else if(state.sel&&state.sel!=='home'){const j=ROUTE.indexOf(state.sel);if(j>0)k=j}
  else if(state.day>0){for(let j=1;j<ROUTE.length;j++)if(ROUTE_DAY[j]<=state.day)k=j}
  if(k>=ROUTE.length-1)k=0;
  return 2*k;
}
function runTour(){
  const map=LM.map;if(!map)return;
  if(LM.busy){stopTour();return}
  tourPlay();
}
function tourSkip(d){
  const map=LM.map;if(!map)return;
  if(!LM.tour||LM.tour.map!==map||LM.tour.done){tourPlay();return}
  const T=LM.tour,ph=T.P[T.idx];
  let k=ph.k,idx;
  if(d>0)idx=ph.t==='move'?T.idx+1:2*Math.min(ROUTE.length-1,k+1);
  else idx=ph.t==='move'?T.idx-1:2*Math.max(0,k-1);
  idx=Math.max(0,Math.min(T.P.length-1,idx));
  if(LM.busy){LM.tid++;cancelAnimationFrame(LM.raf);LM.busy=false}
  tourPlay(idx);
}
function tourPlay(fromIdx){
  const map=LM.map;if(!map||!L)return;
  if(!LM.tour||LM.tour.map!==map||LM.tour.done)LM.tour={map,P:tourPhases(map),idx:tourStartIdx(),el:0,done:false,fresh:true};
  const T=LM.tour;
  if(fromIdx!=null){T.idx=fromIdx;T.el=0;T.fresh=true}
  const my=++LM.tid;LM.busy=true;cancelAnimationFrame(LM.raf);setTourBtn('play');showTourBar();
  const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2,lerp=(a,b,t)=>a+(b-a)*t,stopZ=k=>ROUTE[k]==='home'?5:10;
  let t0=performance.now()-T.el,cz=map.getZoom(),cc=map.getCenter(),lastCam=null;
  const frame=now=>{
    if(LM.map!==map||LM.tid!==my)return;
    const ph=T.P[T.idx];T.el=now-t0;const u=Math.min(1,T.el/ph.dur);let tgt,z;
    if(ph.t==='move'){
      const a=STOPS[ROUTE[ph.k-1]],b=STOPS[ROUTE[ph.k]],f=ease(u);
      putTrav(LM.seg[ph.k],f,ph.ty);tgt=posOn(LM.seg[ph.k],f).ll;
      const z0=stopZ(ph.k-1),z1=stopZ(ph.k);
      z=u<.2?lerp(z0,ph.z,ease(u/.2)):u>.8?lerp(ph.z,z1,ease((u-.8)/.2)):ph.z;
      if(T.fresh){tourBarText(`${trI(ph.ty,16)}<span>${TRN[ph.ty]}: ${esc(a.n)} → ${esc(b.n)}</span>`)}
    }else{
      const sp=STOPS[ROUTE[ph.k]];tgt=[sp.ll[1],sp.ll[0]];z=stopZ(ph.k);
      LM.trav&&LM.trav.setLatLng(tgt);
      if(T.fresh){tourBarText(`<span>${esc(sp.n)}</span>`);if(ROUTE[ph.k]!=='home')selectStop(ROUTE[ph.k],{fly:false})}
    }
    if(T.fresh){T.fresh=false;try{renderStops();legIcons()}catch(e){}}
    const kf=ph.t==='move'?.25:.16;
    cc=L.latLng(cc.lat+(tgt[0]-cc.lat)*kf,cc.lng+(tgt[1]-cc.lng)*kf);cz+=(z-cz)*.14;
    map.setView(cc,cz,{animate:false});
    if(u>=1){
      T.idx++;T.el=0;t0=now;T.fresh=true;
      if(T.idx>=T.P.length){LM.busy=false;T.done=true;setTourBtn('idle');try{renderStops();legIcons()}catch(e){}map.flyToBounds(bbOf(state.mv),{paddingTopLeft:[16,110],paddingBottomRight:[64,120],duration:2});idleLoop();return}
    }
    LM.raf=requestAnimationFrame(frame);
  };
  LM.raf=requestAnimationFrame(frame);
}

async function offlineStat(){
  const e=$('#packmsg');if(!e)return;
  try{
    const ci=await caches.open('asienmedia-img'),ct=await caches.open('asienmedia-tiles'),a=(await ci.keys()).length,b=(await ct.keys()).length;
    e.textContent=a+' Fotos und '+b+' Kartenkacheln sind auf diesem Gerät gespeichert.'+(navigator.serviceWorker&&navigator.serviceWorker.controller?'':' Hinweis: Lade die Seite einmal neu, dann wird das Speichern aktiv.');
  }catch(err){e.textContent='Dieses Gerät kann nichts speichern.'}
}
async function packPhotos(){
  const urls=packList(),msg=m=>{const e=$('#packmsg');if(e)e.textContent=m};
  if(!('caches' in window)){msg('Dieses Gerät kann Fotos nicht speichern.');return}
  if(!(navigator.serviceWorker&&navigator.serviceWorker.controller)){msg('Lade die Seite einmal neu, dann kann ich Fotos speichern.');return}
  let done=0,fail=0,i=0;msg('0 von '+urls.length+' …');
  const work=async()=>{while(i<urls.length){const u=urls[i++];try{const r=await fetch(u,{mode:'cors',credentials:'omit'});if(!r.ok)throw 0;await r.arrayBuffer()}catch(err){fail++}done++;if(done%5===0||done===urls.length)msg(done+' von '+urls.length+' geprüft'+(fail?', '+fail+' nicht geladen':'')+' …')}};
  await Promise.all([work(),work(),work(),work()]);
  msg('Fertig: '+(urls.length-fail)+' Fotos gespeichert'+(fail?', '+fail+' ließen sich nicht laden':'')+'.');
}

/* Bewertungen: Booking (von 10) und Tripadvisor (von 5, nur ab 10 Bewertungen) */
function hotelScore(stop,x){
  const t=typeof HOTEL_TA!=='undefined'?HOTEL_TA[stop+'|'+x.n]:null,tOk=t&&t[1]>=10;
  const bk=x.r?'Booking '+String(x.r).replace('.',',')+'/10':'';
  const ta=tOk?'Tripadvisor '+String(t[0]).replace('.',',')+'/5 ('+t[1].toLocaleString('de-DE')+' Bewertungen)':'';
  return [bk,ta].filter(Boolean).join(' · ')||'noch keine Bewertung';
}
function hotelIdeas(b){
  const H=HOTELS[b.stop],st=STOPS[b.stop].st;

  if(st==='jp'||st==='ko')h+='<p class="note">In Japan und Seoul beginnt Klasse 1 bei ca. 35–70 € pro Nacht für zwei. Noch günstiger sind Hostel-Privatzimmer und Kapselhotels (oft ab ca. 25–35 € pro Person, nicht geprüft).</p>';

document.addEventListener('input',e=>{
  if(e.target.id==='iq'){state.iqRaw=e.target.value;state.iq=e.target.value.trim().toLowerCase();const l=$('#ilist');if(l)l.innerHTML=ideaList();return}
  if(e.target.id==='cv-a'||e.target.id==='cv-c'){const a=num($('#cv-a').value),c=$('#cv-c').value;$('#cv-o').textContent=eur2(eurOf(a,c))}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-add]');
  if(f){e.preventDefault();const k=f.dataset.add,t=$('#add-'+k).value.trim();if(!t)return;store.custom[k].push({id:'c'+Date.now(),t});save();keep();const n=$('#add-'+k);if(n)n.focus({preventScroll:true});return}
  if(e.target.id==='namesf'){e.preventDefault();const fd=new FormData(e.target);store.set.n1=String(fd.get('n1')||'').trim()||'Person 1';store.set.n2=String(fd.get('n2')||'').trim()||'Person 2';save();keep()}
});
const hs=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===hs))state.tab=hs;
if(hs.startsWith('sync=')){let u='';try{u=decodeURIComponent(hs.slice(5)).trim()}catch(e){}
  if(/^https:\/\/[^\/]+\.(firebasedatabase\.app|firebaseio\.com)\/[^\s]+$/i.test(u)){try{localStorage.setItem(SYNC_KEY,u)}catch(e){}setTimeout(()=>{const b=document.createElement('div');b.setAttribute('role','status');b.textContent='Gemeinsam nutzen ist eingeschaltet. Eure Einträge gleichen sich jetzt ab.';b.style.cssText='position:fixed;left:16px;right:16px;top:16px;z-index:9999;background:#0f1b2d;color:#fff;padding:14px 16px;border-radius:14px;font:600 15px/1.4 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:center';document.body.appendChild(b);setTimeout(()=>b.remove(),6000)},300)}
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
render();
syncStart();
{let raf=0;addEventListener('scroll',()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;document.body.classList.toggle('scrolled',scrollY>160)})},{passive:true})}
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
