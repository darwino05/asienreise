/* ---------- SEOUL ---------- */
{id:"sel-myeongdong",s:"sel",c:"market",t:"Myeongdong Streetfood und Shopping",wp:"Myeongdong",q:"Myeongdong Night Market, Seoul",d:"Koreas Beauty-Hauptstadt mit unzähligen Kosmetikläden, abends dazu der Streetfood-Markt: Spieße, Tteokbokki, Hotteok, Gyeran-ppang.",h:"Läden ca. 10:00–22:00, Streetfood ab ca. 17:00",p:"Streetfood ca. 3.000–10.000 KRW",z:"2 Std.",w:"U-Bahn Myeongdong (Line 4)",tips:["Viele Stände akzeptieren nur Bargeld oder lokale Kartenzahlung.","Kosmetik hat oft Tax-Free-Schalter, Pass mitbringen."]},
{id:"sel-gyeongbok",s:"sel",c:"sight",t:"Gyeongbokgung-Palast",wp:"Gyeongbokgung",q:"Gyeongbokgung Palace, Seoul",d:"Der größte und schönste der fünf Paläste aus der Joseon-Dynastie. Mit dem Wechsel der Wachen vor dem Eingang. Wer einen Hanbok (Tracht) trägt, hat freien Eintritt.",h:"Täglich 9:00 bis ca. 17:00–18:30 je nach Saison. Dienstags geschlossen",p:"3.000 KRW für Erwachsene, frei mit Hanbok",z:"2 Std.",w:"U-Bahn Gyeongbokgung (Line 3), Ausgang 5",tips:["Dienstag ist der Palast geschlossen, daher der Besuch an einem anderen Tag planen.","Hanbok-Verleih in Palastnähe ca. 15.000–30.000 KRW für 2–4 Std.","Die Wachablösung am Gwanghwamun-Tor ist ein Fotomotiv."]},
{id:"sel-bukchon",s:"sel",c:"sight",t:"Bukchon-Hanok-Dorf",wp:"Bukchon Hanok Village",q:"Bukchon Hanok Village, Seoul",d:"Gassen mit traditionellen Holzhäusern (Hanok) an einem Hang, mit Blick über Dächer und Hochhäuser. Dort wohnen weiterhin Menschen, deshalb gelten Ruhezeiten.",h:"Besuchszeit für Touristen meist ca. 10:00–17:00",p:"Eintritt frei",z:"1–1,5 Std.",w:"U-Bahn Anguk (Line 3), Ausgang 2",tips:["Bitte leise sein. In manchen Gassen gelten feste Besuchszeiten und Gebühren bei Verstoß.","Cafés in Hanok-Häusern gibt es auch, die Aussicht ist gut."]},
{id:"sel-insadong",s:"sel",c:"market",t:"Insadong",wp:"Insadong",q:"Insadong, Seoul",d:"Straße mit Teehäusern, Kunsthandwerk, Papierläden und Souvenirs. Ruhiger und traditioneller als Myeongdong.",h:"Läden meist ca. 10:00–20:00",p:"Eintritt frei",z:"1–2 Std.",w:"U-Bahn Anguk oder Jongno 3(sam)-ga",tips:["Probiert Traditionelles wie Patbingsu oder Tee.","Ssamziegil ist ein kleines Kaufhaus mit Kunsthandwerk."]},
{id:"sel-seokchon",s:"sel",c:"nature",t:"Seokchon-See (Kirschblüte)",wp:"Seokchon Lake",q:"Seokchon Lake, Seoul",d:"Kleiner See neben dem Lotte World Tower, den im April ein Tunnel aus Kirschblüten umgibt. Im Hintergrund der Hochhausturm.",h:"Jederzeit, Beleuchtung abends",p:"Eintritt frei",z:"1 Std.",w:"U-Bahn Jamsil (Line 2 und 8)",tips:["Morgens früh am ruhigsten, am Wochenende sehr voll.","Die Blüte hängt von der Witterung ab."]},
{id:"sel-lotte",s:"sel",c:"sight",t:"Lotte World Tower und Seoul Sky",wp:"Lotte World Tower",q:"Seoul Sky Lotte World Tower",d:"Mit 555 m der höchste Wolkenkratzer Koreas. Die Aussichtsplattform Seoul Sky liegt im 117.–123. Stock.",h:"Täglich ca. 10:00–22:00",p:"ca. 29.000–35.000 KRW",z:"1,5 Std.",w:"U-Bahn Jamsil, direkt am Tower",tips:["Online buchen ist günstiger.","Ein Glasboden gibt Nervenkitzel."]},
{id:"sel-hongdae",s:"sel",c:"night",t:"Hongdae am Abend",wp:"Hongdae",q:"Hongdae, Seoul",d:"Das Studentenviertel mit Livemusik, Straßenkünstlern, Cafés und Clubs. Abends voll und jung.",h:"Abends bis spät",p:"Eintritt frei, Essen ca. 8.000–15.000 KRW",z:"2–3 Std.",w:"U-Bahn Hongik Univ. (Line 2, Airport Railroad)",tips:["Straßenkünstler-Auftritte oft am Abend rund um den Spielplatz.","Soju und Bier in einer Bar oder im Convenience Store."]},
{id:"sel-yeouido",s:"sel",c:"nature",t:"Yeouido Hangang Park und Kirschblütenallee",wp:"Yeouido",q:"Yeouido Hangang Park, Seoul",d:"Die Kirschblütenallee hinter der Nationalversammlung ist ein Fixpunkt der Saison, mit Festival-Stimmung und Ständen. Ein paar Schritte weiter liegt der Hangang-Park am Fluss.",h:"Straße abends beleuchtet",p:"Eintritt frei",z:"1–2 Std.",w:"U-Bahn Yeouinaru (Line 5)",tips:["Werktags früh am Morgen kommen. Am Wochenende gibt es Stau und Gedränge.","Zum Picknick am Fluss bei Konbini Ramen kochen."]},
{id:"sel-hanriver",s:"sel",c:"fun",t:"Fahrrad am Han-Fluss",wp:"Han River (Korea)",q:"Banpo Hangang Park bike rental, Seoul",d:"Entlang des Han-Flusses führen breite Radwege. Räder gibt es an Verleihstationen, abends Picknick und Ramen im Konbini.",h:"Verleih meist ca. 9:00–19:00",p:"Radverleih ca. 3.000–5.000 KRW pro Stunde",z:"2 Std.",w:"Yeouido oder Ttukseom Hangang Park",tips:["Banpo Bridge Rainbow Fountain läuft abends (saisonal).","Auf den Radwegen links fahren."]},
{id:"sel-bbq",s:"sel",c:"food",t:"Korean BBQ",wp:"Korean barbecue",q:"Korean BBQ Seoul",d:"Fleisch auf dem Tischgrill, dazu Beilagen, Salat und Reis. Samgyeopsal (Schweinebauch) ist der Klassiker. Zusammen kocht und isst man.",h:"Meist ab ca. 17:00",p:"ca. 15.000–28.000 KRW pro Person (Mindestbestellung 2 Portionen)",z:"1,5–2 Std.",w:"Überall, beliebte Viertel: Mapo, Euljiro, Hongdae",tips:["Fleisch in Salatblätter wickeln, mit Ssamjang und Knoblauch.","Die Lokale verlangen oft mindestens zwei Portionen."]},
{id:"sel-dmz",s:"sel",c:"trip",t:"DMZ-Tour",wp:"Korean Demilitarized Zone",q:"DMZ tour Seoul",d:"Halb- oder Ganztagestour zur Grenze zwischen Nord- und Südkorea: Tunnel, Aussichtspunkt und Dorf Panmunjom (je nach Tour). Bewegend und politisch.",h:"Touren meist ca. 8:00–17:00, nicht an allen Tagen",p:"ca. 60.000–150.000 KRW je nach Tour",z:"4–9 Std.",w:"Abholung in Seoul, ca. 1 Std. Fahrt",tips:["Vorab buchen, Reisepass mitbringen, Kleiderordnung beachten.","Die Strecke kann je nach politischer Lage gesperrt sein."]},
{id:"sel-bukhansan",s:"sel",c:"nature",t:"Bukhansan-Wanderung",wp:"Bukhansan National Park",q:"Bukhansan National Park",d:"Nationalpark mit Granit-Gipfeln direkt am Stadtrand. Der Aufstieg zum Baegundae-Gipfel (836 m) dauert ca. 4–5 Std. hin und zurück. Anstrengend, aber mit Blick auf ganz Seoul.",h:"Täglich bei Tageslicht",p:"Eintritt frei",z:"4–6 Std.",w:"U-Bahn Gupabal (Line 3) und Bus",tips:["Feste Wanderschuhe, Wasser und Snacks. Im Frühjahr kann es noch kalt sein.","Koreaner wandern oft in voller Ausrüstung, Cafés und Makgeolli-Stände unten."]},
{id:"sel-namsan",s:"sel",c:"sight",t:"N Seoul Tower am Namsan",wp:"N Seoul Tower",q:"N Seoul Tower, Seoul",d:"Turm auf dem Namsan-Berg. Der Weg hinauf führt durch einen Park, die Seilbahn ist eine Alternative. Abends glitzert die Stadt unter euch.",h:"Täglich ca. 10:00–23:00",p:"Aussichtsplattform ca. 21.000 KRW, Seilbahn ca. 15.000 KRW",z:"2 Std.",w:"Zu Fuß ab U-Bahn Myeongdong oder Seilbahn",tips:["Zum Sonnenuntergang kommen.","Liebesschlösser am Zaun gehören dazu, Schloss mitbringen oder vor Ort kaufen."]},
{id:"sel-gwangjang",s:"sel",c:"food",t:"Gwangjang-Markt",wp:"Gwangjang Market",q:"Gwangjang Market, Seoul",d:"Einer der ältesten Märkte Seouls, berühmt für Bindaetteok (Mungbohnen-Pfannkuchen), Mayak-Kimbap, Yukhoe (Rindertatar) und Tteokbokki.",h:"Meist ca. 9:00–22:00",p:"Gerichte ca. 5.000–15.000 KRW",z:"1,5 Std.",w:"U-Bahn Jongno 5(o)-ga (Line 1)",tips:["Auf den Hockern am Stand sitzen und teilen.","Mittags am vollsten, späte Nachmittage sind ruhiger."]},
{id:"sel-changdeok",s:"sel",c:"sight",t:"Changdeokgung und Geheimer Garten",wp:"Changdeokgung",q:"Changdeokgung Palace, Seoul",d:"UNESCO-Welterbe-Palast mit dem Huwon (Geheimer Garten), der nur mit Führung besichtigt werden kann. Oft ruhiger und natürlicher als Gyeongbokgung.",h:"Meist ca. 9:00–17:30, Montag geschlossen",p:"ca. 3.000 KRW (Palast), Garten ca. 5.000 KRW extra",z:"2 Std.",w:"U-Bahn Anguk (Line 3)",tips:["Für den Garten Plätze für die Führung vorab buchen.","Zur Kirschblüte sehr schön."]},
{id:"sel-ikseon",s:"sel",c:"food",t:"Ikseon-dong",wp:"Ikseon-dong",q:"Ikseon-dong Hanok Village, Seoul",d:"Enge Gassen mit renovierten Hanok-Häusern voller Cafés, Boutiquen und kleinen Restaurants. Sehr fotogen.",h:"Läden meist ca. 11:00–22:00",p:"Kaffee ca. 5.000–8.000 KRW",z:"1,5 Std.",w:"U-Bahn Jongno 3(sam)-ga",tips:["Am Abend beleuchtet, am Wochenende voll."]},
{id:"sel-ddp",s:"sel",c:"sight",t:"Dongdaemun Design Plaza",wp:"Dongdaemun Design Plaza",q:"Dongdaemun Design Plaza, Seoul",d:"Futuristischer Gebäudekomplex der Architektin Zaha Hadid. Nachts erstrahlt die Fassade, nebenan Mode- und Nachtmärkte.",h:"Außenbereich jederzeit, Ausstellungen ca. 10:00–19:00",p:"Außenbereich frei",z:"1 Std.",w:"U-Bahn Dongdaemun History & Culture Park",tips:["Abends ist das Gebäude beleuchtet, und im Park leuchtet ein LED-Rosengarten."]},
{id:"sel-cheonggye",s:"sel",c:"nature",t:"Cheonggyecheon-Bach",wp:"Cheonggyecheon",q:"Cheonggyecheon Stream, Seoul",d:"Renovierter Wasserlauf mitten in der Stadt, einst unter einer Hochstraße begraben. Gut für einen entspannten Abendspaziergang.",h:"Jederzeit",p:"Eintritt frei",z:"1 Std.",w:"U-Bahn City Hall oder Gwanghwamun",tips:["Abends mit Beleuchtung am schönsten."]},
{id:"sel-starfield",s:"sel",c:"fun",t:"Starfield Library (COEX)",wp:"COEX Mall",q:"Starfield Library COEX Mall, Seoul",d:"Riesige öffentliche Bibliothek mit 13 m hohen Bücherregalen mitten in einem Einkaufszentrum. Kostenlos zugänglich und sehr fotogen.",h:"Meist ca. 10:30–22:00",p:"Eintritt frei",z:"30–45 Min.",w:"U-Bahn Samseong oder Bongeunsa",tips:["Am Wochenende sehr voll, früh am Tag kommen.","Mit dem Aquarium im COEX kombinierbar."]},
{id:"sel-seongsu",s:"sel",c:"market",t:"Seongsu-dong",wp:"Seongsu-dong",q:"Seongsu-dong, Seoul",d:"Das „Brooklyn von Seoul“: Fabrikhallen als Cafés, Concept-Stores und Pop-ups. Gut für Mode, Design und besonderen Kaffee.",h:"Läden meist ca. 11:00–21:00",p:"Eintritt frei",z:"2–3 Std.",w:"U-Bahn Seongsu (Line 2)",tips:["Lange Schlangen vor angesagten Pop-ups.","Nachmittags am angenehmsten."]},
{id:"sel-jjimjilbang",s:"sel",c:"fun",t:"Jjimjilbang (koreanisches Bad)",wp:"Jjimjilbang",q:"Dragon Hill Spa Seoul jjimjilbang",d:"Koreanisches Spa mit Saunen, heißen Becken, Ruheräumen und Snacks. Nach langen Tagen und Wanderungen das beste Erholungsprogramm.",h:"Oft rund um die Uhr geöffnet",p:"ca. 12.000–25.000 KRW",z:"2–4 Std.",w:"Dragon Hill Spa (Yongsan) ist ein bekanntes Beispiel",tips:["Bei Nacktbereichen sind die Bereiche nach Geschlecht getrennt.","Der Eintritt enthält meist Bademantel und Handtuch."]},
{id:"sel-nami",s:"sel",c:"trip",t:"Nami-Insel",wp:"Nami Island",q:"Nami Island, Chuncheon",d:"Kleine Flussinsel mit Alleen, Pfaden und Bootsanleger, bekannt aus Serien. Zur Kirschblüte gibt es Blütenspaziergänge.",h:"Meist ca. 8:00–21:00",p:"Fähre und Eintritt ca. 16.000 KRW",z:"Ganzer Tag",w:"ca. 1,5 Std. von Seoul, Zug oder Bus",tips:["Früh starten, die Insel ist ein beliebtes Ausflugsziel."]},
{id:"sel-suwon",s:"sel",c:"trip",t:"Festung Hwaseong in Suwon",wp:"Hwaseong Fortress",q:"Hwaseong Fortress, Suwon",d:"Stadtmauer aus dem 18. Jahrhundert, UNESCO-Welterbe. Ihr lauft auf der Mauer und seht die ganze Stadt.",h:"Täglich ca. 9:00–18:00",p:"ca. 1.000–3.000 KRW",z:"Halber Tag",w:"ca. 1 Std. von Seoul mit der U-Bahn und Zug",tips:["Die Runde auf der Mauer dauert ca. 2 Std."]},
{id:"sel-jogyesa",s:"sel",c:"sight",t:"Jogyesa-Tempel",wp:"Jogyesa",q:"Jogyesa Temple, Seoul",d:"Wichtigster Zen-Tempel Seouls, mitten in der Stadt. Im Frühling hängen unzählige bunte Laternen, wenn Buddhas Geburtstag näherkommt.",h:"Täglich ca. 4:00–21:00",p:"Eintritt frei",z:"45 Min.",w:"U-Bahn Anguk, Insadong in der Nähe",tips:["Laternenfest meist im Mai, die Vorbereitungen sieht man schon im April."]}
];

/* ---------- BANGKOK (zusätzlich) ---------- */
{id:"bkk-khaosan",s:"bkk",c:"night",t:"Khao San Road",wp:"Khaosan Road",q:"Khao San Road, Bangkok",d:"Die berühmteste Backpacker-Straße der Welt: Hostels, Bars, Streetfood, Tuk-Tuks und Massage-Stände. Laut und touristisch, aber ein typischer Bangkok-Abend.",h:"Abends bis spät in die Nacht",p:"Pad Thai ca. 60–100 THB, Bier ca. 80–120 THB",z:"1–2 Std.",w:"Boot bis Phra Arthit Pier (N13), 5 Min. zu Fuß",tips:["Für Streetfood lohnt sich die Seitenstraße Soi Rambuttri.","Auf Tuk-Tuk-Schlepper nicht eingehen, Taxi mit Taxameter oder Grab nutzen."]},

/* ---------- KOH PHI PHI ---------- */
{id:"phi-maya",s:"phi",c:"nature",t:"Maya Bay",wp:"Maya Bay",q:"Maya Bay, Koh Phi Phi Leh",d:"Die Bucht aus dem Film „The Beach“ zwischen steilen Kalkfelsen. Nach jahrelanger Schließung zum Schutz der Korallen ist sie wieder zugänglich, aber mit Regeln: Baden ist verboten, die Besuchszeit ist begrenzt, Boote legen an einem Steg an der Rückseite an.",h:"Täglich ca. 10:00–16:00 (August und September geschlossen, Zeiten ändern sich)",p:"Nationalparkgebühr ca. 400 THB pro Person",z:"1 Std. vor Ort",w:"Longtail oder Speedboat ab Ton Sai, ca. 30 Min.",tips:["Früh am Vormittag oder spät am Nachmittag kommen, mittags legen die meisten Gruppen an.","Regeln der Parkranger beachten, auch das Betreten des Strandes ist eingeschränkt.","Sonnencreme ohne Riffschädigung (reef safe) verwenden."]},
{id:"phi-tour",s:"phi",c:"trip",t:"Inselrundfahrt Phi Phi (Pileh Lagoon, Monkey Beach, Viking Cave)",wp:"Phi Phi Islands",q:"Phi Phi Islands boat tour",d:"Tagestour mit Longtail oder Speedboat rund um Phi Phi Leh und Phi Phi Don: Schnorcheln in der Pileh-Lagune, Affen am Monkey Beach, die Viking Cave und Bamboo Island.",h:"Meist ca. 9:00–16:00",p:"Gruppentour ca. 1.000–2.000 THB, privates Longtail ca. 2.500–3.500 THB (plus Nationalparkgebühr ca. 400 THB)",z:"4–7 Std.",w:"Abfahrt am Strand von Ton Sai oder Loh Dalum",tips:["Die Affen am Monkey Beach nicht füttern, sie beißen.","Privates Boot ist teurer, aber ihr bestimmt Zeit und Route und seid vor den großen Gruppen da.","Schnorchelausrüstung ist meist inklusive, Details beim Buchen klären."]},
{id:"phi-viewpoint",s:"phi",c:"nature",t:"Phi Phi Viewpoint",wp:"Ko Phi Phi Don",q:"Phi Phi Island View Point",d:"Etwa 20–30 Minuten Treppen führen von Ton Sai hinauf zum berühmten Blick über die beiden Buchten Ton Sai und Loh Dalum. Zum Sonnenuntergang am schönsten.",h:"Ab ca. 6:00, abends nur bis Dämmerung",p:"ca. 30–50 THB",z:"1–1,5 Std.",w:"Wegweiser ab Ton Sai Village, zu Fuß",tips:["Wasser mitnehmen. Es gibt oben kleine Stände.","Zum Sonnenuntergang kommen viele, früh da sein oder ein Stück tiefer gehen."]},
{id:"phi-tonsai",s:"phi",c:"night",t:"Ton Sai: Strand, Feuershow und Abendessen",wp:"Ko Phi Phi Don",q:"Ton Sai Village, Koh Phi Phi",d:"Das Dorf der Insel mit Strandbars, Restaurants und Feuershows am Abend. Autos gibt es nicht, alles geht zu Fuß oder per Boot.",h:"Abends bis spät",p:"Essen ca. 150–400 THB, Eimer-Cocktail ca. 250–400 THB",z:"2–3 Std.",w:"Anlegestelle der Fähren",tips:["Auf Phi Phi sind Essen und Unterkünfte teurer als auf dem Festland, vorab Preise vergleichen.","Eimer-Getränke sind stark, Becher nicht aus den Augen lassen."]},

/* ---------- KOH LANTA ---------- */
{id:"lan-beaches",s:"lan",c:"nature",t:"Strände von Koh Lanta",wp:"Ko Lanta",q:"Kantiang Bay, Koh Lanta",d:"Entspannte Strände an der Westküste, von Long Beach und Klong Nin bis zur schönen Kantiang Bay. Ruhiger und günstiger als Phi Phi.",h:"Den ganzen Tag",p:"Eintritt frei, Liege ca. 50–100 THB bei Konsum",z:"Halber bis ganzer Tag",w:"Mietroller ca. 250–300 THB pro Tag oder Songthaew",tips:["Mit dem Roller lassen sich mehrere Buchten an einem Tag verbinden.","Kantiang Bay und Nui Bay sind besonders ruhig."]},
{id:"lan-oldtown",s:"lan",c:"sight",t:"Lanta Old Town",wp:"Lanta Old Town",q:"Lanta Old Town, Koh Lanta",d:"Fischerdorf mit Holzhäusern auf Stelzen, Seafood-Restaurants über dem Wasser und kleinen Läden. Ein gemütlicher Abend abseits der Strände.",h:"Läden meist tagsüber, Restaurants bis ca. 21:00",p:"Essen ca. 150–350 THB",z:"2 Std.",w:"ca. 20–30 Min. vom Strand, Songthaew oder Roller",tips:["Frischer Fisch wird nach Gewicht abgerechnet, vorher Preis klären.","Zum Sonnenuntergang kommen."]},
{id:"lan-nationalpark",s:"lan",c:"nature",t:"Mu-Ko-Lanta-Nationalpark und Leuchtturm",wp:"Mu Ko Lanta National Park",q:"Mu Ko Lanta National Park lighthouse",d:"Am Südzipfel der Insel führen Wege durch Dschungel zu einem Leuchtturm mit Küstenblick und zu einsamen Stränden.",h:"Täglich ca. 8:00–17:00",p:"Nationalparkgebühr ca. 200 THB",z:"2–3 Std.",w:"ca. 45 Min. mit dem Roller ab Saladan",tips:["Festes Schuhwerk und Wasser, wenig Schatten.","Mückenschutz am Dschungelrand."]},
{id:"lan-koh-rok",s:"lan",c:"trip",t:"Schnorcheltour Koh Rok und Koh Haa",wp:"Ko Rok",q:"Koh Rok Koh Haa snorkeling tour Koh Lanta",d:"Tagestour per Speedboat zu den besten Schnorchelplätzen der Gegend: klares Wasser, Korallen und Fische. Eine der schönsten Touren von Lanta.",h:"Meist ca. 8:00–16:00",p:"ca. 1.800–2.500 THB (plus Nationalparkgebühr, oft extra)",z:"Ganzer Tag",w:"Abholung im Hotel, Abfahrt ab Saladan",tips:["Bei starkem Wind fällt die Tour aus, Reservepuffer einplanen.","Wer anfällig ist für Seekrankheit, vorher Tabletten nehmen."]},

/* ---------- SIEM REAP / ANGKOR ---------- */
{id:"rep-angkorwat",s:"rep",c:"sight",t:"Angkor Wat (Sonnenaufgang)",wp:"Angkor Wat",q:"Angkor Wat, Siem Reap",d:"Größtes religiöses Bauwerk der Welt, im 12. Jahrhundert erbaut. Fünf Türme, Reliefgalerien und die berühmte Silhouette im Sonnenaufgang über dem Teich.",h:"Täglich ca. 5:00–17:30",p:"Angkor Pass: 1 Tag 37 USD, 3 Tage 62 USD, 7 Tage 72 USD",z:"3–4 Std.",w:"Tuk-Tuk ab Siem Reap ca. 6 km, Tagesmiete ca. 20–25 USD",tips:["Für den Sonnenaufgang gegen 4:30 Uhr losfahren, die besten Plätze am Teich sind schnell besetzt.","Schultern und Knie bedeckt, sonst kein Zutritt zu den oberen Ebenen.","Der Pass wird an den Tempeln kontrolliert, bei Kauf wird ein Foto gemacht. Nicht verlieren."]},
{id:"rep-bayon",s:"rep",c:"sight",t:"Angkor Thom und Bayon",wp:"Bayon",q:"Bayon Temple, Angkor Thom",d:"Der Bayon in Angkor Thom hat über 200 lächelnde Steingesichter an 54 Türmen. Rund um den Tempel liegen Terrassen des Elefanten und des Lepra-Königs.",h:"Täglich ca. 7:30–17:30",p:"im Angkor Pass",z:"2–3 Std.",w:"Tuk-Tuk, ca. 8 km von Siem Reap",tips:["Vormittags ab 7:30 Uhr sind weniger Gruppen da.","Die Eingangstore von Angkor Thom (Südtor) sind ein schönes Fotomotiv."]},
{id:"rep-taprohm",s:"rep",c:"sight",t:"Ta Prohm (Tempel im Dschungel)",wp:"Ta Prohm",q:"Ta Prohm, Angkor",d:"Der Tempel, den der Dschungel zurückerobert hat. Riesige Baumwurzeln wachsen über die Mauern, bekannt als Kulisse von „Tomb Raider“.",h:"Täglich ca. 7:30–17:30",p:"im Angkor Pass",z:"1,5–2 Std.",w:"Tuk-Tuk, ca. 6 km vom Angkor Wat",tips:["Früh kommen, weil es schnell voll wird und der Schatten wichtig ist.","Auf den Wegen gibt es markierte Fotospots, an denen sich Schlangen bilden."]},
{id:"rep-bantaysrei",s:"rep",c:"sight",t:"Banteay Srei",wp:"Banteay Srei",q:"Banteay Srei, Siem Reap",d:"Kleiner Tempel aus rosa Sandstein mit besonders feinen Reliefs, etwa 25 km außerhalb von Siem Reap. Ein Highlight für Liebhaber der Details.",h:"Täglich ca. 7:30–17:30",p:"im Angkor Pass",z:"1–1,5 Std.",w:"Tuk-Tuk ca. 45 Min., oft mit Stopp an Banteay Samre",tips:["Gut am frühen Morgen, wenn die Farben leuchten.","Auf dem Weg gibt es Dörfer mit Palmzucker-Verkauf."]},
{id:"rep-tonlesap",s:"rep",c:"fun",t:"Schwimmende Dörfer am Tonle Sap",wp:"Kampong Phluk",q:"Kampong Phluk floating village Siem Reap",d:"Bootstour zu Dörfern auf Stelzen und schwimmenden Häusern am größten See Südostasiens. Gute Einblicke in das Alltagsleben, besonders zum Sonnenuntergang.",h:"Touren meist nachmittags",p:"ca. 20–35 USD",z:"Halber Tag",w:"ca. 30–45 Min. von Siem Reap, Abholung möglich",tips:["Anbieter mit fairen Preisen und lokalem Guide wählen.","Wasserstand ist saisonal, in der Trockenzeit sind die Häuser höher über dem Boden."]},
{id:"rep-pubstreet",s:"rep",c:"night",t:"Pub Street und Old Market",wp:"Pub Street",q:"Pub Street, Siem Reap",d:"Abends füllt sich das Zentrum mit Bars, Streetfood und Nachtmärkten. Rund um den Old Market gibt es günstiges Khmer-Essen und Souvenirs.",h:"Abends bis spät",p:"Bier ca. 0,50–1,50 USD, Gerichte ca. 2–5 USD",z:"2–3 Std.",w:"Zentrum von Siem Reap, zu Fuß",tips:["Mit Fußgängern teilt man sich die Straße, Taschen eng tragen.","Khmer Amok (Fisch im Bananenblatt) probieren."]},
{id:"rep-phare",s:"rep",c:"fun",t:"Phare, der Kambodschanische Zirkus",wp:"Phare, The Cambodian Circus",q:"Phare The Cambodian Circus, Siem Reap",d:"Akrobatik, Tanz und Musik von jungen Künstlerinnen und Künstlern einer sozialen Organisation. Eine bewegende Show mit viel Energie.",h:"Abendvorstellungen meist ca. 20:00",p:"ca. 18–40 USD je nach Platz",z:"1,5 Std.",w:"Zentrum von Siem Reap, kostenloser Shuttle möglich",tips:["Vorab buchen, die guten Plätze sind schnell weg.","Mit den Einnahmen werden Schulen und Ausbildung unterstützt."]},
{id:"rep-museum",s:"rep",c:"sight",t:"Angkor National Museum",wp:"Angkor National Museum",q:"Angkor National Museum, Siem Reap",d:"Modernes Museum mit Statuen, Reliefs und Filmen zur Geschichte der Khmer. Gut, um das Gesehene besser einzuordnen.",h:"Täglich ca. 8:30–18:00",p:"ca. 12–15 USD",z:"1,5–2 Std.",w:"Zentrum, kurzes Tuk-Tuk",tips:["Gut an einem Nachmittag mit Hitze oder Regen.","Audioguide im Preis oft nicht enthalten."]},
{id:"rep-landmine",s:"rep",c:"sight",t:"Cambodia Landmine Museum",wp:"Cambodia Landmine Museum",q:"Cambodia Landmine Museum, Siem Reap",d:"Museum von Aki Ra, der als Kind Soldat war und später Minen entschärfte. Es zeigt den Alltag und die Folgen des Krieges und unterstützt Betroffene.",h:"Täglich ca. 7:30–17:30",p:"ca. 5–6 USD",z:"1–1,5 Std.",w:"ca. 30 Min. nordöstlich von Siem Reap, Tuk-Tuk",tips:["Mit dem Besuch von Banteay Srei kombinierbar."]},
{id:"rep-cooking",s:"rep",c:"fun",t:"Khmer-Kochkurs",wp:"Cambodian cuisine",q:"Khmer cooking class Siem Reap",d:"Marktbesuch und Kochen von Amok, Lok Lak und Frühlingsrollen. Meist ein paar Stunden und günstig.",h:"Vormittags oder nachmittags",p:"ca. 12–25 USD",z:"3–4 Std.",w:"Abholung vom Hotel möglich",tips:["Vegetarische Varianten werden meist angeboten.","Rezeptheft zum Mitnehmen nachfragen."]},
{id:"rep-sunset",s:"rep",c:"nature",t:"Phnom Bakheng (Sonnenuntergang)",wp:"Phnom Bakheng",q:"Phnom Bakheng, Angkor",d:"Hügeltempel mit Blick über Angkor Wat und die Wälder. Der Aufstieg dauert etwa 15 Minuten. Der Zugang ist wegen des Andrangs begrenzt.",h:"Täglich ca. 5:00–19:00",p:"im Angkor Pass",z:"1–1,5 Std.",w:"Tuk-Tuk, Aufstieg zu Fuß",tips:["Wegen der Besucherbegrenzung früh anstellen.","Sonnenuntergang auch vom Pre Rup möglich."]},

/* ---------- HO-CHI-MINH-STADT ---------- */
{id:"sgn-warmuseum",s:"sgn",c:"sight",t:"War Remnants Museum",wp:"War Remnants Museum",q:"War Remnants Museum, Ho Chi Minh City",d:"Museum zum Vietnamkrieg mit Fotos, Fahrzeugen und Berichten. Eindringlich und aus vietnamesischer Sicht erzählt, teils sehr belastend.",h:"Täglich ca. 7:30–18:00",p:"ca. 40.000 VND",z:"1,5–2 Std.",w:"Zentrum von Ho-Chi-Minh-Stadt, Grab oder zu Fuß",tips:["Mittags wird es sehr voll, früh kommen.","Nichts für kleine Kinder, einige Bilder sind drastisch."]},
{id:"sgn-reunification",s:"sgn",c:"sight",t:"Wiedervereinigungspalast",wp:"Independence Palace",q:"Reunification Palace, Ho Chi Minh City",d:"Früherer Präsidentenpalast Südvietnams, wo 1975 ein Panzer die Tore durchbrach. Im Keller liegen Kommandozentralen aus den 70ern.",h:"Täglich ca. 7:30–19:00",p:"ca. 65.000 VND",z:"1 Std.",w:"Zentrum, 10 Min. von der Hauptpost",tips:["Das Gelände ist weitläufig, Hut und Wasser mitnehmen."]},
{id:"sgn-notredame",s:"sgn",c:"sight",t:"Kathedrale Notre-Dame",wp:"Notre-Dame Cathedral Basilica of Saigon",q:"Notre-Dame Cathedral Basilica of Saigon",d:"Rote Backsteinkirche aus der Kolonialzeit mit zwei Türmen. Oft eingerüstet wegen Renovierung. Der Platz davor ist ein beliebter Treffpunkt.",h:"Außenansicht jederzeit",p:"Eintritt frei",z:"30 Min.",w:"Zentrum, direkt neben der Hauptpost",tips:["Das Innere ist nur zu bestimmten Zeiten geöffnet."]},
{id:"sgn-postoffice",s:"sgn",c:"sight",t:"Hauptpost von Saigon",wp:"Saigon Central Post Office",q:"Saigon Central Post Office",d:"Schöne Halle im französischen Kolonialstil mit gewölbter Decke und alten Telefonzellen. Ihr könnt Postkarten schreiben und verschicken.",h:"Täglich ca. 7:00–19:00",p:"Eintritt frei",z:"30 Min.",w:"Zentrum, neben der Kathedrale",tips:["Postkarten kosten ca. 15.000–20.000 VND inkl. Briefmarke."]},
{id:"sgn-benthanh",s:"sgn",c:"market",t:"Ben-Thanh-Markt und Nachtmarkt",wp:"Bến Thành Market",q:"Ben Thanh Market, Ho Chi Minh City",d:"Traditionelle Markthalle mit Stoffen, Souvenirs und Essen. Abends gibt es draußen einen Nachtmarkt mit Streetfood.",h:"Markt ca. 6:00–18:00, Nachtmarkt ab ca. 18:00",p:"Eintritt frei",z:"1–2 Std.",w:"Zentrum, Metro Ben Thanh",tips:["Handeln ist üblich, Richtwert: auf ca. 50–60 % des ersten Preises gehen.","Auf Taschen und Handy achten."]},
{id:"sgn-buivien",s:"sgn",c:"night",t:"Bui Vien Street (Backpacker-Meile)",wp:"Bùi Viện Street",q:"Bui Vien Walking Street, Ho Chi Minh City",d:"Die Ausgehstraße der Backpacker mit Bars, Livemusik und Streetfood. Laut, günstig und bunt.",h:"Abends bis spät",p:"Bier ca. 20.000–50.000 VND",z:"1–2 Std.",w:"Distrikt 1, zu Fuß vom Ben-Thanh-Markt",tips:["Taschendiebe sind hier häufig, nichts offen tragen.","Preise vor dem Bestellen ansehen."]},
{id:"sgn-cuchi",s:"sgn",c:"trip",t:"Cu-Chi-Tunnel",wp:"Củ Chi tunnels",q:"Cu Chi Tunnels, Ho Chi Minh City",d:"Unterirdisches Tunnelsystem aus dem Vietnamkrieg. Man kann kurze Strecken durchkriechen und sieht Fallen, Küchen und Lazarette.",h:"Täglich ca. 7:00–17:00",p:"Eintritt ca. 125.000 VND, Halbtagestour ab ca. 15–25 US$",z:"Halber Tag",w:"ca. 1,5 Std. von Ho-Chi-Minh-Stadt",tips:["Wer Platzangst hat, kann die Tunnel auslassen.","Früh starten, es wird heiß."]},
{id:"sgn-mekong",s:"sgn",c:"trip",t:"Mekong-Delta-Tour",wp:"Mekong Delta",q:"Mekong Delta day tour from Ho Chi Minh City",d:"Bootsfahrten auf Kanälen, Obstplantagen, Kokosnuss-Bonbons und kleine Dörfer. Der Klassiker als Tagestour von Saigon.",h:"Tour meist ca. 7:30–17:30",p:"ca. 25–40 US$",z:"Ganzer Tag",w:"ca. 2 Std. Fahrt, Tour mit Abholung",tips:["Kleine Gruppen bevorzugen, auf Verkaufsfahrten achten.","Sonnenschutz und Mückenmittel."]},
{id:"sgn-jade",s:"sgn",c:"sight",t:"Jade-Kaiser-Pagode",wp:"Jade Emperor Pagoda",q:"Jade Emperor Pagoda, Ho Chi Minh City",d:"Chinesisch geprägter Tempel voller Räucherwerk, Schildkröten und Götterfiguren. Eine stimmungsvolle Pause vom Straßenlärm.",h:"Täglich ca. 7:00–18:00",p:"ca. 20.000 VND",z:"45 Min.",w:"Distrikt 3, ca. 15 Min. mit Grab",tips:["Schultern und Knie bedecken, der Rauch kann kratzen."]},
{id:"sgn-cholon",s:"sgn",c:"market",t:"Cholon (Chinatown) und Binh-Tay-Markt",wp:"Cholon",q:"Binh Tay Market, Cholon, Ho Chi Minh City",d:"Das chinesische Viertel mit Pagoden, Kräuterläden und dem Großhandelsmarkt Binh Tay. Weniger touristisch als der Ben-Thanh-Markt.",h:"Markt ca. 6:00–18:00",p:"Eintritt frei",z:"2 Std.",w:"ca. 20–30 Min. mit Grab vom Zentrum",tips:["Am Vormittag am lebendigsten."]},
{id:"sgn-food",s:"sgn",c:"food",t:"Banh Mi und Streetfood in Saigon",wp:"Bánh mì",q:"Banh Mi Huynh Hoa Ho Chi Minh City",d:"Saigon ist günstig und lecker: Banh Mi, Com Tam (Bruchreis), Hu Tieu (Nudelsuppe) und Pho. Berühmte Banh-Mi-Läden sind Huynh Hoa und Banh Mi Hoa Ma.",h:"Frühstück bis spät",p:"Banh Mi ca. 20.000–50.000 VND, Nudelsuppe ca. 40.000–70.000 VND",z:"1 Std.",w:"Distrikt 1 und 3",tips:["Kleine Läden mit vielen Einheimischen sind meist gut.","Eiskaffee (Ca phe sua da) gehört dazu."]},

/* ---------- HIROSHIMA ---------- */
{id:"hij-peacepark",s:"hij",c:"sight",t:"Friedenspark Hiroshima",wp:"Hiroshima Peace Memorial Park",q:"Hiroshima Peace Memorial Park",d:"Weitläufiger Park zum Gedenken an die Atombombe vom 6. August 1945, mit Kenotaph, Flamme des Friedens und Kinder-Friedensdenkmal mit Papierkranichen.",h:"Park jederzeit",p:"Eintritt frei",z:"1–1,5 Std.",w:"Straßenbahn bis Genbaku-Dome-mae oder zu Fuß",tips:["Ein ruhiger, bewegender Ort. Respektvoll verhalten.","Die Papierkraniche stehen für den Wunsch nach Frieden."]},
{id:"hij-dome",s:"hij",c:"sight",t:"Atombombenkuppel (Genbaku Dome)",wp:"Hiroshima Peace Memorial",q:"Atomic Bomb Dome, Hiroshima",d:"Die Ruine der früheren Industrieförderhalle blieb nach der Explosion stehen und ist UNESCO-Welterbe. Sie wird als Mahnmal erhalten.",h:"Außenansicht jederzeit",p:"Eintritt frei",z:"30 Min.",w:"Straßenbahn bis Genbaku-Dome-mae",tips:["Am Abend beleuchtet, besonders eindrucksvoll.","Vom gegenüberliegenden Flussufer gut zu sehen."]},
{id:"hij-museum",s:"hij",c:"sight",t:"Friedensmuseum Hiroshima",wp:"Hiroshima Peace Memorial Museum",q:"Hiroshima Peace Memorial Museum",d:"Das Museum erzählt mit Fotos, Objekten und Zeitzeugenberichten vom Abwurf und seinen Folgen. Bewegend und wichtig, aber emotional.",h:"Täglich ca. 8:30–18:00 (im Frühling meist bis 18:00)",p:"ca. 200 ¥",z:"1,5–2 Std.",w:"Im Friedenspark",tips:["Mit Audioguide (ca. 400 ¥) werden Hintergründe klarer.","Einen ruhigen Zeitpunkt wählen, an Wochenenden voll."]},
{id:"hij-miyajima",s:"hij",c:"sight",t:"Itsukushima-Schrein auf Miyajima",wp:"Itsukushima Shrine",q:"Itsukushima Shrine, Miyajima",d:"Der Schrein mit dem berühmten roten Torii, das bei Flut im Wasser zu schweben scheint. Dazu zahme Rehe, kleine Gassen und Momiji-Manju (Ahornblatt-Kuchen).",h:"Schrein ca. 6:30–18:00 (je nach Saison)",p:"Schrein ca. 300 ¥, Fähre ca. 200 ¥, Touristensteuer ca. 100 ¥",z:"Halber bis ganzer Tag",w:"Zug bis Miyajimaguchi, Fähre ca. 10 Min.",tips:["Die Gezeiten prüfen: bei Flut schwimmt das Tor, bei Ebbe kann man hinlaufen.","Auf der Insel ist das Austern-Essen eine Spezialität.","Rehe nicht füttern."]},
{id:"hij-misen",s:"hij",c:"nature",t:"Mount Misen",wp:"Mount Misen",q:"Mount Misen Ropeway, Miyajima",d:"Mit Seilbahn und kurzem Fußweg geht es auf den Berg der Insel. Oben gibt es einen Rundblick über die Seto-Inlandsee.",h:"Seilbahn meist ca. 9:00–17:00",p:"Seilbahn ca. 1.800–2.000 ¥ hin und zurück",z:"2–3 Std.",w:"Seilbahn ab dem Momijidani-Park",tips:["Wer sportlich ist, wandert hinauf (ca. 1,5–2 Std.) und fährt hinunter."]},
{id:"hij-okonomiyaki",s:"hij",c:"food",t:"Hiroshima-Okonomiyaki",wp:"Okonomiyaki",q:"Okonomimura Hiroshima",d:"Anders als in Osaka werden die Zutaten geschichtet gebrutzelt: Teig, Kohl, Nudeln und Ei. Im Okonomimura-Gebäude gibt es viele kleine Lokale.",h:"Mittags und abends",p:"ca. 900–1.600 ¥",z:"1 Std.",w:"Okonomimura, Zentrum von Hiroshima",tips:["Am Tresen sitzen und dem Koch zuschauen.","Mit Bier oder Tee sehr beliebt."]},
{id:"hij-castle",s:"hij",c:"sight",t:"Burg Hiroshima",wp:"Hiroshima Castle",q:"Hiroshima Castle",d:"Wiederaufgebaute schwarze Burg am Rand des Zentrums, mit kleinem Museum und Park. Zur Blüte ein beliebter Hanami-Ort.",h:"Täglich ca. 9:00–17:30",p:"ca. 370 ¥",z:"1 Std.",w:"Straßenbahn bis Kamiya-cho",tips:["Kombinierbar mit dem Garten Shukkei-en."]},
{id:"hij-shukkeien",s:"hij",c:"nature",t:"Shukkei-en Garten",wp:"Shukkei-en",q:"Shukkeien Garden, Hiroshima",d:"Kleiner japanischer Landschaftsgarten mit Teich, Brücken und Teehaus. Eine ruhige Pause im Stadtzentrum.",h:"Täglich ca. 9:00–18:00",p:"ca. 260 ¥",z:"1 Std.",w:"10 Min. zu Fuß vom Hiroshima Castle",tips:["Zur Blüte hübsch, im Teehaus gibt es Matcha."]},

{id:"tyo-shimokita",s:"tyo",c:"market",t:"Shimokitazawa",wp:"Shimokitazawa",q:"Shimokitazawa, Tokyo",d:"Das Viertel für Vintage-Läden, kleine Cafés, Plattenläden und Livemusik. Entspannt und junge Szene.",h:"Läden meist ca. 11:00–20:00",p:"Eintritt frei",z:"2 Std.",w:"Odakyu/Keio Shimokitazawa, ca. 10 Min. ab Shibuya",tips:["Am Nachmittag am schönsten, abends für Livemusik."]},
{id:"tyo-ramen",s:"tyo",c:"food",t:"Ramen essen",wp:"Ramen",q:"best ramen Tokyo Ichiran Ippudo",d:"Ramen ist günstiges, sättigendes Essen in Japan. Ketten wie Ichiran oder Ippudo sind zuverlässig, kleine Läden haben oft mehr Charakter.",h:"Mittags und abends",p:"ca. 900–1.500 ¥",z:"45 Min.",w:"Überall in Tokyo",tips:["Bestellt wird oft am Automaten vor dem Eingang.","Schlürfen ist erlaubt und erwünscht."]},
{id:"kyo-sagano",s:"kyo",c:"fun",t:"Sagano Scenic Railway (Romantic Train)",wp:"Sagano Scenic Railway",q:"Sagano Scenic Railway Torokko, Kyoto",d:"Offene Bummelbahn durch die Hozu-Schlucht, im Frühling mit Kirschblüte am Fluss. Ein ruhiger Gegenpol zu den Tempeln.",h:"Meist ca. 9:00–16:00, mittwochs oft Ruhetag",p:"ca. 880 ¥",z:"25 Min. Fahrt",w:"Torokko Saga Station nahe Arashiyama",tips:["Tickets früh buchen, die Fahrt ist zur Blüte schnell ausgebucht.","Rechte Wagenseite hat die bessere Aussicht auf den Fluss."]},
{id:"kyo-daigoji",s:"kyo",c:"nature",t:"Daigo-ji (Kirschblüte)",wp:"Daigo-ji",q:"Daigo-ji, Kyoto",d:"Weitläufiger Tempel südöstlich von Kyoto, bekannt für Kirschblüten, Pagode und Gärten. Weniger Touristen als im Zentrum.",h:"Täglich ca. 9:00–17:00",p:"ca. 1.000–1.500 ¥ (zur Blüte teurer)",z:"2 Std.",w:"U-Bahn Daigo, 10 Min. zu Fuß",tips:["Gut als ruhigere Alternative zu Maruyama-Park."]},

{id:"nbh-trangan",s:"nbh",c:"trip",t:"Trang An per Boot",wp:"Tràng An Scenic Landscape Complex",q:"Trang An Scenic Landscape Complex, Ninh Binh",d:"„Ha Long Bay auf dem Land“: Ruderboote gleiten durch Kalksteinberge, niedrige Höhlen und Reisfelder. UNESCO-Welterbe und der Höhepunkt eines Ninh-Binh-Tages.",h:"Boote täglich ca. 7:00–16:00",p:"ca. 250.000 VND pro Person",z:"2,5–3 Std. Fahrt",w:"Bootsanleger ca. 8 km vom Zentrum, Fahrrad, Roller oder Taxi",tips:["Früh kommen, am Vormittag sind weniger Boote unterwegs.","Bei den Höhlen den Kopf einziehen und ein leichtes Regencape mitnehmen.","Die Ruderer freuen sich über Trinkgeld, ca. 20.000–50.000 VND."]},
{id:"nbh-mua",s:"nbh",c:"nature",t:"Mua-Höhle und Aussichtspunkt",wp:"Hang Múa",q:"Hang Mua Viewpoint, Ninh Binh",d:"Rund 500 Stufen führen auf einen Felsrücken mit Drachenstatue. Oben liegt das ganze Tal von Tam Coc mit Flussschlingen und Reisfeldern zu euren Füßen.",h:"Täglich ca. 6:00–18:00",p:"ca. 100.000 VND",z:"1,5–2 Std.",w:"ca. 7 km von Ninh Binh, mit Fahrrad oder Roller",tips:["Zum Sonnenuntergang oder früh morgens, die Mittagshitze ist heftig.","Wasser und feste Schuhe mitnehmen."]},
{id:"nbh-tamcoc",s:"nbh",c:"fun",t:"Tam Coc per Boot oder Fahrrad",wp:"Tam Cốc – Bích Động",q:"Tam Coc, Ninh Binh",d:"Auf dem Ngo-Dong-Fluss geht es durch drei Höhlen zwischen Reisfeldern. Alternativ radelt ihr durch die Dörfer, die Landschaft ist ruhig und sehr fotogen.",h:"Täglich ca. 6:30–17:00",p:"Bootsfahrt ca. 150.000 VND, Fahrradverleih ca. 30.000–50.000 VND",z:"2–3 Std.",w:"ca. 9 km von Ninh Binh",tips:["Im Februar und März sind die Reisfelder noch jung und grün.","Preise vorher klar machen, Trinkgeld üblich."]},
{id:"nbh-baidinh",s:"nbh",c:"sight",t:"Bai-Dinh-Pagode",wp:"Bái Đính Pagoda",q:"Bai Dinh Pagoda, Ninh Binh",d:"Die größte Pagodenanlage Südostasiens mit endlosen Gängen, über 500 Arhat-Statuen und einem riesigen vergoldeten Buddha. Beeindruckend in der Größe.",h:"Täglich ca. 7:00–18:00",p:"Eintritt frei, Elektrobus ca. 30.000 VND",z:"2–3 Std.",w:"ca. 15 km von Ninh Binh",tips:["Die Anlage ist sehr weitläufig, der Elektrobus spart Wege.","Schultern und Knie bedecken."]},
{id:"nbh-hoalu",s:"nbh",c:"sight",t:"Hoa Lu, die alte Hauptstadt",wp:"Hoa Lư",q:"Hoa Lu Ancient Capital, Ninh Binh",d:"Reste der ersten Hauptstadt Vietnams aus dem 10. Jahrhundert mit zwei kleinen Tempeln, eingerahmt von Kalksteinfelsen. Ruhig und wenig besucht.",h:"Täglich ca. 7:00–17:00",p:"ca. 20.000 VND",z:"1 Std.",w:"ca. 12 km von Ninh Binh, gut mit dem Fahrrad",tips:["Gut kombinierbar mit Tam Coc und Bai Dinh."]}

{id:"bkk-samphran",s:"bkk",c:"trip",t:"Wat Samphran (Drachentempel)",wp:"Wat Sam Phran",q:"Wat Samphran, Nakhon Pathom, Thailand",d:"Ein ungewöhnlicher Tempel westlich von Bangkok: ein rosafarbener, zylindrischer Turm, um den sich ein riesiger Drache windet. Im Innern führen Stockwerke mit buddhistischen Szenen nach oben. Fotogen und weit weniger besucht als die Tempel der Innenstadt. Nicht im Tagesplan, weil die Anreise einen halben Tag kostet.",h:"Täglich, ca. 8–17 Uhr (vor Ort prüfen)",p:"Eintritt meist frei, Spende üblich. Taxi/Grab ca. 400–700 THB pro Strecke",z:"3–4 Std. inklusive Anreise",w:"Ca. 40 km westlich von Bangkok, 60–90 Min. mit Grab oder Taxi, alternativ Minivan ab dem Südbusbahnhof",tips:["Nur sinnvoll, wenn in Bangkok ein halber Tag frei ist, zum Beispiel wenn ihr einen Tag länger bleibt.","Dresscode: Schultern und Knie bedeckt.","Hin- und Rückfahrt gleich mit dem Fahrer ausmachen, abends ist Grab dort schwer zu bekommen."]},
{id:"cnx-livinggreen",s:"cnx",c:"fun",t:"Living Green Elephant Sanctuary",q:"Living Green Elephant Sanctuary, Chiang Mai",d:"Ein Schutzprojekt für Elefanten bei Chiang Mai. Ihr füttert, beobachtet und lauft mit den Tieren, geritten wird nicht. Auf Google Maps hat es 4,8 Sterne bei rund 750 Bewertungen. Die Adresse in der Altstadt in eurer Liste ist vermutlich das Büro, das Camp selbst liegt außerhalb.",h:"Halbtags- oder Ganztagesprogramm, Abholung vom Hotel meist morgens",p:"Je nach Programm ca. 1.800–2.800 THB (vorab prüfen)",z:"4–8 Std.",w:"Abholung im Minivan vom Hotel, meist inklusive",tips:["Vorher prüfen, ob wirklich nicht geritten wird und keine Shows stattfinden. Aktuelle Bewertungen lesen.","Programm und Preis vorab per Nachricht klären, Plätze sind in der Hochsaison schnell weg.","Alte Kleidung und feste Schuhe anziehen, es wird schmutzig und nass."]},
{id:"cnx-artvillage",s:"cnx",c:"market",t:"Art Village (Baan Kang Wat)",q:"Baan Kang Wat, Chiang Mai",d:"Ein kleines Künstlerdorf am Fuß des Doi Suthep mit Ateliers, Keramik, Cafés und einem kleinen Markt. Entspannter und ruhiger als die Märkte in der Altstadt. Auf Google Maps als „Art Village“ gelistet.",h:"Ateliers meist Di–So ca. 10–18 Uhr, Sonntagsmarkt vormittags (Angaben schwanken, vor Ort prüfen)",p:"Eintritt frei, Kunsthandwerk ab ca. 100 THB",z:"1,5–2 Std.",w:"Ca. 10 Min. mit Grab oder Songthaew von Nimmanhaemin",tips:["Am Sonntag am besten vormittags kommen.","Montags sind viele Ateliers geschlossen.","Bargeld in kleinen Scheinen für die Stände mitnehmen."]},
{id:"cnx-wlkwin",s:"cnx",c:"sight",t:"Wat Luang Khun Win (Mae Wang)",q:"Wat Luang Khun Win, Mae Wang, Chiang Mai",d:"Ein Tempel im Hinterland von Chiang Mai im Distrikt Mae Wang, auf Google Maps mit 4,8 Sternen bei rund 900 Bewertungen. Weit weniger besucht als die Tempel der Altstadt. Genaue Beschreibung konnte ich nicht verlässlich prüfen. Die Lage passt gut als erster Halt auf dem Weg zum Doi Inthanon.",h:"Meist tagsüber geöffnet (vor Ort prüfen)",p:"Eintritt in der Regel frei, Spende üblich",z:"1 Std.",w:"Ca. 45–60 Min. südwestlich von Chiang Mai, nur mit Fahrer, Mietwagen oder Roller sinnvoll",tips:["Am besten mit dem Tag Doi Inthanon kombinieren, es liegt in derselben Richtung.","Tempel-Dresscode: Schultern und Knie bedeckt.","Fahrer für den ganzen Tag mieten, ca. 2.000–3.000 THB pro Auto."]},
{id:"cnx-phadoksieo",s:"cnx",c:"nature",t:"Pha Dok Sieo Nature Trail",q:"Pha Dok Sieo Nature Trail, Chom Thong, Chiang Mai",d:"Ein kurzer Naturlehrpfad im Gebiet des Doi-Inthanon-Nationalparks mit Wald, Felsen und Ausblicken. Bewertung 4,6 bei ca. 550 Rezensionen. Eine gute Ergänzung zum Doi Inthanon, wenn ihr ohnehin einen Fahrer habt.",h:"Tagsüber, Nationalpark ab ca. 6 Uhr",p:"Nationalparkeintritt ca. 300 THB, zusätzlich Auto ca. 30 THB",z:"1–1,5 Std.",w:"Ca. 1,5 Std. von Chiang Mai, im Doi-Inthanon-Gebiet westlich von Chom Thong",tips:["Feste Schuhe, nach Regen kann der Pfad rutschig sein.","Früh starten, dann ist es noch kühl und klar.","Warme Jacke einpacken: Auf dem Doi Inthanon wird es merklich kühler."]},
{id:"krb-monkeytrail",s:"krb",c:"nature",t:"Monkey Trail bei Ao Nang",q:"Monkey Trail, Ao Nang, Krabi",d:"Ein kurzer Dschungelpfad bei Ao Nang, auf dem Makaken leben. Kein langer Trek, eher ein Spaziergang mit Tieren. Bewertung 4,1 bei rund 3.500 Rezensionen.",h:"Tagsüber",p:"Eintritt frei",z:"1–1,5 Std.",w:"Ab Ao Nang zu Fuß oder kurze Fahrt mit dem Songthaew",tips:["Keine Snacks sichtbar tragen und die Affen nicht füttern, sie klauen Taschen und können beißen.","Feste Schuhe, nach Regen rutschig.","Am frühen Morgen ist es kühler und ruhiger."]},
{id:"khs-lake",s:"khs",c:"nature",t:"Cheow-Lan-See: Bootstour im Khao-Sok-Nationalpark",wp:"Khao Sok National Park",q:"Cheow Lan Lake, Khao Sok National Park",d:"Der Stausee im Khao-Sok-Nationalpark liegt zwischen steilen Kalkfelsen im Regenwald. Mit dem Longtail-Boot geht es durch die Felsenwelt, dazu Wanderung zu Höhlen und Schwimmen im See. Khao Sok hat auf Google Maps 4,7 Sterne bei ca. 9.000 Bewertungen und gilt als einer der schönsten Nationalparks Thailands.",h:"Tagestouren meist 8–17 Uhr, Übernachtung auf schwimmenden Hütten möglich",p:"Parkeintritt ca. 300 THB, Tagestour ca. 1.800–2.500 THB, Übernachtung auf dem See ca. 2.500–4.000 THB mit Essen",z:"Ganzer Tag",w:"Ca. 3 Std. von Ao Nang oder Krabi, 1,5–2 Std. von Surat Thani, meist per Minivan",tips:["Wegen des Plans nur ein Tag am See, eine Übernachtung auf dem See würde einen weiteren Tag kosten.","Badesachen, Insektenschutz und eine wasserfeste Tasche mitnehmen.","In der Trockenzeit (Februar bis April) ist der Wasserstand niedriger, aber das Wetter besser."]},
{id:"khs-jungle",s:"khs",c:"nature",t:"Dschungelwanderung und Wasserfall im Khao Sok",wp:"Khao Sok National Park",q:"Khao Sok National Park, Surat Thani",d:"Kurze Wanderungen im Regenwald des Khao-Sok-Nationalparks mit Wasserfällen, Flüssen und Affen. Ein Guide lohnt sich, er zeigt Tiere, Pflanzen und versteckte Spots.",h:"Tagsüber, meist 2–4 Std.",p:"Parkeintritt ca. 300 THB, Guide ca. 600–1.200 THB",z:"2–4 Std.",w:"Direkt am Parkeingang, Resorts organisieren Touren",tips:["Feste Schuhe oder Wassersandalen, lange Hose gegen Mücken und Blutegel.","Vor dem Regen am Nachmittag zurück sein.","Am Abend gibt es oft Nachtwanderungen, vorher fragen."]},
{id:"khs-kotao",s:"khs",c:"nature",t:"Ko Tao (Idee, nicht im Plan)",wp:"Ko Tao",q:"Ko Tao, Surat Thani",d:"Kleine Insel im Golf von Thailand, bekannt für Tauchen und Schnorcheln. Liegt auf der anderen Seite der Halbinsel. Von Khao Sok aus bräuchtet ihr ca. 5–6 Std. bis zur Fähre und noch einmal 1,5–3 Std. Überfahrt, dazu den Rückweg. Das kostet zwei volle Reisetage und passt nicht in den Plan.",h:"Fähren ab Chumphon, Surat Thani oder Koh Samui",p:"Fähre ca. 600–1.000 THB, Tauchkurs ca. 10.000 THB",z:"mind. 2–3 Tage",w:"Von Khao Sok ca. 5–6 Std. bis zum Fährhafen, dann 1,5–3 Std. Überfahrt",tips:["Nur sinnvoll, wenn Phi Phi oder Khao Sok wegfallen.","Als Alternative reicht Schnorcheln an den Hong Islands oder auf Phi Phi.","Wer taucht, plant besser 3 Tage ein."]},

/* ---------- VIETNAM ---------- */
{id:"han-sapa",s:"han",c:"trip",t:"Sa Pa (Idee, nicht im Plan)",wp:"Sa Pa",q:"Sa Pa, Lao Cai, Vietnam",d:"Bergstadt im Nordwesten mit Reisterrassen und Dörfern der Bergvölker. Von Hanoi per Bus oder Nachtzug ca. 5–6 Std. Weil ihr den Ha-Giang-Loop als Berg-Abenteuer macht, würde Sa Pa dasselbe Thema doppeln. Nur eine Option, wenn der Loop wegfällt.",h:"Ganzjährig",p:"Nachtzug ca. 600.000–1.000.000 VND, Trekking mit Guide ca. 400.000–900.000 VND",z:"mind. 2 Tage",w:"Nachtzug oder Limousinen-Bus ab Hanoi, ca. 5–6 Std.",tips:["Im März oft Nebel und Nieselregen, die Terrassen sind noch nicht grün.","Ein Entweder-oder: Ha-Giang-Loop oder Sa Pa, beides würde zu viel Zeit kosten.","Warme Kleidung mitnehmen."]},
{id:"han-glassbridge",s:"han",c:"trip",t:"Bạch Long Glass Bridge (Idee, nicht im Plan)",q:"Bach Long Glass Bridge, Moc Chau, Son La",d:"Eine der längsten Glasbrücken der Welt mit rund 630 m, bei Mộc Châu im Nordwesten. Beeindruckend, aber weit weg: ca. 4 Std. Fahrt ab Hanoi in eine Richtung. Als Tagesausflug würde das rund 9 Std. im Auto bedeuten.",h:"Täglich ca. 7–17 Uhr (vor Ort prüfen)",p:"Eintritt ca. 300.000–500.000 VND (vor Ort prüfen)",z:"1–2 Std. plus Anreise",w:"Ca. 4 Std. ab Hanoi per Auto oder Bus",tips:["Nur mit Übernachtung in Mộc Châu oder Mai Châu sinnvoll, nicht als Tagesausflug.","Bei Nebel oder Regen ist die Aussicht schlecht.","Wer Höhenangst hat, lässt es besser weg."]},
{id:"hag-loop",s:"hag",c:"trip",t:"Ha-Giang-Loop (3 Tage Motorrad-Tour)",wp:"Hà Giang province",q:"Ha Giang Loop, Vietnam",d:"Die berühmteste Bergstrecke Vietnams: ca. 350 km durch Kalkgebirge, Pässe und Dörfer an der Grenze zu China. Ihr fahrt als Beifahrer mit einem Easy Rider, übernachtet in Homestays und esst mit den Familien. Auf Google Maps ist die Tour mit 4,9 Sternen bewertet. Der Pin in eurer Liste liegt in Hanoi, dort ist vermutlich der Anbieter.",h:"3 Tage, Start meist morgens in Ha Giang",p:"Easy-Rider-Tour ca. 3.500.000–6.000.000 VND pro Person, Bus Hanoi–Ha Giang ca. 250.000–400.000 VND",z:"3 Tage plus Hin- und Rückfahrt (ca. 6 Std. je Strecke)",w:"Limousinen-Bus ab Hanoi nach Ha Giang, ca. 6 Std.",tips:["Fahrt als Beifahrer. Selbst zu fahren ist riskant, es gibt viele Unfälle.","Klärt vor der Buchung, ob eure Reiseversicherung Motorrad-Mitfahrer abdeckt. Viele Policen schließen das aus.","Warme Kleidung, Regenjacke und Handschuhe für die kühlen Berge einpacken, Helme stellt meist der Anbieter.","Rucksack klein halten, großes Gepäck bleibt im Hotel in Hanoi.","Seit Juni 2026 wird für Ausländer in den Grenzgebieten ein Permit von ca. 10 USD verlangt (Quellen weichen ab). Der Anbieter regelt das meist. Nach einem tödlichen Unfall im April 2026 gelten strengere Regeln für Anbieter, deshalb nur seriöse Veranstalter mit Versicherung und Helmen wählen."]},
{id:"hag-mapileng",s:"hag",c:"nature",t:"Mã Pí Lèng Pass",wp:"Mã Pí Lèng Pass",q:"Ma Pi Leng Pass, Ha Giang",d:"Der spektakulärste Abschnitt des Ha-Giang-Loops: eine Passstraße hoch über der Schlucht des Nho-Que-Flusses. Blick auf tiefgrüne Schluchten und endlose Bergketten. Meist am zweiten Tag der Tour.",h:"Ganzjährig, am besten bei klarer Sicht am Vormittag",p:"Im Tourpreis enthalten",z:"1–2 Std. mit Stopps",w:"Teil der Loop-Tour, zwischen Dong Van und Meo Vac",tips:["Am frühen Vormittag ist die Sicht oft klarer als am Nachmittag.","Nach Regen kann die Straße rutschig sein.","Für Fotos einen der Aussichtspunkte nutzen, nicht auf der Straße anhalten."]},
{id:"hoi-duckstop",s:"hoi",c:"fun",t:"Duck Stop: Entenfarm in Hoi An",q:"Duck Stop Hoi An, Hoi An Dong, Da Nang",d:"Eine kleine Ökofarm mit hunderten Enten bei Hoi An. Ihr füttert die Tiere, lauft als „Duck Leader“ mit der Herde und bekommt die berühmte Enten-Fußmassage. Beliebt bei Familien und Paaren, Bewertung 5,0. Liegt nahe am Cam-Thanh-Kokosnusswald.",h:"Täglich, meist 8–17 Uhr (vor Ort prüfen)",p:"Ab ca. 350.000 VND pro Person, Kaffee-Kurs zusätzlich",z:"1–2 Std.",w:"Ca. 10 Min. mit dem Fahrrad oder Taxi von der Altstadt, in An My (Hoi An Dong)",tips:["Gut mit dem Kokosnusswald (Korbboot) kombinierbar, beides liegt nah beieinander.","Es gibt mehrere „Duck Stop“-Orte in Vietnam, in Hoi An auf die richtige Adresse achten.","Feste Schuhe oder Sandalen, die nass werden dürfen."]},
{id:"hoi-captainchris",s:"hoi",c:"trip",t:"Bootstour mit Captain Chris",q:"Captain Chris, Bach Dang, Hoi An",d:"Bootstouren auf dem Fluss in Hoi An, Treffpunkt an der Bạch-Đằng-Straße in der Altstadt. Auf Google Maps 5,0 bei 122 Bewertungen. Programm und Preise konnte ich nicht verlässlich recherchieren, bitte auf der Google-Maps-Seite oder vor Ort erfragen.",h:"Meist am späten Nachmittag und Abend (vor Ort prüfen)",p:"Fluss-Bootstouren in Hoi An meist ca. 150.000–400.000 VND",z:"1–2 Std.",w:"Anlegestelle an der Bạch Đằng, Altstadt",tips:["Abends fahren, wenn die Laternen leuchten.","Preis und Dauer vor der Abfahrt klären.","Zum Sonnenuntergang kommen, dann ist das Licht am schönsten."]},

/* ---------- JAPAN ---------- */
{id:"tyo-goldengai",s:"tyo",c:"night",t:"Shinjuku Golden-Gai (kleine Bars)",wp:"Shinjuku Golden Gai",q:"Shinjuku Golden Gai, Tokyo",d:"Sechs schmale Gassen in Shinjuku mit rund 200 winzigen Bars, die meisten mit nur fünf bis zehn Plätzen. Jede hat ihr eigenes Thema, von Jazz über Film bis Punk. Am besten ab etwa 20 Uhr, wie in eurer Liste vermerkt.",h:"Meist ab ca. 19–20 Uhr bis spät in die Nacht",p:"Sitzgebühr meist 500–1.500 JPY, Getränke ab ca. 700 JPY",z:"1,5–2 Std.",w:"JR Shinjuku, 5–10 Min. zu Fuß zum Kabukicho",tips:["Auf Schilder achten: Manche Bars nehmen nur Stammgäste, das ist normal und nicht persönlich gemeint.","Fragt nach der Sitzgebühr, bevor ihr bestellt.","Fotos nur mit Erlaubnis, Gassen sind eng und privat."]},
{id:"tyo-chopsticks",s:"tyo",c:"fun",t:"Chopsticks Studio Shinjuku",q:"Chopsticks Studio Shinjuku, Kabukicho, Tokyo",d:"Ein Workshop, in dem ihr eure eigenen Essstäbchen aus Holz schleift und gestaltet. Ein persönliches Souvenir, das ihr mitnehmt. Bewertung 5,0 bei rund 2.000 Rezensionen. Liegt direkt in Kabukicho und passt gut zum Abend mit dem Golden-Gai.",h:"Nach Reservierung, meist tagsüber in festen Zeitfenstern",p:"Je nach Kursdauer ca. 1.000–4.500 JPY (vorab online buchen)",z:"30–90 Min.",w:"JR Shinjuku, ca. 10 Min. zu Fuß nach Kabukicho",tips:["Vorab buchen, die Zeitfenster sind begrenzt.","Mit dem Studio abklären, ob Fertigstellung und Gravur am selben Tag möglich sind.","Perfekt als Geschenk für Freunde zu Hause."]},
{id:"tyo-gotokuji",s:"tyo",c:"sight",t:"Gōtoku-ji (Glückskatzen-Tempel)",wp:"Gōtoku-ji",q:"Gotoku-ji Temple, Setagaya, Tokyo",d:"Der Tempel gilt als Ursprung der Maneki-neko, der winkenden Glückskatze. Hunderte kleine weiße Katzen stehen auf Gestellen, in die Besucher sie mit einem Wunsch stellen. Ruhiger Tempel im Wohnviertel, in eurer Liste als „wichtig“ markiert.",h:"Täglich ca. 6–17 Uhr (vor Ort prüfen)",p:"Eintritt frei, Maneki-neko ab ca. 500 JPY",z:"1–1,5 Std.",w:"Odakyu-Linie bis Gotokuji oder Setagaya-Linie bis Miyanosaka, jeweils ca. 5–10 Min. zu Fuß",tips:["Kleine Katze kaufen, Wunsch dazuschreiben und im Tempel abstellen.","Gut mit einem Spaziergang in Setagaya kombinierbar.","Früh am Tag ist es sehr ruhig."]},
{id:"tyo-nact",s:"tyo",c:"sight",t:"The National Art Center, Tokyo",wp:"The National Art Center, Tokyo",q:"The National Art Center Tokyo, Roppongi",d:"Ein großes Ausstellungshaus in Roppongi mit auffälliger Glasfassade nach Entwurf von Kisho Kurokawa. Es hat keine Dauerausstellung, sondern wechselnde Sonderausstellungen. Auch das Gebäude mit Café im Trichter lohnt den Besuch.",h:"Meist 10–18 Uhr, dienstags geschlossen (vor Ort prüfen)",p:"Je nach Ausstellung ca. 1.000–2.500 JPY",z:"1,5–2 Std.",w:"Metro Nogizaka oder Roppongi, wenige Minuten zu Fuß",tips:["Dienstags geschlossen, deshalb im Plan auf den Donnerstag gelegt.","Aktuelles Programm vorab auf der Webseite ansehen.","Das Gebäude lässt sich auch ohne Ausstellungsticket besichtigen."]},
{id:"tyo-asakusashrine",s:"tyo",c:"sight",t:"Asakusa-Schrein",wp:"Asakusa Shrine",q:"Asakusa Shrine, Taito, Tokyo",d:"Ein kleiner Shintō-Schrein direkt neben dem Senso-ji. Er stammt aus der Edo-Zeit und hat den Zweiten Weltkrieg überstanden. Ruhiger als der Haupttempel nebenan.",h:"Täglich, meist 9–16:30 Uhr",p:"Eintritt frei",z:"20–30 Min.",w:"Direkt neben dem Senso-ji, Metro Asakusa",tips:["Gleich nach dem Senso-ji besuchen, es liegt auf demselben Gelände.","Wie bei jedem Schrein: vor dem Gebet an der Quelle die Hände waschen, kurz verbeugen, dann beten.","Im Mai findet hier das Sanja-Matsuri statt, im März ist es ruhig."]},
{id:"osa-redblue",s:"osa",c:"night",t:"Red&Blue Street (Promenade am Dojima-Fluss)",q:"Red&Blue St., Fukushima, Osaka",d:"Ein Spitzname für die Uferpromenade Fukushima Hama Greenway am Dojima-Fluss. Geländer, Laternen und Poller sind in einem Verlauf von Rot nach Blau gestrichen und abends beleuchtet. Ruhiger Spaziergang abseits der Touristenströme, nahe dem Viertel Fukushima mit vielen kleinen Lokalen.",h:"Durchgehend zugänglich, abends beleuchtet",p:"Eintritt frei",z:"30–60 Min.",w:"JR Fukushima oder Hanshin Fukushima, ca. 5–10 Min. zu Fuß",tips:["Am besten abends bei Beleuchtung.","Mit einem Abendessen im Viertel Fukushima verbinden.","Zur Kirschblüte können die Bäume am Ufer blühen, prüft die Blütenkarte."]},
{id:"osa-okuyama",s:"osa",c:"nature",t:"Okuyama Ameyama Nature Park (Idee, nicht im Plan)",q:"Okuyama Ameyama Nature Park, Kumatori, Osaka",d:"Ein Naturpark bei Kumatori südlich von Osaka rund um den Eiraku-Staudamm mit einem Kirschblütenpfad. Schön, aber weit draußen: Zug nach Kumatori, dann Bus und ca. 30 Min. Fußweg. Dazu keine Angaben zur Blütezeit gefunden.",h:"Ganzjährig zugänglich, Eintritt frei",p:"Eintritt frei, Zug und Bus ca. 1.000–1.500 JPY",z:"Halbtagesausflug",w:"JR Hanwa-Linie bis Kumatori, Nankai-Bus bis Osaka Taiiku Daigaku-mae, ca. 30 Min. zu Fuß",tips:["Nur sinnvoll, wenn die Blüte in Osaka schon vorbei ist.","Mit der Blütenprognose abgleichen, bevor ihr hinfahrt.","Alternativ ist Burg Osaka mit der Blüte näher und ähnlich schön."]},
{id:"kyo-rainbowline",s:"kyo",c:"nature",t:"Rainbow Line Summit Park, Fukui (Idee, nicht im Plan)",q:"Rainbow Line Summit Park, Mihama, Fukui",d:"Aussichtspark mit „Himmelsterrassen“ über den fünf Seen von Mikata. Sehr schön, aber ohne Auto nur umständlich zu erreichen: Shinkansen oder Zug nach Tsuruga, weiter nach Mihama, dann Taxi. Gesamt rund 2,5–3 Std. pro Richtung.",h:"März–November ca. 9–17 Uhr, im Winter bis 16:30",p:"Eintritt ca. 1.000 JPY inklusive Lift und Seilbahn",z:"Tagesausflug",w:"Zug bis JR Mihama, Taxi ca. 10–15 Min.",tips:["Straße nicht zu Fuß oder mit dem Fahrrad zugänglich, Taxi vorab buchen.","Nur sinnvoll mit einem zusätzlichen freien Tag.","Alternative in der Nähe von Kyoto: Biwa-See oder Arashiyama."]},
{id:"kyo-gulliver",s:"kyo",c:"nature",t:"Gulliver's Garden, Shiga (Idee, nicht im Plan)",q:"ガリバーズ・ガーデン, Takashima, Shiga",d:"Ein Ort in Takashima am Biwa-See, der in eurer Liste als „Gulliver’s Garden“ steht. Ich konnte zu diesem Namen keine verlässlichen Informationen finden, ähnlich klingt das „Gulliver Youth Travel Village“, das saisonal geöffnet ist. Takashima ist von Kyoto aus per JR Kosei-Linie in ca. 40 Min. erreichbar, dann kommt ein Bus oder Taxi.",h:"unklar, vor Ort prüfen",p:"unklar",z:"Halbtagesausflug",w:"JR Kosei-Linie ab Kyoto bis Omi-Takashima, dann Bus oder Taxi",tips:["Vorher auf der Google-Maps-Seite Öffnungszeiten und Saison prüfen.","Nur sinnvoll, wenn ihr mehr über den Ort wisst.","Mit einem Besuch am Biwa-See verbinden."]},

/* ---------- SÜDKOREA ---------- */
{id:"sel-hanriverferry",s:"sel",c:"trip",t:"Fährfahrt auf dem Han-Fluss (ab Yeouido)",q:"Ashley boat terminal 2, Yeouido, Seoul",d:"Fähren und Ausflugsschiffe ab dem Anleger bei Yeouido fahren am Han-Fluss entlang, vorbei an Brücken und Skyline. Abends mit Beleuchtung am schönsten. Der Anleger „Ashley boat terminal 2“ aus eurer Liste muss nicht genau der richtige sein, dort fahren viele Schiffe, sagt eure Notiz.",h:"Mehrere Abfahrten täglich, abends und bei Sonnenuntergang beliebt",p:"Fahrten ca. 12.000–25.000 KRW je nach Schiff und Dauer",z:"40–90 Min.",w:"Metro Yeouinaru oder Yeouido, kurzer Fußweg zum Anleger",tips:["Abfahrtszeiten und Anleger vorher online prüfen.","Bei Wind kann es kühl sein, eine Jacke mitnehmen.","Mit Kirschblüte in Yeouido am selben Tag kombinieren."]}

{id:"bkk-cooking",s:"bkk",c:"fun",t:"Thai-Kochkurs mit Marktbesuch",q:"Thai cooking class Bangkok",d:"Halbtags-Kochkurs: erst Markt mit Kräutern und Gewürzen, dann kocht ihr vier bis fünf Gerichte selbst, zum Beispiel Tom Yum, Curry, Pad Thai und ein Dessert. Das Essen esst ihr danach. Eine der beliebtesten Aktivitäten bei Reisenden.",h:"Meist Vormittag oder Nachmittag, 3–4 Std.",p:"ca. 1.200–1.800 THB pro Person",z:"3–4 Std.",w:"Abholung vom Hotel oder Treffpunkt an einer Skytrain-Station",tips:["Schulen mit kleinen Gruppen und guten aktuellen Bewertungen wählen.","Vegetarische Variante vorher ankündigen.","Am Anfang der Reise machen, dann kocht ihr zu Hause nach."]},
{id:"bkk-muaythaiclass",s:"bkk",c:"fun",t:"Muay-Thai-Probetraining",q:"Muay Thai gym trial class Bangkok",d:"Ein bis zwei Stunden Pratzen, Tritte und Kondition im Gym, geführt von einem Trainer. Anfänger sind willkommen, es wird nicht gekämpft. Gut, um das Nationalsport-Erlebnis selbst zu spüren und nicht nur zuzuschauen.",h:"Meist Vormittags und am späten Nachmittag",p:"ca. 500–1.000 THB für eine Stunde Probetraining",z:"1,5–2 Std.",w:"Gyms liegen in vielen Stadtvierteln, meist mit Grab oder Skytrain erreichbar",tips:["Bequeme Sportkleidung mitnehmen, Handtuch und Wasser gibt es oft vor Ort.","Vorher klären, ob Gebühr für Handschuhe und Bandagen anfällt.","Nicht am selben Tag wie lange Fahrten legen, ihr werdet müde sein."]},
{id:"cnx-climbing",s:"cnx",c:"fun",t:"Klettern am Crazy Horse Buttress",q:"Crazy Horse Buttress climbing Chiang Mai",d:"Klettern am Fels in der Nähe von Chiang Mai, geeignet für Anfänger mit Guide und Fortgeschrittene. Die Saison ist von November bis April am besten, also genau in eurem Zeitraum. Halbtags-Touren mit Material und Transport.",h:"Meist Vormittag, Abholung in der Stadt",p:"ca. 1.800–2.500 THB für eine Halbtagestour",z:"4–6 Std. inklusive Anfahrt",w:"Ca. 45–60 Min. von Chiang Mai, mit dem Anbieter-Bus",tips:["Anbieter mit zertifizierten Guides und Sicherungsmaterial prüfen.","Sonnenschutz, Wasser und feste Schuhe mitnehmen.","Wer Klettern in Railay plant, kann hier schon üben."]},
{id:"pai-walking",s:"pai",c:"night",t:"Pai Walking Street",q:"Pai Walking Street",d:"Jeden Abend füllt sich die Hauptstraße von Pai mit Streetfood, Kunsthandwerk und Livemusik. Entspannter und kleiner als die Märkte in Bangkok oder Chiang Mai, typisch für die Backpacker-Stimmung der Stadt.",h:"Täglich ab ca. 17–18 Uhr bis spät",p:"Eintritt frei, Gerichte ab ca. 30–80 THB",z:"1,5–2 Std.",w:"Zu Fuß vom Zentrum",tips:["Bargeld in kleinen Scheinen mitnehmen.","Nach Sonnenuntergang wird es kühl, eine Jacke einpacken.","Die vielen Stände mit gegrilltem Essen und Süßem lohnen den Umweg über die Seitengassen."]},
{id:"pai-canyon",s:"pai",c:"nature",t:"Pai Canyon zum Sonnenuntergang",q:"Pai Canyon",d:"Schmale Grate zwischen tiefen Schluchten aus rotem Lehm, mit Blick über das Tal. Zum Sonnenuntergang ein beliebter Spot. Die Wege sind schmal und ohne Geländer.",h:"Ganztägig zugänglich, am schönsten am späten Nachmittag",p:"Eintritt frei oder kleine Spende",z:"1–1,5 Std.",w:"Ca. 8 km südlich von Pai, mit Roller, Taxi oder Songthaew",tips:["Feste Schuhe und nicht bei Regen gehen.","Auf den schmalen Graten Abstand halten und nicht drängeln.","Vor Sonnenuntergang kommen, es wird sonst voll."]},
{id:"pai-waterfall",s:"pai",c:"nature",t:"Mo-Paeng-Wasserfall",q:"Mo Paeng Waterfall Pai",d:"Wasserfall mit natürlichen Rutschen in der Nähe von Pai. Im März führt er weniger Wasser als in der Regenzeit, zum Baden reicht es meist trotzdem.",h:"Tagsüber",p:"Eintritt frei, ggf. kleine Gebühr für Parken",z:"1–2 Std.",w:"Ca. 8 km von Pai, mit Roller oder Taxi",tips:["Badesachen und Wassersandalen mitnehmen.","Bei wenig Wasser ist das Rutschen weniger spaßig, vorher fragen.","Mit Pai Canyon an einem Tag kombinieren."]},
{id:"pai-hotsprings",s:"pai",c:"nature",t:"Heiße Quellen bei Pai",q:"Tha Pai Hot Springs",d:"Natürliche heiße Quellen in einem Park, in denen ihr in kleinen Becken baden könnt. Gut am Morgen, wenn die Luft noch frisch ist, oder nach einem Tag auf dem Roller.",h:"Meist 7–18 Uhr",p:"Eintritt ca. 100–300 THB (vor Ort prüfen)",z:"1–2 Std.",w:"Ca. 7 km von Pai, mit Roller, Taxi oder Songthaew",tips:["Nicht zu heiß einsteigen, die Becken haben unterschiedliche Temperatur.","Handtuch und Badesachen mitnehmen.","Wertsachen im Hotel lassen."]},
{id:"pai-bamboo",s:"pai",c:"sight",t:"Bambusbrücke Boon Ko Ku So",q:"Boon Ko Ku So bamboo bridge Pai",d:"Eine lange Fußgängerbrücke aus Bambus über Reisfelder, im Sonnenaufgang oder bei Dämmerung ein beliebter Fotospot. Im März sind die Felder oft braun.",h:"Tagsüber",p:"Eintritt ca. 20–50 THB",z:"30–60 Min.",w:"Ca. 5–8 km von Pai, mit Roller oder Taxi",tips:["Früh am Morgen kommen, dann ist es leer.","Im März sind die Felder eher trocken, ein anderes Bild als in der Regenzeit.","Nach Regen kann der Weg rutschig sein."]},
{id:"krb-dws",s:"krb",c:"fun",t:"Deep-Water-Solo (Klettern über dem Meer)",q:"Deep water solo Railay Krabi",d:"Klettern am Kalkfelsen ohne Seil, über dem Wasser: Fallt ihr, landet ihr im Meer. Mit Guide, Booten und Einweisung auch für Anfänger. Ein Highlight für alle, die in Railay klettern.",h:"Halbtags oder ganztags, meist Vormittag",p:"ca. 1.800–2.500 THB für einen halben Tag",z:"4–6 Std.",w:"Abholung am Strand von Ao Nang oder Railay mit dem Boot",tips:["Nur mit seriösen Anbietern, die Einweisung und Rettungsmaterial haben.","Badesachen und eine Bandage für die Hände sind hilfreich.","Wer Höhenangst hat, kann niedrigere Routen wählen."]},
{id:"lan-dive",s:"lan",c:"fun",t:"Tauchtag Koh Lanta (Hin Daeng und Hin Muang)",q:"diving Koh Lanta Hin Daeng Hin Muang",d:"Koh Lanta ist Ausgangspunkt für Tauchplätze wie Hin Daeng und Hin Muang. Mit einem Tauchtag oder Schnuppertauchen erlebt ihr Riffe mit Fischschwärmen. Mit Tauchschein möglich, sonst ein Schnupper-Dive mit Guide.",h:"Ganztags, Abfahrt früh am Morgen",p:"Fun-Dive mit zwei Tauchgängen ab ca. 3.500–4.500 THB, Schnuppertauchen ähnlich",z:"Ganzer Tag",w:"Abholung vom Hotel, Boot ab Saladan",tips:["Tauchschein-Anfänger nehmen das Schnuppertauchen, nicht den Hin-Daeng-Tag.","Nach dem Tauchen 18–24 Stunden nicht fliegen, deshalb nicht am Abreisetag.","Versicherung mit Tauchschutz prüfen."]},
/* ---------- JAPAN ---------- */
{id:"tyo-sushi",s:"tyo",c:"fun",t:"Sushi selber machen (Kochkurs)",q:"sushi making class Tokyo",d:"Ihr lernt Reis, Nigiri und Rollen herzustellen und esst die Ergebnisse danach. Kurse dauern etwa zwei Stunden, oft mit Fischkunde und Tipps zum Messer. Ein Highlight für alle, die Sushi lieben.",h:"Meist Vormittag oder Nachmittag, 2–2,5 Std.",p:"ca. 6.000–10.000 JPY pro Person",z:"2–2,5 Std.",w:"Meist in Asakusa, Shinjuku oder Tsukiji, über Anbieter-Seiten buchbar",tips:["Wenige Wochen vorher buchen, beliebte Zeitfenster sind schnell weg.","Allergien und vegetarische Wünsche vorher melden.","Im Kurs oft mit auf Englisch, die Gruppe ist klein."]},
{id:"tyo-ramenclass",s:"tyo",c:"fun",t:"Ramen selber machen (Kochkurs)",q:"ramen making class Tokyo Asakusa",d:"Nudeln, Brühe und Toppings selbst zubereiten. Danach isst du deine eigene Schüssel Ramen. Eine lockere Alternative zum Sushi-Kurs.",h:"Meist Nachmittag, ca. 2 Std.",p:"ca. 5.000–8.000 JPY pro Person",z:"2 Std.",w:"Meist in Asakusa oder Shinjuku",tips:["Vorher buchen.","Vegetarische Brühe gibt es bei manchen Anbietern.","Passt gut als Alternative zum Sushi-Kurs."]},
{id:"tyo-bouldering",s:"tyo",c:"fun",t:"Bouldern in einer Kletterhalle",q:"bouldering gym Tokyo",d:"Tokyo hat viele Boulderhallen, die Preise sind fair und das Niveau hoch. Gut für einen Regentag oder den Abend. Kletterschuhe lassen sich leihen.",h:"Meist 10–22 Uhr",p:"Tageskarte ca. 1.500–2.500 JPY, Schuhmiete ca. 300–500 JPY",z:"1,5–3 Std.",w:"Viele Hallen nahe der U-Bahn, z. B. in Shinjuku, Shibuya oder Akihabara",tips:["Eine Halle mit englischer Beschreibung und Anfängerrouten wählen.","Magnesium ist meist erlaubt, Handtuch mitnehmen.","Mit eigenen Schuhen aus Railay vergleichen, ihr könnt sonst leihen."]},
{id:"tyo-surf",s:"tyo",c:"fun",t:"Surfstunde in Shonan (Kamakura)",q:"surf lesson Kamakura Shonan",d:"Die Küste von Shonan ist Tokyos Surfspot, etwa eine Stunde mit dem Zug. Im März hat das Wasser nur 14–15 °C, mit dickem Neoprenanzug sind Anfängerstunden trotzdem möglich. Wellen sind klein bis mittel, es kann windig sein.",h:"Meist Vormittag, 2–3 Std.",p:"ca. 6.000–9.000 JPY mit Brett und Neoprenanzug",z:"Halber Tag mit Anreise",w:"Zug von Tokyo nach Kamakura oder Zushi, ca. 1–1,5 Std.",tips:["Anbieter mit englischsprachigem Lehrer und Anfängerkursen vorab buchen.","Dicken Neoprenanzug (5/4 mm) und Haube nehmen, das Wasser ist kalt.","Mit einem Besuch in Kamakura (Großer Buddha) und Enoshima verbinden."]},
{id:"tyo-fuji",s:"tyo",c:"trip",t:"Mount Fuji und Kawaguchiko (Idee)",q:"Chureito Pagoda Kawaguchiko Mount Fuji",d:"Tagesausflug zum Fünf-Seen-Gebiet mit Blick auf den Fuji, etwa zwei Stunden Busfahrt von Tokyo. Wer klare Sicht erwischt, hat eines der berühmtesten Motive Japans. Im März liegt noch Schnee auf dem Berg.",h:"Ganzer Tag, Bus ab Shinjuku",p:"Bus ca. 2.000–4.000 JPY pro Strecke",z:"Ganzer Tag",w:"Direktbus ab Shinjuku nach Kawaguchiko, ca. 2 Std.",tips:["Bei schlechter Sicht verschieben, die Wetter-App prüfen.","Alternative zu Hakone, nicht beides am selben Tag.","Früh aufbrechen, die Rückfahrt kann voll sein."]},
{id:"tyo-karaoke",s:"tyo",c:"night",t:"Karaoke mit Freunden",q:"karaoke Shibuya",d:"Japanisches Karaoke gibt es in privaten Räumen, ihr singt unter euch. Mit Getränkeflatrate ein günstiger und lustiger Abend. Viele Ketten haben englische Songlisten.",h:"Meist bis spät in die Nacht",p:"ca. 500–1.500 JPY pro Person und Stunde, Getränke extra oder inklusive",z:"1–2 Std.",w:"Überall in Shibuya, Shinjuku und Ikebukuro",tips:["Free-Time-Tarif mit Getränken ist meist günstiger.","Nach 22 Uhr steigen die Preise.","Am Wochenende vorher reservieren."]},
{id:"kyo-cooking",s:"kyo",c:"fun",t:"Kochkurs mit Marktbesuch in Kyoto",q:"cooking class Kyoto Nishiki market",d:"Kyoto-Küche kennenlernen: Marktführung über den Nishiki-Markt und danach ein Kochkurs, zum Beispiel für Sushi, Miso-Suppe oder Hausmannskost. Kleine Gruppen, oft in einer Altbau-Küche.",h:"Meist Vormittag, 3–4 Std.",p:"ca. 8.000–12.000 JPY pro Person",z:"3–4 Std.",w:"Treffpunkt nahe Nishiki-Markt oder Gion",tips:["Früh buchen, vor allem zur Kirschblüte.","Vegetarische Optionen vorher klären.","Nach dem Kurs lohnt sich ein Spaziergang am Kamo-Fluss."]},
{id:"kyo-tea",s:"kyo",c:"fun",t:"Teezeremonie",q:"tea ceremony Kyoto Gion",d:"In einem Teehaus oder Tempel lernt ihr Matcha nach der klassischen Zeremonie zuzubereiten und zu trinken. Ruhig und kurz, gut für Einsteiger. Oft mit Süßigkeiten und Erklärungen auf Englisch.",h:"Mehrfach täglich, 45–60 Min.",p:"ca. 3.000–6.000 JPY pro Person",z:"45–60 Min.",w:"Vor allem in Higashiyama und Gion",tips:["Vorher reservieren, besonders am Wochenende.","Knie und Füße sind für das Sitzen auf dem Boden gefragt, es gibt oft Sitzvarianten.","Kimono-Verleih lässt sich gut mit der Teezeremonie kombinieren."]},
{id:"kyo-kimono",s:"kyo",c:"fun",t:"Kimono tragen (Verleih)",q:"kimono rental Kyoto Gion",d:"Ihr leiht einen Kimono mit Frisur und macht damit einen Spaziergang durch Gion oder Higashiyama. Ein Klassiker und gut für Fotos. Oft mit Zeitfenstern und Rückgabe am Abend.",h:"Meist 9–18 Uhr",p:"ca. 3.500–6.000 JPY pro Person inklusive Frisur",z:"Halber Tag",w:"Läden in Gion und nahe Kiyomizu-dera",tips:["Bei Regen kann ein Termin verschoben werden, vorher fragen.","Bequeme Schuhe, die ihr zum Kimono ausziehen könnt.","Zur Blüte sind die Läden voll, früh buchen."]},
{id:"kyo-sake",s:"kyo",c:"food",t:"Sake-Viertel Fushimi",q:"Fushimi sake district Gekkeikan Okura Museum Kyoto",d:"Fushimi ist seit Jahrhunderten für Sake bekannt. Ihr besucht Brauerei-Museen und probiert verschiedene Sorten. Passt gut zum Tag am Fushimi Inari, das Viertel liegt in der Nähe.",h:"Meist 9:30–16:30, montags geschlossen (vor Ort prüfen)",p:"Museum ca. 400–600 JPY, Verkostungen ca. 500–1.500 JPY",z:"1,5–2 Std.",w:"Keihan-Linie bis Chushojima, ca. 15 Min. ab Fushimi Inari",tips:["Mit einem Schluck anfangen, es kommen mehrere Sorten.","Nach dem Probieren nicht mehr Fahrrad oder Roller fahren.","Gut verbindbar mit einem Mittagessen im Viertel."]},
{id:"osa-cupnoodles",s:"osa",c:"fun",t:"Cup-Noodles-Museum (eigene Cup Noodles)",q:"Cupnoodles Museum Osaka Ikeda",d:"Im Museum in Ikeda bei Osaka gestaltet ihr euren eigenen Becher und füllt ihn mit Nudeln und Zutaten. Das Museum erzählt die Geschichte der Instant-Nudeln. Ein lustiger Ausflug für Gruppen.",h:"Meist 9:30–16:30, dienstags geschlossen (vor Ort prüfen)",p:"Eintritt ca. 500 JPY, Becher selbst gestalten ca. 500 JPY",z:"1,5–2 Std.",w:"Hankyu-Linie ab Umeda bis Ikeda, ca. 25 Min.",tips:["Zeitfenster für die eigene Becher-Gestaltung früh buchen.","Dienstags geschlossen.","Lohnt sich vor allem mit Freunden, kein Pflichtprogramm."]},
{id:"osa-bouldering",s:"osa",c:"fun",t:"Bouldern in einer Kletterhalle",q:"bouldering gym Osaka",d:"Auch Osaka hat viele Boulderhallen mit fairen Preisen. Gut für einen Regentag oder den Abend nach dem Sightseeing. Schuhe lassen sich leihen.",h:"Meist 10–22 Uhr",p:"Tageskarte ca. 1.500–2.500 JPY, Schuhmiete ca. 300–500 JPY",z:"1,5–3 Std.",w:"Hallen nahe Namba, Umeda und Shinsaibashi",tips:["Eine Halle mit englischer Beschreibung und Anfängerrouten wählen.","Handtuch mitnehmen.","Wer in Tokyo schon geklettert ist, kennt die Preise."]},
{id:"osa-koyasan",s:"osa",c:"trip",t:"Koyasan: Tempelübernachtung und Friedhof (Idee)",q:"Koyasan Okunoin Wakayama",d:"Der heilige Berg Koyasan mit Tempeln, einem bewaldeten Friedhof und der Möglichkeit, in einem Tempel zu übernachten (Shukubo) mit vegetarischem Essen. Tagesausflug oder Übernachtung, etwa zwei Stunden ab Osaka.",h:"Tempel meist 8:30–17 Uhr",p:"Zugticket ca. 2.000–3.000 JPY hin und zurück, Tempelübernachtung ab ca. 12.000 JPY pro Person",z:"Ganzer Tag",w:"Nankai-Linie ab Namba bis Gokurakubashi, dann Seilbahn und Bus",tips:["Eine Übernachtung im Tempel früh reservieren.","Feste Schuhe und warme Kleidung, auf dem Berg ist es kühler.","Als Alternative zu Hiroshima, wenn ihr es ruhiger wollt."]},
/* ---------- VIETNAM UND SÜDKOREA (Reise B) ---------- */
{id:"hoi-surf",s:"hoi",c:"fun",t:"Surfstunde bei Da Nang (My Khe Beach)",q:"surf lesson Da Nang My Khe Beach",d:"Der Strand My Khe bei Da Nang ist etwa 30 Minuten von Hoi An entfernt. Im März sind die Wellen klein, was für Anfänger gut ist. Die Hauptsaison zum Surfen ist im Herbst und Winter.",h:"Meist Vormittag",p:"ca. 600.000–900.000 VND für eine Stunde mit Brett",z:"2–3 Std. mit Anfahrt",w:"Ca. 30 Min. mit dem Taxi von Hoi An",tips:["Anfänger-Kurse mit kleinen Gruppen wählen.","Sonnenschutz nicht vergessen, das Wasser ist warm.","Wer richtig Wellen will, fährt im Herbst."]},
{id:"han-cooking",s:"han",c:"fun",t:"Kochkurs in Hanoi (Bun Cha, Frühlingsrollen)",q:"cooking class Hanoi old quarter",d:"Halbtags-Kochkurs mit Marktbesuch: Frühlingsrollen, Bun Cha und Pho-Brühe selbst machen. Ein guter Einstieg in die vietnamesische Küche, bevor ihr in Hoi An noch einen zweiten Kurs macht.",h:"Vormittag oder Nachmittag, 3–4 Std.",p:"ca. 600.000–1.000.000 VND pro Person",z:"3–4 Std.",w:"Meist Treffpunkt in der Altstadt",tips:["Auf Bewertungen mit kleinen Gruppen achten.","Vegetarische Variante vorher ankündigen.","Wer in Hoi An kocht, kann hier einen anderen Schwerpunkt nehmen."]},
{id:"sel-cooking",s:"sel",c:"fun",t:"Koreanischer Kochkurs (Kimchi, Bibimbap)",q:"Korean cooking class Seoul kimchi bibimbap",d:"Kimchi einlegen, Bibimbap und Pfannkuchen zubereiten. Mit Marktbesuch oder in einer Kochschule, oft mit Verkostung von Reiswein.",h:"Meist Vormittag, 3 Std.",p:"ca. 50.000–90.000 KRW pro Person",z:"3 Std.",w:"Meist Treffpunkt in Insadong, Myeongdong oder Hongdae",tips:["Wenige Plätze, vorher buchen.","Vegetarische Optionen vorher klären.","Gut an einem Regentag."]},
{id:"sel-climbing",s:"sel",c:"fun",t:"Bouldern in einer Kletterhalle",q:"bouldering gym Seoul",d:"Seoul hat viele Boulderhallen, die Preise sind moderat. Gut für einen Abend nach einem langen Sightseeing-Tag. Schuhe lassen sich leihen.",h:"Meist 10–23 Uhr",p:"Tageskarte ca. 20.000–30.000 KRW, Schuhmiete ca. 3.000–5.000 KRW",z:"1,5–3 Std.",w:"Viele Hallen in Hongdae, Gangnam und Seongsu",tips:["Eine Halle mit englischer Beschreibung wählen.","Handtuch mitnehmen.","Am Wochenende ist es voller."]}

  tips:['Der Nachtzug Bangkok–Chiang Mai spart einen Flug und eine Hotelnacht. Früh reservieren, Liegewagen 2. Klasse mit Klimaanlage wählen.','Elefanten nur in Projekten ohne Reiten und ohne Shows besuchen. Das Living Green Elephant Sanctuary aus eurer Liste vorher auf aktuelle Bewertungen prüfen.','Ko Tao liegt im Golf von Thailand und würde mit Fähren zwei volle Tage kosten. Deshalb ist es nicht im Plan, Khao Sok liegt dafür direkt auf dem Weg.','Für Doi Inthanon, Pha Dok Sieo und Wat Luang Khun Win braucht ihr einen Fahrer oder eine kleine Tour. Alles liegt im Hinterland und ist ohne Roller schwer zu erreichen.','Seit 15.9.2026 ist die visumfreie Zeit in Thailand auf 30 Tage gekürzt. Ihr bleibt mit 15 Tagen deutlich darunter.','Chiang Mai–Krabi fliegt nur Thai AirAsia direkt (ca. 2 Std., der Fahrplan wechselt je Saison). Vor der Buchung den Plan für den 4.3. prüfen.','Eine geplante Eintrittsgebühr von 300 THB für Touristen ist bisher nicht eingeführt, der Stand ist unklar.']},

const BOOK_TIPS=[
 {g:'Thailand',t:['Agoda und Booking.com sind die Standardseiten. Bei Gästehäusern lohnt oft eine Nachricht per LINE oder WhatsApp, manchmal gibt es dann einen besseren Preis.','Auf Koh Phi Phi und in Railay vorher buchen, im März ist Hauptsaison. Auf dem Festland reicht oft eine Buchung ein bis zwei Tage vorher.','Für Hostels nimmt man Hostelworld. Privatzimmer in Hostels sind eine gute Klasse-1-Option.','Preise in THB und EUR vergleichen. Prüfen, ob Steuer und Service im Preis stehen.']},
 {g:'Japan',t:['Booking.com, Agoda, Rakuten Travel und Jalan nutzen. Ketten wie Toyoko Inn, APA, Dormy Inn und Sotetsu Fresa Inn haben eigene Seiten, oft mit Mitgliedspreisen.','Japanische Preise gelten oft pro Person (vor allem Ryokan und Kapselhotels). Prüfen, ob der Preis für zwei Personen oder ein Zimmer gilt.','Kyoto erhebt eine Übernachtungssteuer, die 2026 gestiegen ist. Sie wird meist vor Ort gezahlt.','Zur Kirschblüte so früh wie möglich buchen und kostenlos stornierbar wählen. Zimmer in Kyoto sind zuerst weg.']},
 {g:'Vietnam, Kambodscha und Südkorea',t:['In Vietnam und Kambodscha sind Booking und Agoda üblich, in Hoi An gibt es viele Homestays, die man direkt per Nachricht bucht.','Für Ha Giang übernimmt meist die Tour die Unterkünfte (Homestays).','In Südkorea sind Booking und Agoda üblich. Dazu Yanolja und Goodchoice (koreanische Apps), die oft günstiger sind.','Vor der Buchung: Bewertungen der letzten zwölf Monate lesen und auf 8,0 oder mehr bei mindestens 100 Bewertungen achten.']}
];

/* Jeder Eintrag bekommt einen Schlüssel. Firebase erlaubt in Schlüsseln keine . $ # [ ] / */
const syncKey=k=>String(k).replace(/[.$#\[\]\/]/g,'_');
function syncFlat(st){
  const o={},put=(p,v)=>{o[p]=JSON.stringify(v)};
  Object.keys(st.done).forEach(k=>put('d:'+syncKey(k),st.done[k]));
  Object.keys(st.vis).forEach(k=>put('v:'+syncKey(k),st.vis[k]));
  Object.keys(st.bk).forEach(k=>put('b:'+syncKey(k),st.bk[k]));
  st.cbk.forEach(x=>put('c:'+syncKey(x.id),x));
  st.exp.forEach(x=>put('x:'+syncKey(x.id),x));
  ['book','pack'].forEach(l=>(st.custom[l]||[]).forEach(x=>put('l'+l[0]+':'+syncKey(x.id),x)));
  put('s:n1',st.set.n1);put('s:n2',st.set.n2);put('s:ra',st.set.ratesAt||'');
  Object.keys(st.set.buckets).forEach(k=>put('sb:'+syncKey(k),st.set.buckets[k]));
  Object.keys(st.set.rates).forEach(k=>put('sr:'+syncKey(k),st.set.rates[k]));
  return o;
}
function syncApply(flat,old){
  const s=DEF(),exp=[],cbk=[],lb=[],lp=[];
  for(const p in flat){
    let v;try{v=JSON.parse(flat[p])}catch(e){continue}
    const i=p.indexOf(':'),t=p.slice(0,i),k=p.slice(i+1);
    if(t==='d')s.done[k]=v;else if(t==='v')s.vis[k]=v;else if(t==='b')s.bk[k]=v;
    else if(t==='c')cbk.push(v);else if(t==='x')exp.push(v);else if(t==='lb')lb.push(v);else if(t==='lp')lp.push(v);
    else if(t==='s'){if(k==='n1')s.set.n1=v;else if(k==='n2')s.set.n2=v;else if(k==='ra')s.set.ratesAt=v}
    else if(t==='sb')s.set.buckets[k]=v;else if(t==='sr')s.set.rates[k]=v;
  }
  /* Reihenfolge wie bisher, Neues hinten */
  const ord=(arr,prev)=>{const pos={};(prev||[]).forEach((x,i)=>pos[x.id]=i);return arr.sort((a,b)=>((pos[a.id]!==undefined?pos[a.id]:1e9)-(pos[b.id]!==undefined?pos[b.id]:1e9))||String(a.id).localeCompare(String(b.id),undefined,{numeric:true}))};
  s.exp=ord(exp,old.exp);s.cbk=ord(cbk,old.cbk);s.custom.book=ord(lb,(old.custom||{}).book);s.custom.pack=ord(lp,(old.custom||{}).pack);
  return s;
}
/* Eigene Änderungen mit Zeitstempel versehen. Beim ersten Mal bekommt alles den Zeitwert 1, damit nichts Fremdes überschrieben wird. */
function syncTouch(){
  if(!SYNC.url)return;
  const cur=syncFlat(store),m=SYNC.meta,now=Date.now(),first=!Object.keys(m.snap).length&&!Object.keys(m.ts).length,def=first?syncFlat(DEF()):null;
  for(const p in cur){if(m.snap[p]!==cur[p]){m.ts[p]=first?(def[p]===cur[p]?0:1):now;m.snap[p]=cur[p]}}
  for(const p in m.snap){if(!(p in cur)){m.ts[p]=now;delete m.snap[p]}}
  metaSave();
}
/* Zusammenführen: pro Eintrag gewinnt der neuere Zeitstempel. Bei Gleichstand entscheidet der größere Wert, so dass beide Geräte gleich wählen. */
function syncMerge(doc,meta){
  const rv=(doc&&doc.v)||{},rt=(doc&&doc.t)||{},lt=meta.ts,lv=meta.snap,nv={},nt={};
  let toLocal=false,toRemote=false;
  new Set(Object.keys(rt).concat(Object.keys(lt))).forEach(p=>{
    const a=lt[p]||0,b=rt[p]||0;let useR;
    if(b>a)useR=true;else if(a>b)useR=false;else{const x=lv[p],y=rv[p];useR=y!==undefined&&(x===undefined||y>x)}
    const val=useR?rv[p]:lv[p],ts=useR?b:a;
    if(val!==undefined)nv[p]=val;
    nt[p]=ts;
    if(useR){if(lv[p]!==rv[p])toLocal=true}
    else if(rv[p]!==lv[p]||b!==ts)toRemote=true;
  });
  return {nv,nt,toLocal,toRemote};
}
const syncUrl=()=>SYNC.url.replace(/\s+/g,'').replace(/\/+$/,'').replace(/\.json$/,'')+'/'+TRIP.key+'.json';
function syncUi(){const e=document.getElementById('syncmsg');if(e)e.textContent=SYNC.msg}
async function syncNow(manual){
  if(!SYNC.url||SYNC.busy)return;
  if(typeof navigator!=='undefined'&&navigator.onLine===false){SYNC.msg='Offline. Der Abgleich läuft, sobald wieder Netz da ist.';syncUi();return}
  SYNC.busy=true;SYNC.msg='Gleiche ab …';syncUi();
  try{
    syncTouch();
    const url=syncUrl(),r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw new Error('Lesen fehlgeschlagen ('+r.status+')');
    const doc=await r.json(),m=syncMerge(doc,SYNC.meta);
    if(m.toLocal){
      store=syncApply(m.nv,store);persist();
      SYNC.meta.snap=syncFlat(store);
      for(const p in SYNC.meta.snap)if(!(p in m.nt))m.nt[p]=1;
      SYNC.meta.ts=m.nt;metaSave();
      if(!sheetEl)keep();
    }else{SYNC.meta.ts=m.nt;SYNC.meta.snap=m.nv;metaSave()}
    if(m.toRemote||!doc||!doc.v){
      const w=await fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({v:m.nv,t:m.nt,u:Date.now()})});
      if(!w.ok)throw new Error('Speichern fehlgeschlagen ('+w.status+')');

  }catch(err){SYNC.msg='Abgleich nicht möglich: '+(err&&err.message||err)}

}

}

/* Preise in Landeswährung bekommen automatisch den Euro-Wert dahinter */
const EUR_RX=/(\d[\d.]*)(?:\s*[–-]\s*(\d[\d.]*))?\s*(THB|VND|JPY|KRW|USD|US\$|¥)/g;
function eurize(t){
  if(t==null)return '';
  return String(t).replace(EUR_RX,(m,a,b,c)=>{
    const cur=c==='¥'?'JPY':c==='US$'?'USD':c,r=store&&store.set.rates[cur];
    if(!r)return m;
    const p=s=>parseFloat(s.replace(/\./g,'')),lo=p(a)/r,hi=b?p(b)/r:null;
    return m+' (≈ '+(hi!=null?eurR(lo)+'–'+eurR(hi):eurR(lo))+' €)';
  });
}

function arc(a,b,fl){
