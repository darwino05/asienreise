function stopTour(){if(LM.busy&&LM.map){try{LM.map._moveEnd(true)}catch(e){}}LM.tid++;LM.busy=false;setTourBtn(false);idleLoop()}
/* Rundflug: die Kamera fährt dem Symbol hinterher, zoomt bei langen Strecken heraus und an jedem Ort wieder hinein */
function runTour(){
  const map=LM.map;if(!map)return;
  if(LM.busy){stopTour();return}
  const my=++LM.tid;LM.busy=true;cancelAnimationFrame(LM.raf);setTourBtn(true);
  const N=ROUTE.length,ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2,lerp=(a,b,t)=>a+(b-a)*t;
  const stopZ=k=>ROUTE[k]==='home'?5:10;
  const P=[{t:'stop',k:0,dur:1500}];
  for(let k=1;k<N;k++){
    const a=STOPS[ROUTE[k-1]],b=STOPS[ROUTE[k]],len=Math.hypot(a.ll[0]-b.ll[0],a.ll[1]-b.ll[1]),ty=ROUTE_META[k][0];
    const z=Math.max(2,Math.min(10,map.getBoundsZoom(L.latLngBounds(LM.seg[k]),false,L.point(70,70))));
    P.push({t:'move',k,ty,z,dur:ty==='flug'?Math.max(3500,Math.min(8000,3200+len*70)):Math.max(2600,Math.min(4500,2200+len*250))});
    P.push({t:'stop',k,dur:k===N-1?2400:1800});
  }
  const alive=()=>LM.map===map&&LM.tid===my,info=$('#tourinfo');
  let idx=0,t0=performance.now(),fresh=true,cz=map.getZoom(),cc=map.getCenter();
  putTrav(LM.seg[1],0,ROUTE_META[1][0]);
  map._stop();map._moveStart(true,false);let lastEnd=0;
  const frame=now=>{
    if(!alive())return;
    const ph=P[idx],u=Math.min(1,(now-t0)/ph.dur);let tgt,z;
    if(ph.t==='move'){
      const a=STOPS[ROUTE[ph.k-1]],b=STOPS[ROUTE[ph.k]],f=ease(u);
      putTrav(LM.seg[ph.k],f,ph.ty);tgt=posOn(LM.seg[ph.k],f).ll;
      const z0=stopZ(ph.k-1),z1=stopZ(ph.k);
      z=u<.2?lerp(z0,ph.z,ease(u/.2)):u>.8?lerp(ph.z,z1,ease((u-.8)/.2)):ph.z;
      if(fresh&&info){info.hidden=false;info.innerHTML=`${trI(ph.ty,16)}<span>${TRN[ph.ty]}: ${esc(a.n)} → ${esc(b.n)}</span>`}
    }else{
      const s=STOPS[ROUTE[ph.k]];tgt=[s.ll[1],s.ll[0]];z=stopZ(ph.k);
      if(fresh){selectStop(ROUTE[ph.k],{fly:false});if(info){info.hidden=false;info.innerHTML=`${trI(ROUTE[ph.k]==='home'?'home':'flug',16)}<span>${esc(s.n)}</span>`}}
    }
    fresh=false;
    const k=ph.t==='move'?.22:.14;
    cc=L.latLng(cc.lat+(tgt[0]-cc.lat)*k,cc.lng+(tgt[1]-cc.lng)*k);cz+=(z-cz)*.12;
    map._move(cc,cz,{flyTo:true});
    if(now-lastEnd>300){lastEnd=now;map._moveEnd(true);map._moveStart(true,false)}
    if(u>=1){idx++;t0=now;fresh=true;if(idx>=P.length){LM.busy=false;setTourBtn(false);map._moveEnd(true);map.flyToBounds(bbOf(state.mv),{padding:[16,16],duration:2});idleLoop();return}}
    LM.raf=requestAnimationFrame(frame);
  };
  LM.raf=requestAnimationFrame(frame);
}

async function packPhotos(){
  const urls=packList(),msg=m=>{const e=$('#packmsg');if(e)e.textContent=m};
  if(!('caches' in window)){msg('Dieses Gerät kann Fotos nicht speichern.');return}
  if(!(navigator.serviceWorker&&navigator.serviceWorker.controller)){msg('Lade die Seite einmal neu, dann kann ich Fotos speichern.');return}
  let done=0,fail=0,i=0;msg('0 von '+urls.length+' …');
  const work=async()=>{while(i<urls.length){const u=urls[i++];try{const r=await fetch(u,{mode:'cors',credentials:'omit'});if(!r.ok)throw 0;await r.arrayBuffer()}catch(err){fail++}done++;if(done%5===0||done===urls.length)msg(done+' von '+urls.length+' geprüft'+(fail?', '+fail+' nicht geladen':'')+' …')}};
  await Promise.all([work(),work(),work(),work()]);
  msg('Fertig: '+(urls.length-fail)+' Fotos gespeichert'+(fail?', '+fail+' ließen sich nicht laden':'')+'.');
}

function openSheet(title,body,onSave,label){
  closeSheet();

  el.innerHTML=`<div class="sh2" role="dialog" aria-modal="true" aria-label="${esc(title)}"><form><div class="shh"><h2>${esc(title)}</h2><button type="button" class="x" data-close aria-label="Schließen">×</button></div>${body}<div class="shf"><button type="button" class="btn" data-close>Abbrechen</button><button class="btn pri" type="submit">${label||'Speichern'}</button></div></form></div>`;
  document.body.appendChild(el);document.body.classList.add('noscroll');sheetEl=el;
  const form=$('form',el);
  el.addEventListener('click',e=>{if(e.target===el||e.target.closest('[data-close]'))closeSheet()});
  form.addEventListener('submit',e=>{e.preventDefault();if(onSave(new FormData(form),form)!==false)closeSheet()});
  const f=$('input[type=text],input[type=number]',form);if(f)f.focus({preventScroll:true});
  return form;
}

  const r=store.set.rates;
  openSheet('Wechselkurse',['THB','VND','JPY','KRW','USD'].map(c=>`<div class="fld"><label for="r-${c}">1 € in ${CURN[c]} (${c})</label><input id="r-${c}" name="${c}" type="number" inputmode="decimal" step="any" min="0" value="${r[c]}"></div>`).join(''),fd=>{
    ['THB','VND','JPY','KRW','USD'].forEach(c=>{const v=num(fd.get(c));if(v>0)store.set.rates[c]=v});store.set.ratesAt='von dir eingetragen';save();keep();
  });
}
async function liveRates(btn){
  const old=btn.textContent;btn.textContent='Lade …';
  try{
    const j=await fetch('https://open.er-api.com/v6/latest/EUR').then(r=>r.json());
    if(j&&j.rates){['THB','VND','JPY','KRW','USD'].forEach(c=>{if(j.rates[c])store.set.rates[c]=Math.round(j.rates[c]*100)/100});store.set.ratesAt=iso(new Date()).split('-').reverse().join('.');save();keep();return}
    throw 0;
  }catch(e){btn.textContent='Kein Netz oder gesperrt. Kurse selbst eintragen.';setTimeout(()=>{btn.textContent=old},3500)}
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-trip],[data-showact],[data-mc],[data-ifs],[data-ifc],[data-tab],[data-nav],[data-pf],[data-mv],[data-stop],[data-map],[data-gomap],[data-goplan],[data-del],[data-addexp],[data-editbk],[data-addact],[data-delbk],[data-delexp],[data-bkv],[data-more],[data-budget],[data-rates],[data-ratesedit],[data-wx],[data-export],[data-import],[data-pack],[data-packdel],[data-syncsave],[data-syncnow],[data-syncoff],[data-reset],[data-resetyes],[data-mm],[data-mmtoggle],[data-tour]');
  if(!t)return;const D=t.dataset;
  if(D.trip){if(D.trip!==state.trip){useTrip(D.trip);state.tab='heute';render();scrollTo(0,0)}}
  else if(D.showact){const a=ACTSBY[D.showact];if(a){state.sel=a.s;state.act=a.id;state.mv=STOPS[a.s].st;if(state.tab==='karte'&&LM.map)showAct(a.id);else go('karte')}}
  else if(D.mc){state.mc=D.mc;const c=$('#kcats');if(c)c.innerHTML=catChips();if(LM.map)buildActs()}
  else if(D.ifs){state.ifs=D.ifs;render(true)}
  else if(D.ifc){state.ifc=D.ifc;render(true)}
  else if(D.addexp!==undefined)openExp();
  else if(D.editbk)openBk(D.editbk);
  else if(D.addact!==undefined)openAct();
  else if(D.delbk){store.cbk=store.cbk.filter(b=>b.id!==D.delbk);store.exp=store.exp.filter(x=>x.src!=='bk:'+D.delbk);save();keep()}
  else if(D.delexp){store.exp=store.exp.filter(x=>x.id!==D.delexp);save();keep()}
  else if(D.budget!==undefined)openBudget();
  else if(D.ratesedit!==undefined)openRates();
  else if(D.rates!==undefined)liveRates(t);
  else if(D.wx!==undefined){t.textContent='Lade …';Promise.all(ORDER.map(s=>loadWx(s,true))).then(()=>keep())}
  else if(D.bkv){state.bkv=D.bkv;render(true)}
  else if(D.more&&!D.tab){state.more=D.more;render()}
  else if(D.tab){if(D.more)state.more=D.more;go(D.tab)}
  else if(D.nav!==undefined){const rl=realDay();state.day=D.nav==='0'?Math.min(ND()-1,Math.max(0,rl)):Math.min(ND()-1,Math.max(0,state.day+ +D.nav));keep()}
  else if(D.pf){state.pf=D.pf;render(true)}
  else if(D.mmtoggle!==undefined){state.mm=mapMode()==='sat'?'map':'sat';state.mmNote='';render(true)}
  else if(D.mm){state.mm=D.mm;state.mmNote='';render(true)}
  else if(D.tour!==undefined)runTour();
  else if(D.mv){if(LM.map)setView(D.mv);else{state.mv=D.mv;state.sel=null;render(true)}}
  else if(D.stop){if(LM.map&&state.tab==='karte')selectStop(D.stop);else{state.sel=D.stop;state.tab='karte';if(state.mv!=='all'&&STOPS[D.stop].st!==state.mv)state.mv=STOPS[D.stop].st;render()}}
  else if(D.map){state.sel=D.map;state.mv=STOPS[D.map].st;go('karte')}
  else if(D.gomap!==undefined){state.sel=D.gomap||null;state.mv=D.gomap?STOPS[D.gomap].st:'world';go('karte')}
  else if(D.goplan){state.pf='all';go('plan',false);const el=$('#d'+D.goplan);if(el)el.scrollIntoView()}
  else if(D.del){const [k,id]=D.del.split('|');store.custom[k]=store.custom[k].filter(c=>c.id!==id);delete store.done[id];save();keep()}
  else if(D.export!==undefined){const ta=$('#exp-t');ta.value=JSON.stringify(store);ta.select();try{navigator.clipboard.writeText(ta.value).then(()=>{$('#dmsg').textContent='Kopiert.'},()=>{$('#dmsg').textContent='Text markiert. Zum Kopieren lange drücken.'})}catch(x){$('#dmsg').textContent='Text markiert. Zum Kopieren lange drücken.'}}
  else if(D.import!==undefined){try{const j=JSON.parse($('#imp-t').value);if(!j||typeof j!=='object')throw 0;store=DEF();loadStore(j);save();$('#dmsg').textContent='Daten übernommen.';setTimeout(keep,600)}catch(x){$('#dmsg').textContent='Der Text ist ungültig. Bitte ganz kopieren.'}}
  else if(D.pack!==undefined)packPhotos();
  else if(D.packdel!==undefined)packClear();
  else if(D.syncsave!==undefined){const u=(document.getElementById('sync-url').value||'').trim();if(!/^https:\/\//i.test(u)){SYNC.msg='Die Adresse muss mit https:// beginnen.';syncUi()}else syncEnable(u)}
  else if(D.syncnow!==undefined){if(SYNC.url)syncNow(true);else{SYNC.msg='Erst die Adresse eintragen und speichern.';syncUi()}}
  else if(D.syncoff!==undefined)syncDisable();
  else if(D.reset!==undefined){$('#resetbox').innerHTML='<button class="btn pri" data-resetyes>Ja, alles löschen</button><button data-tab="mehr">Abbrechen</button>'}
  else if(D.resetyes!==undefined){store=DEF();save();keep()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.mk')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'){const f=t.closest&&t.closest('.af');if(f)f.classList.add('noimg')}},true);
document.addEventListener('change',e=>{
  if(e.target.id==='kview'){const v=e.target.value;if(LM.map)setView(v);else{state.mv=v;state.sel=null;render(true)}return}
  const v=e.target.closest('[data-vis]');
  if(v){if(v.checked)store.vis[v.dataset.vis]=1;else delete store.vis[v.dataset.vis];save();const d=v.closest('details.act');if(d)d.classList.toggle('seen',v.checked);return}
  const c=e.target.closest('[data-chk]');if(c){
    const k=c.dataset.chk;if(c.checked)store.done[c.value]=1;else delete store.done[c.value];save();
    const it=listItems(k),dn=it.filter(x=>store.done[x.id]).length;
    $(`[data-cnt="${k}"]`).textContent=`${dn} von ${it.length}`;$(`[data-bar="${k}"]`).style.width=(dn/it.length*100)+'%';
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='iq'){state.iqRaw=e.target.value;state.iq=e.target.value.trim().toLowerCase();const l=$('#ilist');if(l)l.innerHTML=ideaList();return}
  if(e.target.id==='cv-a'||e.target.id==='cv-c'){const a=num($('#cv-a').value),c=$('#cv-c').value;$('#cv-o').textContent=eur2(eurOf(a,c))}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-add]');
  if(f){e.preventDefault();const k=f.dataset.add,t=$('#add-'+k).value.trim();if(!t)return;store.custom[k].push({id:'c'+Date.now(),t});save();keep();const n=$('#add-'+k);if(n)n.focus({preventScroll:true});return}
  if(e.target.id==='namesf'){e.preventDefault();const fd=new FormData(e.target);store.set.n1=String(fd.get('n1')||'').trim()||'Person 1';store.set.n2=String(fd.get('n2')||'').trim()||'Person 2';save();keep()}
});
const hs=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===hs))state.tab=hs;
render();
syncStart();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
