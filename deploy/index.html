/* Layout: Handy-App mit sechs Tabs und schwebendem Ausgaben-Knopf; eine Farbe pro Etappe (Thailand Safran, Vietnam Jade, Japan Sakura, Südkorea Violett), Rest ist tintenblaues Grau. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface2:#E3E8F0; --ink:#14213A; --muted:#566682; --line:#D1D9E5;
  --th:#D98A0B; --vn:#1F8F68; --jp:#D6456F; --ko:#7A56C9; --warn:#B3261E; --ok:#1B7A4F;
  --sea:#D5E3EE; --land:#F6F8FA; --coast:#A9BACB; --grid:#C3D2DF;
  --kh:#2A7FB8; --home:#14213A;
  --k1:#D9822B; --k2:#7A56C9; --k3:#1F8F68; --k4:#3B6FD4; --k5:#D6456F; --k6:#0E96A5; --k7:#7D8CA8;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1222; --surface:#151E35; --surface2:#1E2A47; --ink:#E9EDF6; --muted:#97A4C0; --line:#2A3654;
  --th:#F0A93A; --vn:#3FBF92; --jp:#F2799C; --ko:#B396F5; --warn:#FF8F85; --ok:#5FD39B; --kh:#6EB6E8; --home:#E9EDF6;
  --sea:#0A1020; --land:#1F2C4A; --coast:#38486B; --grid:#16203A;
  --k1:#F0A05A; --k2:#B396F5; --k3:#3FBF92; --k4:#7FA2F5; --k5:#F2799C; --k6:#4CC9D6; --k7:#97A4C0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1222; --surface:#151E35; --surface2:#1E2A47; --ink:#E9EDF6; --muted:#97A4C0; --line:#2A3654;
  --th:#F0A93A; --vn:#3FBF92; --jp:#F2799C; --ko:#B396F5; --warn:#FF8F85; --ok:#5FD39B; --kh:#6EB6E8; --home:#E9EDF6;
  --sea:#0A1020; --land:#1F2C4A; --coast:#38486B; --grid:#16203A;
  --k1:#F0A05A; --k2:#B396F5; --k3:#3FBF92; --k4:#7FA2F5; --k5:#F2799C; --k6:#4CC9D6; --k7:#97A4C0; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0}
body.noscroll{overflow:hidden}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 150px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.tn{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.appbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px}
.appbar b{font:700 20px var(--f-display);letter-spacing:-.02em}
.appbar span{color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.lbl{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--sc);flex:none}
.note{color:var(--muted);font-size:14px;max-width:64ch}
.sec{font-size:22px;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;padding:0 14px;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a,.links button{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:600;text-decoration:none}
.tag{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border-radius:6px;padding:2px 8px;font:500 12px var(--f-mono);background:color-mix(in srgb,var(--sc,var(--muted)) 20%,var(--surface))}
.tag.ok{background:color-mix(in srgb,var(--ok) 20%,var(--surface))}
.tag.warn{background:color-mix(in srgb,var(--warn) 20%,var(--surface));color:var(--warn)}
.empty{border-style:dashed;background:transparent}

/* Heute */
.count{display:flex;align-items:center;gap:16px;background:var(--ink);color:var(--bg);border-radius:14px;padding:16px 18px}
.count b{font:800 52px/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.count span{font-size:14px;line-height:1.35}
.hero{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:18px;border:1px solid color-mix(in srgb,var(--sc) 40%,var(--line));background:linear-gradient(150deg,color-mix(in srgb,var(--sc) 26%,var(--surface)) 0%,var(--surface) 70%)}
.hero .big{position:absolute;right:10px;top:-14px;font:800 150px/1 var(--f-display);letter-spacing:-.05em;color:color-mix(in srgb,var(--sc) 22%,transparent);pointer-events:none;user-select:none}
.hero>*{position:relative}
.hero h1{font-size:clamp(38px,10.5vw,60px);line-height:1;max-width:80%}
.pill{display:inline-block;border:1px solid var(--ink);border-radius:99px;padding:0 8px;margin-left:6px;font:500 11px/18px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.stagechip{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px}
.hw{display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}
.hw .t{font:700 34px/1 var(--f-display);letter-spacing:-.02em}
.hw .t span{font-size:20px;color:var(--muted);font-weight:500}
.hw small{display:block;color:var(--muted);font-size:13px}
.hw .clk{margin-left:auto;text-align:right}
.nav{display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
.prog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.prog li{padding-left:16px;position:relative}
.prog li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--sc,var(--ink))}
.card h3{font-size:22px;line-height:1.15}
.mapcard{padding:0;overflow:hidden;gap:0}
.mapcard .cap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px}
.stagebar{display:flex;gap:4px;height:10px}
.stagebar i{position:relative;display:block;border-radius:3px;background:color-mix(in srgb,var(--sc) 24%,var(--surface2));overflow:hidden}
.stagebar i b{position:absolute;inset:0 auto 0 0;background:var(--sc)}
.stagebar i u{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink);border-radius:2px}
.deadlines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.deadlines li{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:baseline}
.deadlines .mono{color:var(--muted)}
.deadlines small{display:block;color:var(--muted);font-size:13.5px}
.wxrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.wxd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:10px;background:var(--surface2);font-size:13px;text-align:center}
.wxd.on{outline:2px solid var(--ink)}
.wxd svg{width:24px;height:24px}
.wxd b{font-weight:600;font-variant-numeric:tabular-nums}
.wxd .mono{font-size:11px;color:var(--muted)}
.bigmoney{font:800 40px/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>div{display:flex;flex-direction:column;gap:2px}
.two small{color:var(--muted);font-size:13px}
.bar2{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--ink);transition:width .2s}
.bar2 i.over{background:var(--warn)}

/* Plan */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;min-height:40px;padding:0 16px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.sh{display:flex;gap:12px;align-items:stretch}
.sh .bar{width:6px;border-radius:3px;background:var(--sc);flex:none}
.sh h2{font-size:28px;line-height:1.1}
.sh .mono{color:var(--muted)}
.intro{color:var(--muted);max-width:62ch}
.days{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;scroll-margin-top:16px}
.day.today{border:2px solid var(--ink);padding:11px}
.day.past{opacity:.6}
.dn{display:flex;flex-direction:column;gap:2px}
.dn b{font:700 26px/1 var(--f-display);box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--sc) 45%,transparent);align-self:flex-start}
.dn .mono{color:var(--muted);font-size:11.5px}
.db{display:flex;flex-direction:column;gap:2px;min-width:0}
.db h3{font-size:17px}

const WXP={};
function stopDays(id){return DAYS.map((d,i)=>d[1]===id?i:-1).filter(i=>i>=0)}
async function loadWx(id,force){
  const c=WXC[id];if(!force&&c&&Date.now()-c.t<6*36e5)return;

        fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${ly(d0)}&end_date=${ly(d1)}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto`).then(r=>r.json()).catch(()=>null)

      if(Object.keys(n.fc).length||Object.keys(n.ly).length){WXC[id]=n;try{localStorage.setItem('asien27wx',JSON.stringify(WXC))}catch(e){}}

}
function wxFor(stop,i){
  const date=addDays(START,i),c=WXC[stop];
  if(c&&c.fc&&c.fc[iso(date)]){const x=c.fc[iso(date)];return {src:'fc',hi:Math.round(x.hi),lo:Math.round(x.lo),ic:codeIc(x.code),txt:x.pop==null?'':x.pop+' % Regenrisiko'}}
  if(c&&c.ly){
    const v=[];for(let o=-2;o<=2;o++){const d=addDays(date,o),y=c.ly[iso(new Date(d.getFullYear()-1,d.getMonth(),d.getDate()))];if(y&&y.hi!=null&&y.lo!=null)v.push(y)}

}
function refreshWx(stops,force){

}

function offMin(tz,d){const p=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});return (Date.UTC(+p.year,p.month-1,+p.day,+p.hour,+p.minute)-Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes()))/6e4}
function clock(st,i,live){
  try{
    const tz=TZ[st],noon=new Date(Date.UTC(START.getFullYear(),START.getMonth(),START.getDate()+i,10)),diff=(offMin(tz,noon)-offMin('Europe/Vienna',noon))/60;
    const t=live?new Intl.DateTimeFormat('de-DE',{timeZone:tz,hour:'2-digit',minute:'2-digit'}).format(new Date()):'';
    return `<div class="clk"><b class="tn">${t?t+' Uhr':'Zeitzone'}</b><small>${diff>0?'+':''}${String(diff).replace('.',',')} h zu Wien/Zürich</small></div>`;

}

{id:"krb-railay",s:"krb",c:"nature",t:"Railay Beach",wp:"Railay Beach",q:"Railay Beach, Krabi",d:"Halbinsel ohne Straßenanbindung, umgeben von Kalksteinfelsen. Railay West hat Sonnenuntergänge und weißen Sand, Railay East Mangroven und Kletterfelsen, Phra Nang den schönsten Strand.",h:"Boote ab Ao Nang ca. 8:00–18:00",p:"Longtail ab Ao Nang ca. 100–150 THB pro Person (Sammelboot)",z:"Ganzer Tag oder länger",w:"Longtail-Boot ab Ao Nang (ca. 15 Min.) oder Krabi Town (Chao Fa Pier, ca. 45 Min.)",tips:["Bei Ebbe ist der Einstieg ins Boot im Wasser, trockene Tasche oder Beutel mitnehmen.","Wenn ihr hier schlaft: abends nach Abfahrt der Tagesboote ist es am schönsten.","Mit leichtem Rucksack anreisen."]},
{id:"krb-climb",s:"krb",c:"fun",t:"Kletterkurs in Railay",wp:"Rock climbing",q:"King Climbers Railay Beach",d:"Railay zählt zu den bekanntesten Klettergebieten Asiens. Der Einführungskurs lehrt Sichern und die ersten Routen an Kalksteinwänden, mit Guide und Ausrüstung.",h:"Halbtag meist ca. 9:00–12:00 oder 13:30–17:00",p:"Halbtag ca. 1.200–1.800 THB pro Person",z:"3–4 Std.",w:"Anbieter am Strand Railay West und Railay East",tips:["Kurse vorab anfragen, der Platz ist in der Hauptsaison begrenzt.","Feste Sportschuhe, Sonnenschutz und Wasser einpacken.","Wer mehr klettert, mietet Schuhe oder bringt eigene mit."]},
{id:"krb-phranang",s:"krb",c:"nature",t:"Phra Nang Beach und Höhle",wp:"Phra Nang Cave",q:"Phra Nang Beach, Railay",d:"Traumhafter Strand mit steilen Felsen. In der Phra-Nang-Höhle wird eine Fruchtbarkeitsgöttin verehrt, deshalb stehen dort viele hölzerne Opfergaben.",h:"Tageslicht",p:"Eintritt frei",z:"2–3 Std.",w:"10–15 Min. zu Fuß von Railay West",tips:["Mittags kommen viele Tagesboote, früh oder nachmittags ist es ruhiger.","Affen sind hier unterwegs, Essen gut verstauen."]},
{id:"krb-viewpoint",s:"krb",c:"nature",t:"Railay Viewpoint und Lagune",wp:"Railay Beach",q:"Railay Viewpoint, Krabi",d:"Steiler Aufstieg an Seilen und Wurzeln zum Aussichtspunkt, danach geht es hinab in die Lagune. Der Blick auf beide Strände lohnt sich, aber der Weg ist anspruchsvoll.",h:"Nur bei Tageslicht, früh am Morgen am besten",p:"Eintritt frei",z:"1,5–2 Std.",w:"Wegbeginn nahe Railay East",tips:["Nur mit festen Schuhen. Bei Nässe und im Dunkeln nicht gehen.","Der Abstieg zur Lagune ist oft schlammig, Hände frei haben.","Wasser mitnehmen."]},
{id:"krb-kayak",s:"krb",c:"fun",t:"Kajak in Railay oder Ao Thalane",wp:"Ao Thalane",q:"Ao Thalane kayaking Krabi",d:"Entweder ein Leihkajak direkt in Railay und Ao Nang oder eine geführte Mangroven-Tour in Ao Thalane mit Felsschluchten und Affen.",h:"Leihkajaks tagsüber, Touren meist vormittags",p:"Leihkajak ca. 150–300 THB pro Stunde, Tour ca. 800–1.200 THB",z:"1–4 Std.",w:"Ao Thalane ca. 30–40 Min. von Krabi Town",tips:["Bei Ebbe und Flut ändern sich die Wege, Guides kennen die Gezeiten.","Wasserfeste Handyhülle ist sinnvoll."]},
{id:"krb-4islands",s:"krb",c:"trip",t:"4-Islands-Tour",wp:"Ko Poda",q:"4 Islands tour Krabi Koh Poda Chicken Island",d:"Longtail-Tagestour zu Koh Poda, Chicken Island, Koh Tup und der Sandbank, mit Schnorcheln und Strandstopps. Klassiker ab Ao Nang und Railay.",h:"Meist ca. 9:00–16:00",p:"Gruppentour ca. 500–900 THB, privates Longtail ab ca. 2.000–3.000 THB (plus Nationalparkgebühr ca. 400 THB pro Person)",z:"6–7 Std.",w:"Abfahrt am Strand von Ao Nang oder Railay",tips:["Privates Boot ist ruhiger, die frühe Abfahrt vermeidet die größten Gruppen.","Schnorchelausrüstung und Wasser vorab klären.","Bei starkem Wind fallen Touren aus."]},
{id:"krb-hong",s:"krb",c:"trip",t:"Hong Islands",wp:"Ko Hong (Krabi)",q:"Hong Island Krabi lagoon",d:"Insel-Gruppe mit türkisfarbener Lagune, ruhigen Buchten und Kajak-Möglichkeiten. Weniger überlaufen als die Phi-Phi-Inseln.",h:"Meist ca. 9:00–16:00",p:"Speedboat-Tour ca. 1.200–2.000 THB, Longtail privat ca. 3.000–3.500 THB (plus Nationalparkgebühr ca. 400 THB)",z:"6–8 Std.",w:"Abfahrt ab Ao Nang oder Krabi Town",tips:["Früh starten, um die Lagune vor den Speedbooten zu erreichen.","Bei hohem Seegang auf Speedboat verzichten."]},
{id:"krb-lanta",s:"krb",c:"trip",t:"Koh Lanta (Tagesausflug)",wp:"Ko Lanta",q:"Koh Lanta, Krabi",d:"Ruhige, lange Insel mit entspannten Stränden und kleinen Dörfern. Als Tagesausflug machbar mit Fähre und Minivan.",h:"Fähren tagsüber",p:"Tour ca. 500–1.000 THB pro Person",z:"Ganzer Tag",w:"ca. 1,5–2 Std. von Krabi Town (Minivan und Fähre)",tips:["Früh los, damit der Strandtag nicht zu kurz wird.","Kantiang Bay ist einer der schönsten Strände."]},
{id:"krb-tiger",s:"krb",c:"sight",t:"Tiger-Cave-Tempel (Wat Tham Suea)",wp:"Wat Tham Suea",q:"Tiger Cave Temple Krabi",d:"1.260 Stufen führen zu einem Gipfeltempel mit Buddha und einem Rundblick über das Land. Schweißtreibend, aber eindrucksvoll.",h:"Täglich ca. 6:00–17:00",p:"Eintritt frei (Spende)",z:"1,5–2 Std.",w:"ca. 9 km von Krabi Town, Taxi oder Songthaew",tips:["Früh am Morgen gehen, wegen Hitze.","Auf Affen achten und nichts offen tragen.","Schulter und Knie bedeckt."]},
{id:"krb-emerald",s:"krb",c:"nature",t:"Emerald Pool und Heiße Quellen",wp:"Khao Pra Bang Khram Wildlife Sanctuary",q:"Emerald Pool Krabi",d:"Natürliche Pools im Dschungel mit smaragdgrünem Wasser und warmen Quellen. Gute Abwechslung zum Meer.",h:"Täglich ca. 8:00–17:00",p:"ca. 200 THB Eintritt, Tour ca. 600–900 THB",z:"3–4 Std.",w:"ca. 1 Std. von Ao Nang, Tour oder Taxi",tips:["Nicht am Wochenende, dann ist es sehr voll.","Badekleidung und Wechselkleidung mitnehmen."]},
{id:"krb-aonang",s:"krb",c:"sight",t:"Ao Nang: Strand, Sonnenuntergang und Abendessen",wp:"Ao Nang",q:"Ao Nang Beach, Krabi",d:"Die lebendige Strandstadt: Promenade, Restaurants, Läden und Tourenbüros. Am Abend gehen die Leute hier aufs Wasser schauen, wenn die Sonne untergeht.",h:"Den ganzen Tag",p:"Essen ca. 100–300 THB",z:"2–4 Std.",w:"Longtail-Boote verbinden Ao Nang mit Railay",tips:["Gute Seafood-Restaurants an der Promenade, Preise vorher prüfen.","Tourenbüros vergleichen, bevor ihr bucht."]},
{id:"krb-nightmarket",s:"krb",c:"market",t:"Krabi Town: Wochenend-Nachtmarkt",wp:"Krabi (town)",q:"Krabi Town weekend night market",d:"Nachtmarkt in Krabi Town mit Streetfood, Snacks, Kleidung und Livemusik, vor allem an Wochenenden. Weniger touristisch als Ao Nang.",h:"Meist Fr–So ca. 17:00–22:00 (vor Ort prüfen)",p:"Essen ca. 40–100 THB",z:"1–2 Std.",w:"Krabi Town, Songthaew oder Taxi ab Ao Nang",tips:["Gegrilltes und Fruchtshakes probieren.","Zeiten vorher erfragen, sie ändern sich."]}

/* ---------- HANOI ---------- */
{id:"han-biahoi",s:"han",c:"night",t:"Bia Hoi Corner in der Altstadt",wp:"Bia hơi",q:"Ta Hien Street Bia Hoi corner, Hanoi",d:"Kreuzung Ta Hien und Luong Ngoc Quyen: Fassbier für wenige Cent auf Plastikhockern direkt an der Straße. Laut, günstig, voller Leute aus aller Welt.",h:"Meist ab ca. 17:00 bis spät in die Nacht",p:"Bier ca. 10.000–20.000 VND",z:"1–2 Std.",w:"Mitten in der Altstadt, zu Fuß",tips:["Bia Hoi ist frisch gebrautes, leichtes Bier mit wenig Alkohol.","Taschen eng am Körper halten, Handy nicht auf den Tisch legen.","Hockerplätze füllen sich ab 19 Uhr."]},
{id:"han-hoankiem",s:"han",c:"sight",t:"Hoan-Kiem-See und Ngoc-Son-Tempel",wp:"Hoàn Kiếm Lake",q:"Hoan Kiem Lake, Hanoi",d:"Der See im Herzen der Stadt. Morgens machen hier Einheimische Tai-Chi und Sport. Die rote Huc-Brücke führt zum Ngoc-Son-Tempel auf der kleinen Insel.",h:"See rund um die Uhr, Tempel ca. 7:00–18:00",p:"See frei, Ngoc-Son-Tempel ca. 50.000 VND",z:"1–1,5 Std.",w:"Altstadt, zu Fuß",tips:["Am Morgen gegen 6–7 Uhr ist die Stimmung am schönsten.","Am Wochenende ist die Umgebung für Autos gesperrt und voller Familien."]},
{id:"han-literature",s:"han",c:"sight",t:"Literaturtempel (Van Mieu)",wp:"Temple of Literature, Hanoi",q:"Temple of Literature, Hanoi",d:"Vietnams erste Universität aus dem Jahr 1070, mit fünf Höfen, Steinstelen auf Schildkröten und ruhigen Gartenanlagen.",h:"Täglich ca. 8:00–17:00",p:"ca. 30.000 VND",z:"1 Std.",w:"ca. 20 Min. zu Fuß von der Altstadt, oder Grab",tips:["Morgens ist es am ruhigsten, später kommen Reisegruppen.","Ein Teil der Anlage wird bei Prüfungszeiten für Studierende genutzt."]},
{id:"han-foodtour",s:"han",c:"food",t:"Streetfood-Tour: Bun Cha, Pho, Banh Mi",wp:"Bún chả",q:"Bun Cha Huong Lien Hanoi",d:"Hanoi ist eine der besten Streetfood-Städte der Welt. Bun Cha (gegrilltes Schweinefleisch mit kalten Nudeln), Pho (Rindernudelsuppe) und Banh Mi (Baguette) gehören dazu.",h:"Bun Cha meist mittags, Pho ab früh morgens",p:"Gericht ca. 40.000–70.000 VND, Führung ca. 600.000–1.000.000 VND",z:"2–3 Std.",w:"Altstadt, mit Guide oder auf eigene Faust",tips:["Ein bekannter Ort für Bun Cha ist Bun Cha Huong Lien (hier aß einst Obama).","Pho in kleinen Läden, die sich auf eine Brühe spezialisiert haben, wie Pho Gia Truyen.","Mit Guide probiert ihr mehr und lernt, was ihr da esst."]},
{id:"han-eggcoffee",s:"han",c:"food",t:"Egg Coffee (Ca phe trung)",wp:"Egg coffee",q:"Cafe Giang, Hanoi",d:"Hanois Kaffee-Spezialität: starker Kaffee mit cremig aufgeschlagenem Eigelb und Kondensmilch, fast wie ein flüssiges Tiramisu.",h:"Cafés meist ca. 7:00–22:00",p:"ca. 30.000–50.000 VND",z:"30–45 Min.",w:"Ursprung: Cafe Giang in der Altstadt, auch viele andere Cafés",tips:["Warm im Wasserbad serviert, damit er warm bleibt.","Der Eierlikör-Geschmack ist eine Gewöhnungssache, aber ein Muss."]},
{id:"han-trainstreet",s:"han",c:"sight",t:"Train Street",wp:"Hanoi",q:"Hanoi Train Street Phung Hung",d:"Eine enge Gasse, durch die täglich Züge in Armeslänge an Cafés vorbeirollen. Der Zugang ist inzwischen eingeschränkt und wechselt: offiziell ist der kommerzielle Betrieb verboten, oft kommt man nur als Gast eines Cafés hinein.",h:"Je nach Zugzeiten und Absperrungen",p:"Getränk im Café ca. 40.000–80.000 VND",z:"1 Std.",w:"Altstadt, Gasse nahe Phung Hung Street",tips:["Aktuellen Stand vor Ort im Hotel oder Café erfragen. Zugzeiten und Zugang ändern sich.","Wenn ein Zug kommt, dem Personal folgen und vom Gleis weggehen. Die Sicherheit geht vor.","Nicht auf die Gleise setzen und keine Selfies mit Zug machen."]},
{id:"han-puppets",s:"han",c:"fun",t:"Wasserpuppentheater",wp:"Thăng Long Water Puppet Theatre",q:"Thang Long Water Puppet Theatre, Hanoi",d:"Traditionelles Puppentheater, bei dem Marionetten auf dem Wasser tanzen, begleitet von Livemusik. 50 Minuten Alltag, Legenden und Humor aus Vietnam.",h:"Mehrere Vorstellungen täglich, grob 16:00–20:30",p:"ca. 100.000–200.000 VND",z:"50 Min.",w:"Direkt am Hoan-Kiem-See",tips:["Tickets vorab oder am selben Tag kaufen, die beliebten Zeiten sind schnell weg.","Plätze vorne sind spritzwassergefährdet, aber nahe dran."]},
{id:"han-ninhbinh",s:"han",c:"trip",t:"Ninh Binh: Trang An per Boot",wp:"Tràng An Scenic Landscape Complex",q:"Trang An Scenic Landscape Complex, Ninh Binh",d:"„Ha Long Bay auf dem Land“: Ruderboote fahren durch Kalkstein-Berge, Höhlen und Reisfelder. Dazu ein Aufstieg zur Mua-Höhle für den Panoramablick.",h:"Boote meist ca. 7:00–16:00",p:"Boot ca. 250.000 VND, Mua-Höhle ca. 100.000 VND, Tagestour ab Hanoi ca. 25–45 US$",z:"Ganzer Tag",w:"ca. 2 Std. Fahrt ab Hanoi, Tour oder Zug bis Ninh Binh",tips:["Früh los, die Hauptzeit am Vormittag ist ruhiger.","Mua-Höhle hat rund 500 Stufen, Sonnenschutz und Wasser.","Mit Zug und Fahrrad auch individuell machbar."]},
{id:"han-hoalo",s:"han",c:"sight",t:"Hoa-Lo-Gefängnis",wp:"Hỏa Lò Prison",q:"Hoa Lo Prison, Hanoi",d:"Museum im früheren Gefängnis aus der Kolonialzeit, später „Hanoi Hilton“ genannt. Ernst, aber lehrreich.",h:"Täglich ca. 8:00–17:00",p:"ca. 100.000 VND",z:"1 Std.",w:"Altstadt, 15 Min. zu Fuß",tips:["Eine Stunde reicht, die Texte sind auf Englisch."]},
{id:"han-mausoleum",s:"han",c:"sight",t:"Ho-Chi-Minh-Mausoleum und Ba Dinh",wp:"Ho Chi Minh Mausoleum",q:"Ho Chi Minh Mausoleum, Hanoi",d:"Großer Platz mit Mausoleum, Präsidentenpalast und Ein-Säulen-Pagode. Die Atmosphäre ist würdevoll, mit Wachen und strengen Regeln.",h:"Mausoleum meist nur vormittags, nicht an allen Tagen; jährliche Schließzeit",p:"Mausoleum frei, Museum ca. 40.000 VND",z:"1,5–2 Std.",w:"Taxi oder Grab, ca. 20 Min. von der Altstadt",tips:["Öffnungstage vorab prüfen.","Schultern und Knie bedecken, keine Mützen und Taschen mit hinein."]},
{id:"han-oldquarter",s:"han",c:"sight",t:"Altstadt der 36 Gassen",wp:"Old Quarter, Hanoi",q:"Hanoi Old Quarter",d:"Jedes Gässchen hat sein Handwerk: Seide, Silber, Bambus, Medizin. Lebendiges Durcheinander aus Mopeds, Märkten und Teestuben.",h:"Den ganzen Tag, abends besonders lebendig",p:"Eintritt frei",z:"2–3 Std.",w:"Zu Fuß",tips:["Straßen überqueren: langsam, gleichmäßig gehen, die Mopeds weichen aus.","Fr–So abends gibt es einen Nachtmarkt in der Hang Dao Street."]},
{id:"han-longbien",s:"han",c:"sight",t:"Long-Bien-Brücke bei Sonnenaufgang",wp:"Long Biên Bridge",q:"Long Bien Bridge, Hanoi",d:"Stählerne Eisenbahnbrücke aus der Kolonialzeit über den Roten Fluss. Früh morgens fotografieren, wenn der Nebel liegt und Händler mit Obst zu den Märkten fahren.",h:"Rund um die Uhr zugänglich",p:"Eintritt frei",z:"1 Std.",w:"Altstadt, 15–20 Min. zu Fuß",tips:["Gegen 5:30–6:30 Uhr am schönsten.","Auf der Brücke fahren auch Züge, am Rand gehen."]},
{id:"han-cathedral",s:"han",c:"sight",t:"St.-Josephs-Kathedrale und Café-Straße",wp:"St. Joseph's Cathedral, Hanoi",q:"St. Joseph's Cathedral, Hanoi",d:"Neugotische Kirche aus dem 19. Jahrhundert, umgeben von kleinen Cafés, Läden und Restaurants. Gut für einen Kaffeestopp.",h:"Kirche meist zu Messezeiten offen",p:"Eintritt frei",z:"45 Min.",w:"Altstadt, zu Fuß",tips:["Die Cafés in den Obergeschossen bieten Blick auf den Vorplatz."]},
{id:"han-ethno",s:"han",c:"sight",t:"Vietnam Museum of Ethnology",wp:"Vietnam Museum of Ethnology",q:"Vietnam Museum of Ethnology, Hanoi",d:"Gut gemachtes Museum über die 54 ethnischen Gruppen des Landes, mit Außenbereich und nachgebauten Häusern.",h:"Di–So ca. 8:30–17:30",p:"ca. 40.000 VND",z:"1,5–2 Std.",w:"Taxi oder Grab, ca. 8 km von der Altstadt",tips:["Montags geschlossen. Gut an Regentagen."]},
{id:"han-westlake",s:"han",c:"sight",t:"West Lake und Tran-Quoc-Pagode",wp:"Trấn Quốc Pagoda",q:"Tran Quoc Pagoda, Hanoi",d:"Hanois größter See mit der ältesten Pagode der Stadt auf einer kleinen Halbinsel. Zum Radeln, Spazieren und für Cafés am Wasser.",h:"Pagode ca. 7:30–17:00",p:"Eintritt frei",z:"1–2 Std.",w:"Taxi oder Grab, 6 km von der Altstadt",tips:["Zum Sonnenuntergang gut, mit Café am Wasser."]},

/* ---------- HA LONG / LAN HA ---------- */
{id:"hlb-cruise",s:"hlb",c:"trip",t:"Bootstour in der Lan-Ha-Bucht (mit Übernachtung)",wp:"Lan Ha Bay",q:"Lan Ha Bay cruise Vietnam",d:"Ruhiger als die Ha-Long-Bucht und genauso eindrucksvoll: Tausende Kalksteininseln, Buchten und schwimmende Dörfer. Übernachtung auf dem Boot mit Abendessen und Sonnenuntergang auf dem Deck.",h:"Abholung in Hanoi meist ca. 8:00, Rückkehr nächster Tag am Nachmittag",p:"ca. 2.500.000–5.500.000 VND pro Person (Mittelklasse, 2 Tage/1 Nacht)",z:"2 Tage/1 Nacht",w:"Shuttle ab Hanoi, ca. 3–4 Std. bis Hafen",tips:["Anbieter mit guten, aktuellen Bewertungen und kleiner Gruppe wählen.","Genau prüfen, ob Lan Ha oder Ha Long gebucht wird.","Im Februar/März kann es dunstig und kühl sein, Jacke mitnehmen."]},
{id:"hlb-kayak",s:"hlb",c:"fun",t:"Kajak und Höhle",wp:"Sung Sot Cave",q:"Kayaking Lan Ha Bay Dark and Bright Cave",d:"Mit dem Kajak durch stille Buchten, Lagunen und kleine Höhlen. Fast jede Bootstour enthält einen Kajak-Stopp und manchmal einen Höhlenbesuch.",h:"Meist am Nachmittag und am Morgen",p:"meist im Tourpreis enthalten",z:"1–2 Std.",w:"Ab dem Boot",tips:["Wasserfeste Kleidung und Kamera-Schutz einpacken.","Sonnencreme nicht vergessen, auch bei Dunst."]},
{id:"hlb-sunrise",s:"hlb",c:"nature",t:"Sonnenaufgang und Tai-Chi an Deck",wp:"Hạ Long Bay",q:"Halong Bay sunrise",d:"Früh aufstehen lohnt sich: Nebel zwischen den Felsen, ruhige Bucht und Tai-Chi mit der Crew. Danach Frühstück, bevor es zurück nach Hanoi geht.",h:"Sonnenaufgang im März ca. 6:00",p:"im Tourpreis enthalten",z:"1 Std.",w:"An Bord",tips:["Warme Kleidung einpacken, früh morgens ist es frisch."]},
{id:"hlb-catba",s:"hlb",c:"trip",t:"Cat Ba Island",wp:"Cát Bà Island",q:"Cat Ba Island, Vietnam",d:"Größte Insel der Bucht mit Nationalpark, Wanderungen und kleinen Stränden. Viele Lan-Ha-Touren starten oder enden hier.",h:"Tagsüber",p:"Nationalpark ca. 40.000 VND",z:"Ganzer Tag",w:"Boot ab Hai Phong oder Tuan Chau",tips:["Cannon Fort Viewpoint bietet eine gute Aussicht.","Für Übernachtung zusätzlichen Tag einplanen."]},

/* ---------- HOI AN ---------- */
{id:"hoi-lanterns",s:"hoi",c:"night",t:"Laternen am Fluss (Abendstimmung)",wp:"Hội An Old Town",q:"Hoi An Ancient Town riverfront",d:"Abends füllen sich Hoi Ans Gassen und das Ufer des Thu-Bon-Flusses mit bunten Laternen. Ihr könnt kleine Papierboote mit Kerzen auf dem Wasser schwimmen lassen.",h:"Ab Sonnenuntergang bis ca. 22:00",p:"Papierlaterne ca. 20.000–30.000 VND",z:"2 Std.",w:"Altstadt, zu Fuß",tips:["Zur Vollmondnacht gibt es ein Laternenfest mit abgeschaltetem Licht.","Bootsfahrten auf dem Fluss kosten oft deutlich mehr, vorher Preis fix machen."]},
{id:"hoi-oldtown",s:"hoi",c:"sight",t:"Altstadt von Hoi An",wp:"Hội An Old Town",q:"Hoi An Ancient Town",d:"UNESCO-Welterbe mit gelben Häusern, Handelshäusern, Versammlungshallen und der japanischen Brücke. Für die Gebäude gibt es ein Sammelticket.",h:"Täglich ca. 8:00–21:30",p:"Sammelticket ca. 120.000 VND (gültig für mehrere Sehenswürdigkeiten)",z:"3–4 Std.",w:"Zu Fuß. Für Autos gesperrt",tips:["Tagsüber ist es heißer, morgens oder abends spazieren.","Ticket wird an Eingängen der Altstadt kontrolliert."]},
{id:"hoi-cycling",s:"hoi",c:"fun",t:"Radtour durch die Reisfelder",wp:"Trà Quế",q:"Tra Que vegetable village, Hoi An",d:"Mit dem Fahrrad aus der Altstadt hinaus durch Reisfelder, Dörfer und Wasserbüffel. Beliebtes Ziel: das Gemüsedorf Tra Que.",h:"Am besten morgens oder am späten Nachmittag",p:"Fahrradverleih ca. 30.000–60.000 VND pro Tag, geführte Touren ca. 300.000–600.000 VND",z:"2–4 Std.",w:"Von der Altstadt ca. 3 km",tips:["Sonnenschutz und Wasser mitnehmen.","Der Verkehr ist ruhig, aber Mopeds fahren schnell."]},
{id:"hoi-cooking",s:"hoi",c:"fun",t:"Kochkurs in Hoi An",wp:"Vietnamese cuisine",q:"Red Bridge Cooking School Hoi An",d:"Marktbesuch, Bootsfahrt und dann kocht ihr Cao Lau, Frühlingsrollen und Banh Xeo. Beliebte Schulen sind Red Bridge und Hoi An Eco Cooking.",h:"Halbtags oder ganztags",p:"ca. 700.000–1.200.000 VND",z:"4–6 Std.",w:"Abholung vom Hotel meist inklusive",tips:["Vorab buchen, vor allem in der Hauptsaison.","Vegetarische Optionen nachfragen."]},
{id:"hoi-tailor",s:"hoi",c:"fun",t:"Maßschneider",wp:"Hội An Old Town",q:"tailor shops Hoi An Yaly Couture",d:"Hoi An ist berühmt für günstige Maßanfertigung: Hemden, Kleider, Anzüge. Der Stoff wird gewählt, Maße genommen, 24–48 Stunden später ist alles fertig.",h:"Läden meist ca. 8:00–21:00",p:"Hemd ab ca. 400.000 VND, Anzug ca. 3.000.000–6.000.000 VND",z:"2–3 Anproben",w:"Altstadt",tips:["Mindestens zwei Anproben einplanen, nicht am letzten Tag bestellen.","Bei gutem Ruf der Schneiderei bleiben und Fotos der Wunschmodelle mitnehmen.","Tailor-Läden am Rand sind oft günstiger."]},
{id:"hoi-anbang",s:"hoi",c:"nature",t:"An Bang Beach",wp:"An Bàng Beach",q:"An Bang Beach, Hoi An",d:"Entspannter Strand ca. 5 km von der Altstadt mit Restaurants und Bars direkt am Sand. Gut für Sonne und Seafood.",h:"Den ganzen Tag",p:"Liege ca. 50.000–100.000 VND bei Konsum",z:"Halber Tag",w:"Fahrrad, Taxi oder Grab, ca. 15–20 Min.",tips:["März ist meist angenehm warm, Wasser ca. 23–24 °C.","Am späten Nachmittag zum Sonnenuntergang bleiben."]},
{id:"hoi-marble",s:"hoi",c:"sight",t:"Marble Mountains",wp:"Marble Mountains (Vietnam)",q:"Marble Mountains, Da Nang",d:"Fünf Marmor- und Kalksteinhügel mit Höhlen, Pagoden und Aussichtspunkten. Auf der Strecke zwischen Hoi An und Da Nang.",h:"Täglich ca. 7:00–17:30",p:"ca. 40.000 VND, Aufzug ca. 15.000 VND",z:"1,5–2 Std.",w:"ca. 30 Min. von Hoi An, Taxi oder Grab",tips:["Rutschige Stufen, feste Schuhe.","Morgens kommt ihr vor den Reisebussen an."]},
{id:"hoi-bridge",s:"hoi",c:"sight",t:"Japanische Brücke",wp:"Japanese Covered Bridge",q:"Japanese Covered Bridge, Hoi An",d:"Das Wahrzeichen von Hoi An aus dem 17. Jahrhundert, überdacht, mit kleinem Tempel in der Mitte. Im Ticket der Altstadt enthalten.",h:"Täglich ca. 8:00–21:30",p:"im Sammelticket der Altstadt",z:"20 Min.",w:"Altstadt",tips:["Abends ist sie bunt beleuchtet und sehr fotogen."]},
{id:"hoi-caolau",s:"hoi",c:"food",t:"Cao Lau und Banh Mi",wp:"Cao lầu",q:"Banh Mi Phuong Hoi An",d:"Zwei Hoi-An-Klassiker: Cao Lau (dicke Nudeln mit Schweinefleisch und Kräutern, nur hier so) und Banh Mi von Banh Mi Phuong, den Anthony Bourdain bekannt machte.",h:"Mittags und abends",p:"Cao Lau ca. 40.000–70.000 VND, Banh Mi ca. 25.000–40.000 VND",z:"1 Std.",w:"Altstadt",tips:["Cao Lau wird traditionell mit Wasser aus einem bestimmten Brunnen gemacht.","Banh Mi Phuong ist oft voll, Wartezeit einplanen."]},
{id:"hoi-coconut",s:"hoi",c:"fun",t:"Cam-Thanh-Kokosnusswald (Korbboot)",wp:"Cẩm Thanh",q:"Cam Thanh Coconut Village Hoi An basket boat",d:"Rundfahrt mit runden Korbbooten durch einen Kokospalmen-Wald im Wasser. Etwas touristisch, aber ein Spaß.",h:"Tagsüber",p:"ca. 150.000–250.000 VND",z:"1–2 Std.",w:"ca. 6 km von Hoi An",tips:["Preis vorab aushandeln, Trinkgeld üblich.","Sonnencreme und Hut mitnehmen."]},
{id:"hoi-myson",s:"hoi",c:"trip",t:"My Son Sanctuary",wp:"Mỹ Sơn",q:"My Son Sanctuary, Quang Nam",d:"Hindu-Tempelruinen des Champa-Reiches im Dschungel, UNESCO-Welterbe. Eindrucksvoll, aber Teile wurden im Vietnamkrieg zerstört.",h:"Täglich ca. 6:30–16:30",p:"ca. 150.000 VND",z:"Halber Tag",w:"ca. 1 Std. von Hoi An, Tour oder Taxi",tips:["Früh hin: Sonnenaufgangstouren sind kühl und ruhiger.","Festes Schuhwerk, Sonnenschutz und Wasser."]}

/* ---------- TOKYO ---------- */
{id:"tyo-shinjuku",s:"tyo",c:"night",t:"Shinjuku bei Nacht",wp:"Shinjuku",q:"Shinjuku, Tokyo",d:"Neonlichter, Hochhäuser und der belebteste Bahnhof der Welt. Kabukicho ist Tokyos Vergnügungsviertel, Golden Gai ein Gewirr winziger Bars.",h:"Abends bis spät",p:"Eintritt frei, Essen ab ca. 1.000 ¥",z:"2–3 Std.",w:"JR/Metro Shinjuku, Ost- und Westausgang",tips:["Am Abend nach der Ankunft gut zum Ankommen.","In Kabukicho keine Lockrufer ansprechen oder mitgehen.","Die Aussicht aus dem kostenlosen Observatorium des Rathauses (Tocho) ist ein guter Start."]},
{id:"tyo-omoide",s:"tyo",c:"food",t:"Omoide Yokocho (Yakitori-Gasse)",wp:"Omoide Yokochō",q:"Omoide Yokocho, Shinjuku, Tokyo",d:"Enge Gasse hinter dem Bahnhof Shinjuku mit winzigen Yakitori-Lokalen für 6–10 Gäste. Rauch, Spieße und Bier unter Neonlichtern.",h:"Meist ca. 17:00–24:00",p:"Spieß ca. 150–300 ¥, Getränk ca. 500–700 ¥",z:"1–1,5 Std.",w:"Direkt hinter Shinjuku Station, Westausgang",tips:["Viele Lokale haben einen Mindestverzehr oder Sitzgebühr, Karte anschauen.","Bargeld mitbringen, nicht überall geht Karte."]},
{id:"tyo-sensoji",s:"tyo",c:"sight",t:"Senso-ji in Asakusa",wp:"Sensō-ji",q:"Senso-ji, Asakusa, Tokyo",d:"Tokyos ältester Tempel mit dem roten Kaminarimon-Tor und der Einkaufsstraße Nakamise. Rauch von Räucherwerk und viele Geschäfte mit Souvenirs und Snacks.",h:"Gelände rund um die Uhr, Haupthalle ca. 6:00–17:00",p:"Eintritt frei",z:"1,5–2 Std.",w:"Metro Asakusa (Ginza oder Asakusa Line)",tips:["Morgens vor 8 Uhr oder abends wenn es leer ist, ist es am stimmungsvollsten.","Für Omikuji (Orakel-Zettel) kostet es ca. 100 ¥."]},
{id:"tyo-sumida",s:"tyo",c:"nature",t:"Sumida-Fluss und Sumida Park",wp:"Sumida River",q:"Sumida Park, Tokyo",d:"Uferweg zwischen Asakusa und dem Skytree. In der Kirschblüte säumen Hunderte Bäume den Fluss, dazu der Blick auf den Skytree.",h:"Jederzeit",p:"Eintritt frei",z:"1 Std.",w:"Ab Senso-ji 5–10 Min. zu Fuß",tips:["Zur Hanami-Zeit gibt es Stände mit Snacks.","Fähren fahren von Asakusa die Sumida hinunter bis Hamarikyu und Odaiba."]},
{id:"tyo-skytree",s:"tyo",c:"sight",t:"Tokyo Skytree",wp:"Tokyo Skytree",q:"Tokyo Skytree",d:"Mit 634 m der höchste Turm der Welt. Die Aussichtsplattformen bei 350 und 450 m zeigen Tokyo bis zum Fuji, bei klarer Sicht.",h:"Täglich ca. 10:00–21:00",p:"Tembo Deck ca. 2.100–2.600 ¥ (je nach Tag und Zeit), Galleria zusätzlich ca. 1.000 ¥",z:"1,5–2 Std.",w:"Metro/Tobu Tokyo Skytree Station",tips:["Tickets vorab online mit festem Zeitfenster sparen Wartezeit.","Bei Regen und Dunst lohnt es nicht, Wetter prüfen.","Nach Asakusa und Sumida-Park gut kombinierbar."]},
{id:"tyo-shibuya",s:"tyo",c:"sight",t:"Shibuya Crossing",wp:"Shibuya Crossing",q:"Shibuya Crossing, Tokyo",d:"Die berühmteste Kreuzung der Welt. Bei Grün überqueren Hunderte Menschen gleichzeitig in alle Richtungen. Am besten von oben und von unten erleben.",h:"Jederzeit, abends am eindrucksvollsten",p:"Eintritt frei",z:"30–45 Min.",w:"JR/Metro Shibuya, Hachiko-Ausgang",tips:["Aussichtspunkt gratis: Starbucks (Tsutaya) oder Shibuya Mark City Passage.","Die Hachiko-Statue ist der klassische Treffpunkt."]},
{id:"tyo-harajuku",s:"tyo",c:"market",t:"Harajuku und Takeshita Street",wp:"Takeshita Street",q:"Takeshita Street, Harajuku, Tokyo",d:"Bunte Jugendmode, Crêpes, Süßigkeiten und Kuriositäten. Daneben die ruhigere Omotesando-Allee mit Designer-Läden und Cafés.",h:"Läden meist ca. 10:00–20:00",p:"Crêpe ca. 600–900 ¥",z:"1,5–2 Std.",w:"JR Harajuku, Takeshita-Ausgang",tips:["Am Wochenende sehr voll, unter der Woche entspannter.","Cat Street (Kyu-Shibuyagawa) ist die ruhige Nebenstraße zu Shibuya."]},
{id:"tyo-meiji",s:"tyo",c:"sight",t:"Meiji-Schrein",wp:"Meiji Shrine",q:"Meiji Shrine, Tokyo",d:"Ruhiger Shinto-Schrein in einem Wald mitten in der Stadt. Die Wege führen durch riesige Torii-Tore. Mit etwas Glück seht ihr eine Hochzeitsprozession.",h:"Von Sonnenaufgang bis Sonnenuntergang",p:"Eintritt frei",z:"1–1,5 Std.",w:"Direkt neben JR Harajuku",tips:["Vor dem Schrein grüßt man mit zweimal Verbeugen, zweimal Klatschen und einer Verbeugung.","Nach Shibuya Sky oder Harajuku passt es gut zu Fuß."]},
{id:"tyo-shibuyasky",s:"tyo",c:"sight",t:"Shibuya Sky bei Sonnenuntergang",wp:"Shibuya Scramble Square",q:"Shibuya Sky, Tokyo",d:"Offene Dachterrasse auf 229 m mit 360-Grad-Blick über Tokyo. Zur Sonnenuntergangszeit am schönsten, bei klarem Wetter mit Fuji im Hintergrund.",h:"Täglich ca. 9:00–22:30 (letzter Einlass ca. 21:20)",p:"ca. 2.500–3.700 ¥ je nach Zeitfenster",z:"1–1,5 Std.",w:"Direkt über Shibuya Station (Shibuya Scramble Square)",tips:["Tickets vorab online mit Zeitfenster buchen, Sonnenuntergang ist schnell ausverkauft.","Bei bewölktem Himmel besser einen anderen Tag wählen.","Nur wenig Taschen erlaubt, Schließfächer sind vorhanden."]},
{id:"tyo-gyoen",s:"tyo",c:"nature",t:"Shinjuku Gyoen (Kirschblüte)",wp:"Shinjuku Gyoen",q:"Shinjuku Gyoen, Tokyo",d:"Großer Park mit über 1.000 Kirschbäumen, Rasenflächen zum Picknicken und japanischem, englischem und französischem Garten. Einer der schönsten Hanami-Orte der Stadt.",h:"Di–So ca. 9:00–16:30 (Montag geschlossen, in der Blütezeit oft geöffnet)",p:"500 ¥",z:"2 Std.",w:"JR/Metro Shinjuku, 10 Min. zu Fuß",tips:["Alkohol und laute Musik sind verboten.","Früh kommen, zur Blütezeit am Wochenende sehr voll.","Picknickdecke und Snacks vom Konbini mitnehmen."]},
{id:"tyo-ueno",s:"tyo",c:"nature",t:"Ueno-Park (Hanami)",wp:"Ueno Park",q:"Ueno Park, Tokyo",d:"Tokyos berühmtester Kirschblüten-Park. Unter den Bäumen sitzen Einheimische beim Picknick. Dazu Museen, Zoo und der Shinobazu-Teich.",h:"Park jederzeit",p:"Eintritt frei, Museen extra",z:"2 Std.",w:"JR Ueno, Park-Ausgang",tips:["Zur Blüte sehr voll, aber voller Stimmung.","Am Teich lohnen sich die Tretboote."]},
{id:"tyo-meguro",s:"tyo",c:"nature",t:"Meguro-Kanal abends beleuchtet",wp:"Meguro River",q:"Meguro River cherry blossoms, Tokyo",d:"Der Meguro-Fluss wird von etwa 800 Kirschbäumen gesäumt. Abends hängen Laternen über dem Wasser und tauchen die Blüten in rosa Licht.",h:"Beleuchtung in der Blütezeit ab Dämmerung",p:"Eintritt frei",z:"1–1,5 Std.",w:"Metro/JR Naka-Meguro",tips:["Zur Hochblüte kommen Tausende, Einbahn-Wege für Fußgänger.","Cafés und Streetfood-Stände am Ufer."]},
{id:"tyo-hakone",s:"tyo",c:"trip",t:"Hakone (Onsen und Fuji-Blick)",wp:"Hakone, Kanagawa",q:"Hakone, Kanagawa",d:"Bergregion mit heißen Quellen, Seilbahn, Vulkantal Owakudani und Blick auf den Fuji, wenn das Wetter mitspielt. Gut als Tages- oder Übernachtungsausflug.",h:"Je nach Attraktion ca. 9:00–17:00",p:"Hakone Free Pass ca. 6.100 ¥ (2 Tage, ab Shinjuku)",z:"Ganzer Tag oder Übernachtung",w:"Odakyu Romancecar ab Shinjuku, ca. 85 Min.",tips:["Ein Tag mit klarer Sicht ist entscheidend, Wettervorhersage prüfen.","Onsen: Tätowierungen sind in manchen Bädern ein Problem, vorher fragen.","Free Pass lohnt sich meist durch Seilbahn, Bus und Boot."]},
{id:"tyo-kamakura",s:"tyo",c:"trip",t:"Kamakura (Großer Buddha)",wp:"Kamakura",q:"Kamakura Great Buddha Kotoku-in",d:"Küstenstadt mit Tempeln, Wanderwegen und dem 13 m großen Bronze-Buddha. Gut als Tagesausflug mit Stopp am Strand und der Romanbahn Enoden.",h:"Großer Buddha ca. 8:00–17:30",p:"Großer Buddha ca. 300 ¥, Zug ca. 950 ¥ ab Tokyo",z:"Ganzer Tag",w:"JR Yokosuka oder Shonan Shinjuku Line ab Tokyo, ca. 1 Std.",tips:["Der Hasedera-Tempel hat einen schönen Meerblick.","Die Wanderung von Kita-Kamakura zum Daibutsu dauert ca. 3 Std."]},
{id:"tyo-tsukiji",s:"tyo",c:"food",t:"Tsukiji Outer Market",wp:"Tsukiji Fish Market",q:"Tsukiji Outer Market, Tokyo",d:"Der Außenmarkt des früheren Fischmarkts: frische Sushi, Tamagoyaki, Meeresfrüchte-Spieße und Kaffee. Gut für ein spätes Frühstück.",h:"Meist ca. 6:00–14:00 (Mi oft geschlossen)",p:"Essen ca. 500–2.500 ¥",z:"1,5 Std.",w:"Metro Tsukiji oder Tsukijishijo",tips:["Früh kommen, mittags sind viele Stände leer.","Gehen und Essen gleichzeitig ist verpönt, bitte am Stand essen."]},
{id:"tyo-teamlab",s:"tyo",c:"fun",t:"teamLab Planets",wp:"TeamLab (art collective)",q:"teamLab Planets, Tokyo",d:"Barfuß durch Wasser und Spiegel, durch Räume voller Licht und Blumen. Eine Kunst-Ausstellung zum Eintauchen, die man nicht vergisst.",h:"Meist ca. 9:00–22:00, Einlass mit festem Zeitfenster",p:"ca. 3.800–4.400 ¥",z:"2 Std.",w:"Metro Shin-Toyosu, 1 Min. zu Fuß",tips:["Tickets früh online buchen, Zeitfenster sind begrenzt.","Hosen die man hochkrempeln kann, keine Röcke, Handtuch vorhanden."]},
{id:"tyo-akihabara",s:"tyo",c:"fun",t:"Akihabara",wp:"Akihabara",q:"Akihabara, Tokyo",d:"Elektronik, Retro-Spiele, Anime, Manga und Spielhallen auf mehreren Etagen. Für Spiele- und Technik-Fans ein Paradies.",h:"Läden meist ca. 10:00–21:00",p:"Eintritt frei",z:"2 Std.",w:"JR Akihabara, Electric Town Ausgang",tips:["Gachapon-Automaten (Kapselspielzeug) kosten ca. 300–500 ¥.","Läden für Retro-Games gibt es auf den oberen Etagen."]},
{id:"tyo-yanaka",s:"tyo",c:"sight",t:"Yanaka: alte Gassen und Tempel",wp:"Yanaka, Tokyo",q:"Yanaka Ginza, Tokyo",d:"Ruhiges Viertel, das viel vom alten Tokyo bewahrt hat. Kleine Läden, Katzen, Friedhof mit Kirschbäumen und die Einkaufsgasse Yanaka Ginza.",h:"Läden meist ca. 10:00–18:00",p:"Eintritt frei",z:"2 Std.",w:"JR Nippori, 5 Min. zu Fuß",tips:["Kombinierbar mit Ueno-Park.","Auf dem Yanaka-Friedhof blühen Kirschbäume schön."]},
{id:"tyo-chidori",s:"tyo",c:"nature",t:"Chidorigafuchi (Kirschblüte am Wassergraben)",wp:"Chidorigafuchi",q:"Chidorigafuchi, Tokyo",d:"Kirschbäume hängen über den Graben des Kaiserpalastes. Man kann kleine Ruderboote leihen und unter den Blüten fahren. Eines der meistfotografierten Hanami-Motive.",h:"Park ganztags, Boote meist ca. 11:00–17:30",p:"Boote ca. 800 ¥ pro 30 Min. (Warteschlange!)",z:"1–2 Std.",w:"Metro Kudanshita, 5 Min. zu Fuß",tips:["Wartezeit für Boote kann 1–2 Stunden betragen.","Abends gibt es eine Beleuchtung, aber sehr voll."]},
{id:"tyo-ghibli",s:"tyo",c:"fun",t:"Ghibli-Museum (Mitaka)",wp:"Ghibli Museum",q:"Ghibli Museum, Mitaka",d:"Das Museum zu den Filmen von Hayao Miyazaki, mit Originalzeichnungen und einem Kurzfilm, der nur hier gezeigt wird. Tickets sind schwer zu bekommen.",h:"Mit festem Zeitfenster, Di meist zu",p:"ca. 1.000 ¥",z:"2 Std.",w:"JR Mitaka, dann Bus oder Spaziergang",tips:["Tickets werden monatlich für den Folgemonat verkauft und sind oft sofort weg. Frühzeitig informieren.","Fotografieren drinnen ist nicht erlaubt."]},
{id:"tyo-tocho",s:"tyo",c:"sight",t:"Rathaus-Aussicht (Tocho), kostenlos",wp:"Tokyo Metropolitan Government Building",q:"Tokyo Metropolitan Government Building observation deck",d:"Kostenlose Aussichtsplattform im 45. Stock des Rathauses in Shinjuku. Ein gutes Ersatzprogramm, wenn Shibuya Sky ausgebucht ist.",h:"Täglich ca. 9:30–22:00 (je nach Turm)",p:"Eintritt frei",z:"45 Min.",w:"Metro Tochomae oder JR Shinjuku, 10 Min. zu Fuß",tips:["Bei klarem Wetter ist der Fuji sichtbar.","Mit Ausweis oder Pass kurz die Eingangskontrolle."]},

/* ---------- KYOTO ---------- */
{id:"kyo-gion",s:"kyo",c:"sight",t:"Gion",wp:"Gion",q:"Gion, Kyoto",d:"Das berühmteste Geisha-Viertel mit Holzhäusern, Teehäusern und stimmungsvollen Gassen. In der Abenddämmerung kann man Maiko und Geiko auf dem Weg zu Terminen sehen.",h:"Abends ca. 17:00–19:00 am ehesten Geiko",p:"Eintritt frei",z:"1–2 Std.",w:"Keihan Gion-Shijo oder Hankyu Kawaramachi",tips:["Geiko und Maiko nicht ungefragt fotografieren, nicht hinterherlaufen, in einigen Gassen ist Fotografieren verboten.","Hanamikoji Street ist die bekannteste Gasse."]},
{id:"kyo-yasaka",s:"kyo",c:"sight",t:"Yasaka-Schrein",wp:"Yasaka Shrine",q:"Yasaka Shrine, Kyoto",d:"Schrein am Rand von Gion und Maruyama-Park, mit Hunderten Laternen, die nachts leuchten. Die Anlage ist ganztägig zugänglich.",h:"Rund um die Uhr",p:"Eintritt frei",z:"30–45 Min.",w:"Zu Fuß von Gion, direkt am Maruyama-Park",tips:["Abends beleuchtet besonders schön.","Ein guter Übergang zu Maruyama-Park und Kiyomizu-dera."]},
{id:"kyo-fushimi",s:"kyo",c:"sight",t:"Fushimi Inari-Taisha",wp:"Fushimi Inari-taisha",q:"Fushimi Inari Taisha, Kyoto",d:"Tausende rote Torii-Tore säumen die Wege den Berg hinauf. Unten ist es voll, je weiter ihr aufsteigt, desto ruhiger wird es.",h:"Rund um die Uhr geöffnet",p:"Eintritt frei",z:"2–3 Std. (voller Aufstieg ca. 2 Std.)",w:"JR Nara Line bis Inari Station, direkt vor dem Eingang",tips:["Vor 8 Uhr da sein, danach wird es sehr voll.","Bis zum Yotsutsuji-Kreuzpunkt (ca. 45 Min.) gibt es einen Rundblick, oben wird es leer.","Bequeme Schuhe und Wasser."]},
{id:"kyo-philosopher",s:"kyo",c:"nature",t:"Philosophenweg (Kirschblüte)",wp:"Philosopher's Walk",q:"Philosopher's Path, Kyoto",d:"Etwa 2 km langer Spazierweg entlang eines Kanals mit Kirschbäumen, kleinen Cafés und Tempeln. Zur Blütezeit fallen die Blüten wie Schnee auf das Wasser.",h:"Jederzeit",p:"Eintritt frei",z:"1–1,5 Std.",w:"Bus bis Ginkakuji-michi oder zu Fuß ab Nanzen-ji",tips:["Morgens vor 9 Uhr am ruhigsten.","Auf dem Weg: Honen-in (kleiner Moostempel) und Cafés."]},
{id:"kyo-ginkakuji",s:"kyo",c:"sight",t:"Ginkaku-ji (Silberpavillon)",wp:"Ginkaku-ji",q:"Ginkaku-ji, Kyoto",d:"Zen-Tempel mit Sandgarten, Moos und kunstvoll angelegtem Rundweg. Der Pavillon selbst war nie versilbert, der Name ist geblieben.",h:"Täglich ca. 8:30–17:00",p:"ca. 500 ¥",z:"1 Std.",w:"Bus ab Kyoto Station oder zu Fuß vom Philosophenweg",tips:["Am Ende des Philosophenwegs gelegen, gut als Abschluss.","Frühstück oder Matcha gibt es in den Cafés in der Nähe."]},
{id:"kyo-bamboo",s:"kyo",c:"nature",t:"Arashiyama-Bambushain",wp:"Arashiyama Bamboo Grove",q:"Arashiyama Bamboo Grove, Kyoto",d:"Bambuswald, in dem das Licht grün schimmert und der Wind rauscht. Um 7 Uhr oft fast leer, später dichte Menschenmengen.",h:"Rund um die Uhr zugänglich",p:"Eintritt frei",z:"30–45 Min.",w:"JR Saga-Arashiyama oder Randen Arashiyama",tips:["Vor 8 Uhr kommen, sonst Schlange.","Den Weg weiter zum Okochi Sanso (Garten-Villa) fortsetzen."]},
{id:"kyo-tenryuji",s:"kyo",c:"sight",t:"Tenryu-ji",wp:"Tenryū-ji",q:"Tenryu-ji, Kyoto",d:"Zen-Tempel und UNESCO-Welterbe mit einem der schönsten Gärten Kyotos, der Teich und Berge einbindet. Der Ausgang führt direkt in den Bambushain.",h:"Täglich ca. 8:30–17:00",p:"Garten ca. 500 ¥, Hallen ca. 300 ¥ extra",z:"1 Std.",w:"Direkt neben dem Bambushain",tips:["Im Frühling ist der Garten besonders schön, mit Kirschblüten.","Durch den Hinterausgang kommt ihr in den Bambushain."]},
{id:"kyo-hozu",s:"kyo",c:"fun",t:"Hozugawa-Bootsfahrt",wp:"Hozu River",q:"Hozugawa River Boat Ride, Kameoka",d:"Etwa zweistündige Fahrt in einem Holzboot, das von Bootsleuten gestakt wird, durch Schluchten und leichte Stromschnellen. Ein Gegengewicht zum Tempelprogramm.",h:"Mehrere Abfahrten täglich, Winter eingeschränkt, Wasserstand beachten",p:"ca. 4.100–4.500 ¥",z:"2 Std.",w:"Zug bis Kameoka, dann Shuttle zum Anleger. Ende in Arashiyama",tips:["Wasserfeste Schuhe, es kann spritzen.","Bei Dürre oder Hochwasser fällt die Fahrt aus, Betrieb vorab prüfen."]},
{id:"kyo-maruyama",s:"kyo",c:"nature",t:"Maruyama-Park (Hanami am Abend)",wp:"Maruyama Park",q:"Maruyama Park, Kyoto",d:"Kyotos beliebtester Hanami-Park. In der Mitte steht eine große Trauerkirsche, die abends angestrahlt wird. Dazu Stände und Picknickdecken unter den Bäumen.",h:"Park rund um die Uhr, Beleuchtung ab Dämmerung",p:"Eintritt frei",z:"1–2 Std.",w:"Direkt hinter Yasaka-Schrein",tips:["Sitzplätze früh am Nachmittag sichern.","Streetfood und Sake gibt es an den Ständen."]},
{id:"kyo-kiyomizu",s:"kyo",c:"sight",t:"Kiyomizu-dera",wp:"Kiyomizu-dera",q:"Kiyomizu-dera, Kyoto",d:"Der Holztempel mit der großen Terrasse über dem Hang. Der Blick über die Stadt, besonders zur Kirschblüte und im Abendlicht, ist einer der berühmtesten in Japan.",h:"Täglich ca. 6:00–18:00 (zur Kirschblüte oft auch abends)",p:"ca. 500 ¥",z:"1,5 Std.",w:"Bus oder zu Fuß ab Gion, ca. 25 Min. steil bergauf",tips:["Am besten morgens kurz nach 6 Uhr oder abends.","Die Gassen Ninenzaka und Sannenzaka laden zum Bummeln ein.","Zur Kirschblüte gibt es oft Abendöffnung mit Beleuchtung."]},
{id:"kyo-nishiki",s:"kyo",c:"market",t:"Nishiki-Markt",wp:"Nishiki Market",q:"Nishiki Market, Kyoto",d:"Etwa 400 m lange überdachte Marktgasse, die „Küche Kyotos“. Eingelegtes, Tofu, Meeresfrüchte, Süßes und Matcha-Snacks.",h:"Meist ca. 10:00–17:00",p:"Snacks ca. 200–1.000 ¥",z:"1–1,5 Std.",w:"Metro Shijo, Hankyu Karasuma",tips:["Beim Essen bitte stehen bleiben, nicht im Gehen essen.","Am späten Nachmittag schließen viele Stände."]},
{id:"kyo-kinkakuji",s:"kyo",c:"sight",t:"Kinkaku-ji (Goldener Pavillon)",wp:"Kinkaku-ji",q:"Kinkaku-ji, Kyoto",d:"Der mit Blattgold bedeckte Pavillon spiegelt sich im Teich. Eines der Wahrzeichen Kyotos, meist voll, aber sehenswert.",h:"Täglich ca. 9:00–17:00",p:"ca. 500 ¥",z:"45 Min.",w:"Bus ab Kyoto Station, ca. 40 Min.",tips:["Früh morgens kommen, am späten Nachmittag fällt das beste Licht.","Der Rundgang dauert nur ca. 30 Minuten."]},
{id:"kyo-nijo",s:"kyo",c:"sight",t:"Nijo-Schloss",wp:"Nijō Castle",q:"Nijo Castle, Kyoto",d:"Residenz des ersten Shoguns der Edo-Zeit mit Nachtigallböden, die bei jedem Schritt quietschen, und Wandmalereien aus Gold.",h:"Meist ca. 8:45–16:00 (Gelände länger), einzelne Schließtage",p:"ca. 1.300 ¥ (Schloss und Palast)",z:"1,5 Std.",w:"Metro Nijojo-mae",tips:["Im Inneren ist Fotografieren nicht erlaubt.","Zur Kirschblüte sind die Gärten außen sehr schön."]},
{id:"kyo-pontocho",s:"kyo",c:"night",t:"Pontocho und Kamo-Ufer am Abend",wp:"Pontochō",q:"Pontocho Alley, Kyoto",d:"Enge Gasse mit Restaurants und Bars, die im Sommer Terrassen am Kamo-Fluss haben. Sehr stimmungsvoll abends mit Laternen.",h:"Abends ca. 17:00–23:00",p:"Essen ca. 2.000–6.000 ¥",z:"2 Std.",w:"Hankyu Kawaramachi, 5 Min. zu Fuß",tips:["Reservieren für bekannte Lokale.","Die Preise sind höher als in Seitenstraßen, Speisekarte prüfen."]},
{id:"kyo-heian",s:"kyo",c:"sight",t:"Heian-Schrein und Okazaki-Kanal",wp:"Heian Shrine",q:"Heian Shrine, Kyoto",d:"Der leuchtend orangefarbene Schrein mit riesigem Torii. Am nahen Okazaki-Kanal fahren zur Kirschblüte kleine Boote unter blühenden Bäumen.",h:"Schrein ca. 6:00–18:00, Garten ca. 8:30–17:30",p:"Schrein frei, Garten ca. 600 ¥",z:"1,5 Std.",w:"Metro Higashiyama, 10 Min. zu Fuß",tips:["Bootsfahrten auf dem Kanal nur in der Blütezeit.","Gut mit Nanzen-ji und Philosophenweg kombinierbar."]},

/* ---------- NARA ---------- */
{id:"nar-todaiji",s:"nar",c:"sight",t:"Todai-ji (Großer Buddha)",wp:"Tōdai-ji",q:"Todai-ji, Nara",d:"Die größte Holzhalle der Welt beherbergt einen 15 m hohen Bronze-Buddha aus dem 8. Jahrhundert. Beeindruckend schon wegen der Größe.",h:"Täglich ca. 7:30–17:30",p:"ca. 800 ¥",z:"1–1,5 Std.",w:"20 Min. zu Fuß vom Bahnhof Kintetsu Nara",tips:["Am Eingang gibt es das Tor Nandaimon mit großen Wächterstatuen.","Mit dem Park und Kasuga-Schrein zu einem Tagesprogramm verbinden."]},
{id:"nar-deer",s:"nar",c:"nature",t:"Nara-Park und die Hirsche",wp:"Nara Park",q:"Nara Park, Nara",d:"Über 1.000 zahme Sika-Hirsche leben im Park und verbeugen sich für Hirschkekse. Lustig, aber sie können beißen und stoßen.",h:"Park rund um die Uhr",p:"Eintritt frei, Hirschkekse ca. 200 ¥",z:"1–2 Std.",w:"Direkt am Bahnhof Kintetsu Nara",tips:["Nur die Hirschkekse füttern, nichts anderes. Papier und Plastik sind schädlich.","Sobald Kekse zu sehen sind, werden die Hirsche aufdringlich."]},
{id:"nar-kasuga",s:"nar",c:"sight",t:"Kasuga-Taisha",wp:"Kasuga-taisha",q:"Kasuga Taisha, Nara",d:"Schrein im Wald mit Tausenden Steinlaternen und Bronze-Laternen. Der Weg dorthin führt durch einen ruhigen Zedernwald.",h:"Täglich ca. 6:00–17:30 (je nach Jahreszeit)",p:"Gelände frei, innerer Bereich ca. 700 ¥",z:"1–1,5 Std.",w:"20 Min. zu Fuß vom Todai-ji durch den Park",tips:["Die Laternen werden zu bestimmten Festen angezündet."]},
{id:"nar-naramachi",s:"nar",c:"sight",t:"Naramachi: Gassen und Cafés",wp:"Naramachi",q:"Naramachi, Nara",d:"Altes Kaufmannsviertel mit Holzhäusern, kleinen Läden und Cafés. Eine ruhige Ergänzung zum Park.",h:"Läden meist ca. 10:00–17:00",p:"Eintritt frei",z:"1 Std.",w:"10 Min. zu Fuß vom Bahnhof",tips:["Typischer Snack: Kakinoha-Sushi (Sushi in Persimmon-Blättern)."]},
{id:"nar-mochi",s:"nar",c:"food",t:"Mochi-Stampfen bei Nakatanidou",wp:"Mochi",q:"Nakatanidou Nara mochi",d:"Berühmter Laden, in dem Mochi vor euren Augen in rasender Geschwindigkeit gestampft wird. Das Yomogi-Mochi mit Bohnenpaste ist der Klassiker.",h:"Meist ca. 10:00–18:00",p:"ca. 150–250 ¥ pro Stück",z:"30 Min.",w:"Zentrum von Nara, zu Fuß von Kintetsu Nara",tips:["Schlange einplanen, aber sie geht schnell."]},

/* ---------- OSAKA ---------- */
{id:"osa-castle",s:"osa",c:"sight",t:"Burg Osaka",wp:"Osaka Castle",q:"Osaka Castle",d:"Eines der Wahrzeichen Japans mit grünem Dach und goldenen Verzierungen. Im Burgpark blühen zur Hanami-Zeit mehrere Tausend Kirschbäume.",h:"Park ganztags, Turm ca. 9:00–17:00",p:"Turm ca. 1.200 ¥, Park frei",z:"2–3 Std.",w:"JR Osakajo-koen oder Metro Tanimachi 4-chome",tips:["Der Park ist zur Blüte der Hauptgrund, nicht der Turm.","Bootsfahrt im Burggraben optional."]},
{id:"osa-dotonbori",s:"osa",c:"night",t:"Dotonbori",wp:"Dōtonbori",q:"Dotonbori, Osaka",d:"Neon, Kanal und die berühmte Glico-Läufer-Anzeige. Das Herz von Osakas Streetfood: Takoyaki, Okonomiyaki, Kushikatsu und mehr.",h:"Den ganzen Tag, abends am lebendigsten",p:"Streetfood ca. 500–1.500 ¥",z:"2–3 Std.",w:"Metro Namba, 5 Min. zu Fuß",tips:["Das Glico-Man-Foto am besten von der Ebisu-Brücke.","Beim Essen auf viel Wartezeit gefasst sein.","Osakas Spruch: „Kuidaore“ (essen, bis man umfällt)."]},
{id:"osa-kuromon",s:"osa",c:"market",t:"Kuromon-Markt",wp:"Kuromon Ichiba Market",q:"Kuromon Market, Osaka",d:"Küche Osakas mit über 150 Ständen: Frischer Fisch, Wagyu-Spieße, Meeresfrüchte und Obst. Gut für ein spätes Frühstück.",h:"Meist ca. 9:00–17:00 (Mittags am besten)",p:"Essen ca. 500–2.500 ¥",z:"1–1,5 Std.",w:"Metro Nippombashi",tips:["Viele Stände haben Preisaufschläge für Touristen, vorher vergleichen.","Früh kommen, danach wird es voll."]},
{id:"osa-shinsekai",s:"osa",c:"night",t:"Shinsekai und Tsutenkaku",wp:"Shinsekai",q:"Shinsekai, Osaka",d:"Retro-Viertel mit Neon, Kushikatsu-Spießen und dem Tsutenkaku-Turm. Es wirkt wie ein Stück Osaka der 60er-Jahre.",h:"Restaurants bis spät",p:"Turm ca. 900 ¥, Kushikatsu ab ca. 150 ¥",z:"2 Std.",w:"Metro Ebisucho oder Dobutsuen-mae",tips:["Kushikatsu-Regel: Nicht doppelt in die Soße tunken.","Abends beleuchtet am schönsten."]},
{id:"osa-himeji",s:"osa",c:"trip",t:"Burg Himeji (Tagesausflug)",wp:"Himeji Castle",q:"Himeji Castle",d:"Japans schönste und besterhaltene Burg, UNESCO-Welterbe, wegen ihrer weißen Wände „Weißer Reiher“ genannt. Zur Kirschblüte besonders eindrucksvoll.",h:"Täglich ca. 9:00–17:00 (letzter Einlass ca. 16:00)",p:"2.500 ¥ für Besucher von außerhalb (seit März 2026; Himeji-Einwohner 1.000 ¥)",z:"Halber bis ganzer Tag",w:"JR Special Rapid ab Osaka ca. 1 Std., ca. 1.500 ¥",tips:["Der Preis hat sich 2026 erhöht, vor Ort oder online prüfen.","Mit Garten Koko-en (Eintritt ca. 310 ¥) kombinieren.","Feste Schuhe, im Inneren wird ohne Schuhe gegangen."]},
{id:"osa-usj",s:"osa",c:"fun",t:"Universal Studios Japan",wp:"Universal Studios Japan",q:"Universal Studios Japan, Osaka",d:"Freizeitpark mit Super Nintendo World, Harry Potter, Minions und Achterbahnen. Ein ganzer Tag voller Anstehen und Staunen.",h:"Meist ca. 9:00–21:00 (je nach Saison)",p:"Eintritt ca. 8.600–11.900 ¥ je nach Tag, Express-Pass extra",z:"Ganzer Tag",w:"JR Yumesaki Line bis Universal City, ca. 15 Min. ab Osaka",tips:["Tickets vorab online, an Wochenenden und in den Ferien sehr voll.","Für Super Nintendo World kann ein Zeitfenster nötig sein.","Wer Nintendo nicht mag: ein Tag für Familie und Spaß, sonst Umeda Sky einplanen."]},
{id:"osa-umeda",s:"osa",c:"sight",t:"Umeda Sky Building",wp:"Umeda Sky Building",q:"Umeda Sky Building, Osaka",d:"Zwei Türme, die oben mit einer Aussichtsplattform verbunden sind. Das Floating Garden Observatory bietet eine offene Terrasse und einen Blick bis zum Hafen.",h:"Meist ca. 9:30–22:30",p:"ca. 1.500–2.000 ¥",z:"1 Std.",w:"JR/Metro Osaka Umeda, 10 Min. zu Fuß",tips:["Abends bei Sonnenuntergang am schönsten.","Tickets online mit festem Zeitfenster."]},
{id:"osa-streetfood",s:"osa",c:"food",t:"Takoyaki und Okonomiyaki",wp:"Takoyaki",q:"takoyaki Dotonbori Osaka",d:"Osakas Soulfood: Takoyaki (Oktopus-Bällchen) und Okonomiyaki (herzhafter Pfannkuchen mit Kohl). Gutes Essen ab etwa 700 Yen.",h:"Mittags und abends",p:"Takoyaki ca. 600–900 ¥, Okonomiyaki ca. 900–1.800 ¥",z:"1 Std.",w:"Dotonbori, Shinsekai, Namba",tips:["Takoyaki-Bällchen sind innen sehr heiß, vorsichtig essen.","Bekannte Läden: Kukuru, Wanaka, Mizuno (Okonomiyaki)."]},
{id:"osa-aquarium",s:"osa",c:"fun",t:"Kaiyukan Aquarium",wp:"Osaka Aquarium Kaiyukan",q:"Osaka Aquarium Kaiyukan",d:"Eines der größten Aquarien der Welt mit Walhai und Mantas. Gute Option bei Regenwetter.",h:"Täglich ca. 10:00–20:00",p:"ca. 2.700 ¥",z:"2–3 Std.",w:"Metro Osakako",tips:["Tickets vorab online kaufen.","Neben dem Riesenrad Tempozan."]},
{id:"osa-sumiyoshi",s:"osa",c:"sight",t:"Sumiyoshi-Taisha",wp:"Sumiyoshi-taisha",q:"Sumiyoshi Taisha, Osaka",d:"Einer der ältesten Schreine Japans mit dem berühmten gewölbten Sorihashi-Bogen und ruhiger Atmosphäre fernab der Touristenmengen.",h:"Täglich ca. 6:00–17:00",p:"Eintritt frei",z:"1 Std.",w:"Nankai Sumiyoshitaisha Station",tips:["Ein ruhiger Gegenpol zur Innenstadt."]}

/* ---------- SEOUL ---------- */
{id:"sel-myeongdong",s:"sel",c:"market",t:"Myeongdong Streetfood und Shopping",wp:"Myeongdong",q:"Myeongdong Night Market, Seoul",d:"Koreas Beauty-Hauptstadt mit unzähligen Kosmetikläden, abends dazu der Streetfood-Markt: Spieße, Tteokbokki, Hotteok, Gyeran-ppang.",h:"Läden ca. 10:00–22:00, Streetfood ab ca. 17:00",p:"Streetfood ca. 3.000–10.000 KRW",z:"2 Std.",w:"U-Bahn Myeongdong (Line 4)",tips:["Viele Stände akzeptieren nur Bargeld oder lokale Kartenzahlung.","Kosmetik hat oft Tax-Free-Schalter, Pass mitbringen."]},
{id:"sel-gyeongbok",s:"sel",c:"sight",t:"Gyeongbokgung-Palast",wp:"Gyeongbokgung",q:"Gyeongbokgung Palace, Seoul",d:"Der größte und schönste der fünf Paläste aus der Joseon-Dynastie. Mit dem Wechsel der Wachen vor dem Eingang. Wer einen Hanbok (Tracht) trägt, hat freien Eintritt.",h:"Täglich 9:00 bis ca. 17:00–18:30 je nach Saison. Dienstags geschlossen",p:"3.000 KRW für Erwachsene, frei mit Hanbok",z:"2 Std.",w:"U-Bahn Gyeongbokgung (Line 3), Ausgang 5",tips:["Dienstag ist der Palast geschlossen, daher der Besuch an einem anderen Tag planen.","Hanbok-Verleih in Palastnähe ca. 15.000–30.000 KRW für 2–4 Std.","Die Wachablösung am Gwanghwamun-Tor ist ein Fotomotiv."]},
{id:"sel-bukchon",s:"sel",c:"sight",t:"Bukchon-Hanok-Dorf",wp:"Bukchon Hanok Village",q:"Bukchon Hanok Village, Seoul",d:"Gassen mit traditionellen Holzhäusern (Hanok) an einem Hang, mit Blick über Dächer und Hochhäuser. Dort wohnen weiterhin Menschen, deshalb gelten Ruhezeiten.",h:"Besuchszeit für Touristen meist ca. 10:00–17:00",p:"Eintritt frei",z:"1–1,5 Std.",w:"U-Bahn Anguk (Line 3), Ausgang 2",tips:["Bitte leise sein. In manchen Gassen gelten feste Besuchszeiten und Gebühren bei Verstoß.","Cafés in Hanok-Häusern gibt es auch, die Aussicht ist gut."]},
{id:"sel-insadong",s:"sel",c:"market",t:"Insadong",wp:"Insadong",q:"Insadong, Seoul",d:"Straße mit Teehäusern, Kunsthandwerk, Papierläden und Souvenirs. Ruhiger und traditioneller als Myeongdong.",h:"Läden meist ca. 10:00–20:00",p:"Eintritt frei",z:"1–2 Std.",w:"U-Bahn Anguk oder Jongno 3(sam)-ga",tips:["Probiert Traditionelles wie Patbingsu oder Tee.","Ssamziegil ist ein kleines Kaufhaus mit Kunsthandwerk."]},
{id:"sel-seokchon",s:"sel",c:"nature",t:"Seokchon-See (Kirschblüte)",wp:"Seokchon Lake",q:"Seokchon Lake, Seoul",d:"Kleiner See neben dem Lotte World Tower, den im April ein Tunnel aus Kirschblüten umgibt. Im Hintergrund der Hochhausturm.",h:"Jederzeit, Beleuchtung abends",p:"Eintritt frei",z:"1 Std.",w:"U-Bahn Jamsil (Line 2 und 8)",tips:["Morgens früh am ruhigsten, am Wochenende sehr voll.","Die Blüte hängt von der Witterung ab."]},
{id:"sel-lotte",s:"sel",c:"sight",t:"Lotte World Tower und Seoul Sky",wp:"Lotte World Tower",q:"Seoul Sky Lotte World Tower",d:"Mit 555 m der höchste Wolkenkratzer Koreas. Die Aussichtsplattform Seoul Sky liegt im 117.–123. Stock.",h:"Täglich ca. 10:00–22:00",p:"ca. 29.000–35.000 KRW",z:"1,5 Std.",w:"U-Bahn Jamsil, direkt am Tower",tips:["Online buchen ist günstiger.","Ein Glasboden gibt Nervenkitzel."]},
{id:"sel-hongdae",s:"sel",c:"night",t:"Hongdae am Abend",wp:"Hongdae",q:"Hongdae, Seoul",d:"Das Studentenviertel mit Livemusik, Straßenkünstlern, Cafés und Clubs. Abends voll und jung.",h:"Abends bis spät",p:"Eintritt frei, Essen ca. 8.000–15.000 KRW",z:"2–3 Std.",w:"U-Bahn Hongik Univ. (Line 2, Airport Railroad)",tips:["Straßenkünstler-Auftritte oft am Abend rund um den Spielplatz.","Soju und Bier in einer Bar oder im Convenience Store."]},
{id:"sel-yeouido",s:"sel",c:"nature",t:"Yeouido Hangang Park und Kirschblütenallee",wp:"Yeouido",q:"Yeouido Hangang Park, Seoul",d:"Die Kirschblütenallee hinter der Nationalversammlung ist ein Fixpunkt der Saison, mit Festival-Stimmung und Ständen. Ein paar Schritte weiter liegt der Hangang-Park am Fluss.",h:"Straße abends beleuchtet",p:"Eintritt frei",z:"1–2 Std.",w:"U-Bahn Yeouinaru (Line 5)",tips:["Werktags früh am Morgen kommen. Am Wochenende gibt es Stau und Gedränge.","Zum Picknick am Fluss bei Konbini Ramen kochen."]},
{id:"sel-hanriver",s:"sel",c:"fun",t:"Fahrrad am Han-Fluss",wp:"Han River (Korea)",q:"Banpo Hangang Park bike rental, Seoul",d:"Entlang des Han-Flusses führen breite Radwege. Räder gibt es an Verleihstationen, abends Picknick und Ramen im Konbini.",h:"Verleih meist ca. 9:00–19:00",p:"Radverleih ca. 3.000–5.000 KRW pro Stunde",z:"2 Std.",w:"Yeouido oder Ttukseom Hangang Park",tips:["Banpo Bridge Rainbow Fountain läuft abends (saisonal).","Auf den Radwegen links fahren."]},
{id:"sel-bbq",s:"sel",c:"food",t:"Korean BBQ",wp:"Korean barbecue",q:"Korean BBQ Seoul",d:"Fleisch auf dem Tischgrill, dazu Beilagen, Salat und Reis. Samgyeopsal (Schweinebauch) ist der Klassiker. Zusammen kocht und isst man.",h:"Meist ab ca. 17:00",p:"ca. 15.000–28.000 KRW pro Person (Mindestbestellung 2 Portionen)",z:"1,5–2 Std.",w:"Überall, beliebte Viertel: Mapo, Euljiro, Hongdae",tips:["Fleisch in Salatblätter wickeln, mit Ssamjang und Knoblauch.","Die Lokale verlangen oft mindestens zwei Portionen."]},
{id:"sel-dmz",s:"sel",c:"trip",t:"DMZ-Tour",wp:"Korean Demilitarized Zone",q:"DMZ tour Seoul",d:"Halb- oder Ganztagestour zur Grenze zwischen Nord- und Südkorea: Tunnel, Aussichtspunkt und Dorf Panmunjom (je nach Tour). Bewegend und politisch.",h:"Touren meist ca. 8:00–17:00, nicht an allen Tagen",p:"ca. 60.000–150.000 KRW je nach Tour",z:"4–9 Std.",w:"Abholung in Seoul, ca. 1 Std. Fahrt",tips:["Vorab buchen, Reisepass mitbringen, Kleiderordnung beachten.","Die Strecke kann je nach politischer Lage gesperrt sein."]},
{id:"sel-bukhansan",s:"sel",c:"nature",t:"Bukhansan-Wanderung",wp:"Bukhansan National Park",q:"Bukhansan National Park",d:"Nationalpark mit Granit-Gipfeln direkt am Stadtrand. Der Aufstieg zum Baegundae-Gipfel (836 m) dauert ca. 4–5 Std. hin und zurück. Anstrengend, aber mit Blick auf ganz Seoul.",h:"Täglich bei Tageslicht",p:"Eintritt frei",z:"4–6 Std.",w:"U-Bahn Gupabal (Line 3) und Bus",tips:["Feste Wanderschuhe, Wasser und Snacks. Im Frühjahr kann es noch kalt sein.","Koreaner wandern oft in voller Ausrüstung, Cafés und Makgeolli-Stände unten."]},
{id:"sel-namsan",s:"sel",c:"sight",t:"N Seoul Tower am Namsan",wp:"N Seoul Tower",q:"N Seoul Tower, Seoul",d:"Turm auf dem Namsan-Berg. Der Weg hinauf führt durch einen Park, die Seilbahn ist eine Alternative. Abends glitzert die Stadt unter euch.",h:"Täglich ca. 10:00–23:00",p:"Aussichtsplattform ca. 21.000 KRW, Seilbahn ca. 15.000 KRW",z:"2 Std.",w:"Zu Fuß ab U-Bahn Myeongdong oder Seilbahn",tips:["Zum Sonnenuntergang kommen.","Liebesschlösser am Zaun gehören dazu, Schloss mitbringen oder vor Ort kaufen."]},
{id:"sel-gwangjang",s:"sel",c:"food",t:"Gwangjang-Markt",wp:"Gwangjang Market",q:"Gwangjang Market, Seoul",d:"Einer der ältesten Märkte Seouls, berühmt für Bindaetteok (Mungbohnen-Pfannkuchen), Mayak-Kimbap, Yukhoe (Rindertatar) und Tteokbokki.",h:"Meist ca. 9:00–22:00",p:"Gerichte ca. 5.000–15.000 KRW",z:"1,5 Std.",w:"U-Bahn Jongno 5(o)-ga (Line 1)",tips:["Auf den Hockern am Stand sitzen und teilen.","Mittags am vollsten, späte Nachmittage sind ruhiger."]},
{id:"sel-changdeok",s:"sel",c:"sight",t:"Changdeokgung und Geheimer Garten",wp:"Changdeokgung",q:"Changdeokgung Palace, Seoul",d:"UNESCO-Welterbe-Palast mit dem Huwon (Geheimer Garten), der nur mit Führung besichtigt werden kann. Oft ruhiger und natürlicher als Gyeongbokgung.",h:"Meist ca. 9:00–17:30, Montag geschlossen",p:"ca. 3.000 KRW (Palast), Garten ca. 5.000 KRW extra",z:"2 Std.",w:"U-Bahn Anguk (Line 3)",tips:["Für den Garten Plätze für die Führung vorab buchen.","Zur Kirschblüte sehr schön."]},
{id:"sel-ikseon",s:"sel",c:"food",t:"Ikseon-dong",wp:"Ikseon-dong",q:"Ikseon-dong Hanok Village, Seoul",d:"Enge Gassen mit renovierten Hanok-Häusern voller Cafés, Boutiquen und kleinen Restaurants. Sehr fotogen.",h:"Läden meist ca. 11:00–22:00",p:"Kaffee ca. 5.000–8.000 KRW",z:"1,5 Std.",w:"U-Bahn Jongno 3(sam)-ga",tips:["Am Abend beleuchtet, am Wochenende voll."]},
{id:"sel-ddp",s:"sel",c:"sight",t:"Dongdaemun Design Plaza",wp:"Dongdaemun Design Plaza",q:"Dongdaemun Design Plaza, Seoul",d:"Futuristischer Gebäudekomplex der Architektin Zaha Hadid. Nachts erstrahlt die Fassade, nebenan Mode- und Nachtmärkte.",h:"Außenbereich jederzeit, Ausstellungen ca. 10:00–19:00",p:"Außenbereich frei",z:"1 Std.",w:"U-Bahn Dongdaemun History & Culture Park",tips:["Abends ist das Gebäude beleuchtet, und im Park leuchtet ein LED-Rosengarten."]},
{id:"sel-cheonggye",s:"sel",c:"nature",t:"Cheonggyecheon-Bach",wp:"Cheonggyecheon",q:"Cheonggyecheon Stream, Seoul",d:"Renovierter Wasserlauf mitten in der Stadt, einst unter einer Hochstraße begraben. Gut für einen entspannten Abendspaziergang.",h:"Jederzeit",p:"Eintritt frei",z:"1 Std.",w:"U-Bahn City Hall oder Gwanghwamun",tips:["Abends mit Beleuchtung am schönsten."]},
{id:"sel-starfield",s:"sel",c:"fun",t:"Starfield Library (COEX)",wp:"COEX Mall",q:"Starfield Library COEX Mall, Seoul",d:"Riesige öffentliche Bibliothek mit 13 m hohen Bücherregalen mitten in einem Einkaufszentrum. Kostenlos zugänglich und sehr fotogen.",h:"Meist ca. 10:30–22:00",p:"Eintritt frei",z:"30–45 Min.",w:"U-Bahn Samseong oder Bongeunsa",tips:["Am Wochenende sehr voll, früh am Tag kommen.","Mit dem Aquarium im COEX kombinierbar."]},
{id:"sel-seongsu",s:"sel",c:"market",t:"Seongsu-dong",wp:"Seongsu-dong",q:"Seongsu-dong, Seoul",d:"Das „Brooklyn von Seoul“: Fabrikhallen als Cafés, Concept-Stores und Pop-ups. Gut für Mode, Design und besonderen Kaffee.",h:"Läden meist ca. 11:00–21:00",p:"Eintritt frei",z:"2–3 Std.",w:"U-Bahn Seongsu (Line 2)",tips:["Lange Schlangen vor angesagten Pop-ups.","Nachmittags am angenehmsten."]},
{id:"sel-jjimjilbang",s:"sel",c:"fun",t:"Jjimjilbang (koreanisches Bad)",wp:"Jjimjilbang",q:"Dragon Hill Spa Seoul jjimjilbang",d:"Koreanisches Spa mit Saunen, heißen Becken, Ruheräumen und Snacks. Nach langen Tagen und Wanderungen das beste Erholungsprogramm.",h:"Oft rund um die Uhr geöffnet",p:"ca. 12.000–25.000 KRW",z:"2–4 Std.",w:"Dragon Hill Spa (Yongsan) ist ein bekanntes Beispiel",tips:["Bei Nacktbereichen sind die Bereiche nach Geschlecht getrennt.","Der Eintritt enthält meist Bademantel und Handtuch."]},

const EUR_RX=/(\d[\d.]*)(?:\s*[–-]\s*(\d[\d.]*))?\s*(THB|VND|JPY|KRW|USD|US\$|¥)/g;
function eurize(t){
  if(t==null)return '';

    const cur=c==='¥'?'JPY':c==='US$'?'USD':c,r=store&&store.set.rates[cur];
    if(!r)return m;
    const p=s=>parseFloat(s.replace(/\./g,'')),lo=p(a)/r,hi=b?p(b)/r:null;
    return m+' (≈ '+(hi!=null?eurR(lo)+'–'+eurR(hi):eurR(lo))+' €)';
  });
}

    if(pe&&ty==='zug'){pe.setAttribute('pathLength','1');pe.style.animationDelay=(i*.14)+'s'}
    const mp=pts.length>2?pts[Math.floor(pts.length/2)]:[(pts[0][0]+pts[1][0])/2,(pts[0][1]+pts[1][1])/2],sh=Math.hypot(a.ll[0]-b.ll[0],a.ll[1]-b.ll[1])<3;
    const tm=L.marker(mp,{icon:L.divIcon({className:'ltri'+(sh?' s':''),html:`<div class="tri2" style="--sc:var(--${cst})">${trI(ty,15)}</div>`,iconSize:[26,26],iconAnchor:[13,13]}),keyboard:false,zIndexOffset:300}).addTo(map);
    tm.bindTooltip(`${TRN[ty]}: ${a.n} → ${b.n}${ROUTE_META[i][1]?' · '+ROUTE_META[i][1]:''}`,{direction:'top'});
  }

   hm.on('click',()=>selectStop('home'));LM.mk.home=hm}

  map.on('zoomend',LM.sync);buildActs();

/* Ohne Start bleibt das Symbol still stehen: am Ort des gewählten Tages, mit dem Verkehrsmittel, das dorthin führt */
function idleLoop(){
  const map=LM.map;if(!map||!LM.trav||LM.busy)return;
  const i=state.day,sg=segsOn(i),ty=sg.length?ROUTE_META[sg[sg.length-1]][0]:'flug';
  const ll=i===0?STOPS.home.ll:STOPS[stopAt(i)].ll;
  LM.trav.setLatLng([ll[1],ll[0]]);setTrav(ty,0);
}
function buildActs(){
  if(!LM.acts)return;LM.acts.clearLayers();
  ACTS.forEach(a=>{
    if(!a.ll||!ORDER.includes(a.s)||(state.mc!=='all'&&state.mc!=='none'&&a.c!==state.mc))return;
    const m=L.circleMarker(a.ll,{radius:8,weight:2,className:'am am-'+a.c+(store.vis[a.id]?' seen':''),fillOpacity:.95,bubblingMouseEvents:false});
    m.bindTooltip(a.t,{direction:'top',offset:[0,-6]});m.on('click',()=>showAct(a.id));m.addTo(LM.acts);
  });
  if(LM.sync)LM.sync();
}
function showAct(id){
  const a=ACTSBY[id];if(!a)return;state.act=id;
  if(state.sel!==a.s)selectStop(a.s,{fly:false,keepAct:true});else{const d=$('#kdet');if(d)d.innerHTML=stopDetail(a.s)}
  const el=$('[data-act="'+id+'"]');if(el){el.open=true;el.scrollIntoView({behavior:'smooth',block:'nearest'})}
  if(LM.map&&a.ll){if(LM.busy)stopTour();LM.map.flyTo(a.ll,Math.max(Math.min(LM.map.getZoom(),15),14),{duration:1.2})}
}
function selectStop(id,o={}){
  state.sel=id;if(!o.keepAct)state.act=null;
  const d=$('#kdet');if(d)d.innerHTML=stopDetail(id);
  const l=$('#klist');if(l)l.outerHTML=stopListHtml(id);
  Object.keys(LM.mk).forEach(k=>{const e=LM.mk[k].getElement();if(e)e.classList.toggle('sel',k===id)});
  if(o.fly!==false&&LM.map){if(LM.busy)stopTour();const z=LM.map.getZoom();LM.map.flyTo([STOPS[id].ll[1],STOPS[id].ll[0]],z<8?10:Math.min(z,12),{duration:1.4})}
  refreshWx([id]);
}
function setView(v){

  const s=$('#kview');if(s)s.value=v;
  const d=$('#kdet');if(d)d.innerHTML=stopDetail(null);

function updateDetail(){const d=$('#kdet');if(d)d.innerHTML=stopDetail(state.sel)}
const setTourBtn=on=>{const b=$('#tourbtn');if(b){b.textContent=on?'■ Stopp':'▶ Abspielen';b.setAttribute('aria-pressed',on?'true':'false')}const i=$('#tourinfo');if(i&&!on)i.hidden=true};
function stopTour(){if(LM.busy&&LM.map){try{LM.map._moveEnd(true)}catch(e){}}LM.tid++;LM.busy=false;setTourBtn(false);idleLoop()}
/* Rundflug: die Kamera fährt dem Symbol hinterher, zoomt bei langen Strecken heraus und an jedem Ort wieder hinein */
function runTour(){
  const map=LM.map;if(!map)return;
  if(LM.busy){stopTour();return}
  const my=++LM.tid;LM.busy=true;cancelAnimationFrame(LM.raf);setTourBtn(true);
  const N=ROUTE.length,ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2,lerp=(a,b,t)=>a+(b-a)*t;
  const stopZ=k=>ROUTE[k]==='home'?5:10;
  const P=[{t:'stop',k:0,dur:1500}];
  for(let k=1;k<N;k++){
    const a=STOPS[ROUTE[k-1]],b=STOPS[ROUTE[k]],len=Math.hypot(a.ll[0]-b.ll[0],a.ll[1]-b.ll[1]),ty=ROUTE_META[k][0];
    const z=Math.max(2,Math.min(10,map.getBoundsZoom(L.latLngBounds(LM.seg[k]),false,L.point(70,70))));
    P.push({t:'move',k,ty,z,dur:ty==='flug'?Math.max(3500,Math.min(8000,3200+len*70)):Math.max(2600,Math.min(4500,2200+len*250))});
    P.push({t:'stop',k,dur:k===N-1?2400:1800});
  }
  const alive=()=>LM.map===map&&LM.tid===my,info=$('#tourinfo');
  let idx=0,t0=performance.now(),fresh=true,cz=map.getZoom(),cc=map.getCenter();
  putTrav(LM.seg[1],0,ROUTE_META[1][0]);
  map._stop();map._moveStart(true,false);let lastEnd=0;
  const frame=now=>{
    if(!alive())return;
    const ph=P[idx],u=Math.min(1,(now-t0)/ph.dur);let tgt,z;
    if(ph.t==='move'){
      const a=STOPS[ROUTE[ph.k-1]],b=STOPS[ROUTE[ph.k]],f=ease(u);
      putTrav(LM.seg[ph.k],f,ph.ty);tgt=posOn(LM.seg[ph.k],f).ll;
      const z0=stopZ(ph.k-1),z1=stopZ(ph.k);
      z=u<.2?lerp(z0,ph.z,ease(u/.2)):u>.8?lerp(ph.z,z1,ease((u-.8)/.2)):ph.z;
      if(fresh&&info){info.hidden=false;info.innerHTML=`${trI(ph.ty,16)}<span>${TRN[ph.ty]}: ${esc(a.n)} → ${esc(b.n)}</span>`}
    }else{
      const s=STOPS[ROUTE[ph.k]];tgt=[s.ll[1],s.ll[0]];z=stopZ(ph.k);
      if(fresh){selectStop(ROUTE[ph.k],{fly:false});if(info){info.hidden=false;info.innerHTML=`${trI(ROUTE[ph.k]==='home'?'home':'flug',16)}<span>${esc(s.n)}</span>`}}
    }
    fresh=false;
    const k=ph.t==='move'?.22:.14;
    cc=L.latLng(cc.lat+(tgt[0]-cc.lat)*k,cc.lng+(tgt[1]-cc.lng)*k);cz+=(z-cz)*.12;
    map._move(cc,cz,{flyTo:true});
    if(now-lastEnd>300){lastEnd=now;map._moveEnd(true);map._moveStart(true,false)}
    if(u>=1){idx++;t0=now;fresh=true;if(idx>=P.length){LM.busy=false;setTourBtn(false);map._moveEnd(true);map.flyToBounds(bbOf(state.mv),{padding:[16,16],duration:2});idleLoop();return}}
    LM.raf=requestAnimationFrame(frame);
  };
  LM.raf=requestAnimationFrame(frame);
}

/* Buchungen */
function bkCard(b){
  const st=b.stop?STOPS[b.stop].st:stageOf(Math.min(ND()-1,b.a)).id;
  const date=addDays(START,b.a);
  let t,rows='';
  if(b.k==='stay'){
    const n=b.b-b.a+1;t=b.name||'Noch nicht eingetragen';
    rows=`<div class="row"><span><b>${fmtL(date)}</b> bis <b>${fmtL(addDays(START,b.b+1))}</b></span><span>${n} ${n>1?'Nächte':'Nacht'}</span><span>${esc(b.t)}</span></div>`+(b.addr?`<p class="addr note">${esc(b.addr)}</p>`:'')+`<div class="row">${b.tin?`<span>Check-in ${esc(b.tin)}</span>`:''}${b.tout?`<span>Check-out ${esc(b.tout)}</span>`:''}${b.total?`<span><b>${eur2(num(b.total))}</b></span>`:''}${b.ref?`<span>Nr. ${esc(b.ref)}</span>`:''}</div>`;
  }else{
    t=bkTitle(b);
    rows=`<div class="row"><span><b>${fmtL(date)}</b>${b.time?' · '+esc(b.time):''}</span>${b.k==='leg'?`<span>${esc(b.t)}</span>`:''}${b.total?`<span><b>${eur2(num(b.total))}</b></span>`:''}${b.ref?`<span>Nr. ${esc(b.ref)}</span>`:''}</div>`;
  }
  if(b.note)rows+=`<p class="note">${esc(b.note)}</p>`;
  const set=b.k==='stay'?!!b.name:!!b.booked;
  const nav=b.k==='stay'&&b.name?`<a href="${mapsQ(b.name+' '+(b.addr||STOPS[b.stop].q))}" target="_blank" rel="noopener">Route ↗</a>`:'';
  return `<article class="bk" style="--sc:var(--${st})"><i></i><div class="in"><div class="cnt"><span class="tag ${set?'ok':''}">${set?(b.k==='stay'?'✓ eingetragen':'✓ gebucht'):'offen'}</span></div><h3>${esc(t)}</h3>${rows}<div class="links"><button data-editbk="${b.id}">${set?'Bearbeiten':b.k==='stay'?'Eintragen':'Buchung eintragen'}</button>${nav}${b.custom?`<button data-delbk="${b.id}">Löschen</button>`:''}</div></div></article>`;
}

function render(soft){
  unmountMap();renderTrips();
  document.body.classList.toggle('nofab',!['heute','geld'].includes(state.tab));
  $('#tabs').innerHTML=TABS.map(t=>`<button data-tab="${t[0]}" ${t[0]===state.tab?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${t[2]}</svg>${t[1]}</button>`).join('');
  $('#view').innerHTML=TABS.find(t=>t[0]===state.tab)[3]();
  if(state.tab==='karte')mountMap();
  if(!soft){
    if(state.tab==='heute')refreshWx([stopAt(state.day),...[1,2,3,4].filter(j=>state.day+j<ND()).map(j=>stopAt(state.day+j))]);
    else if(state.tab==='karte'&&state.sel)refreshWx([state.sel]);
    else if(state.tab==='mehr'&&state.more==='wetter')refreshWx(ORDER);
    else if(state.tab==='plan')refreshWx(ORDER);
  }
}
function go(tab,top=true){state.tab=tab;render();if(top)scrollTo(0,0)}
const keep=()=>{const y=scrollY;render();scrollTo(0,y)};

let sheetEl=null;
function closeSheet(){if(sheetEl){sheetEl.remove();sheetEl=null;document.body.classList.remove('noscroll')}}
function openSheet(title,body,onSave,label){
  closeSheet();
  const el=document.createElement('div');el.className='ov';
  el.innerHTML=`<div class="sh2" role="dialog" aria-modal="true" aria-label="${esc(title)}"><form><div class="shh"><h2>${esc(title)}</h2><button type="button" class="x" data-close aria-label="Schließen">×</button></div>${body}<div class="shf"><button type="button" class="btn" data-close>Abbrechen</button><button class="btn pri" type="submit">${label||'Speichern'}</button></div></form></div>`;
  document.body.appendChild(el);document.body.classList.add('noscroll');sheetEl=el;
  const form=$('form',el);
  el.addEventListener('click',e=>{if(e.target===el||e.target.closest('[data-close]'))closeSheet()});
  form.addEventListener('submit',e=>{e.preventDefault();if(onSave(new FormData(form),form)!==false)closeSheet()});
  const f=$('input[type=text],input[type=number]',form);if(f)f.focus({preventScroll:true});
  return form;
}
